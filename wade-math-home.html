<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wade Classical — Math Home</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--parch:#F4ECDA;--card:#FBF6EA;--forest:#204B3A;--brass:#C9972B;--ink:#1E2A24;--muted:#55604F;--line:#E2D6BC;
 --teal:#17607A;--teal-d:#0F4A5F;--rose:#A8325E;--rose-d:#7A1F45;--ok:#2E7D4F;--warn:#B7791F;--bad:#A8323A;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--parch);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--forest);color:#fff;flex-wrap:wrap}
.top .brand{font-family:'Cinzel',serif;letter-spacing:.06em;font-size:15px;cursor:pointer}
.top .sp{flex:1}
.top a.pill,.top button.pill{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:500 14px Jost;text-decoration:none;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:10px 16px;font:500 15px Jost;cursor:pointer;background:var(--forest);color:#fff}
.btn.alt{background:#fff;color:var(--forest);border:1px solid var(--forest)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.btn.k{background:var(--kc)}
input,textarea,select{font:400 15px Jost;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px;font-weight:500}
.muted{color:var(--muted)}.small{font-size:13px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.who{border:0;border-radius:18px;padding:34px 18px;color:#fff;cursor:pointer;font:700 32px 'Cormorant Garamond',serif;text-align:center}
.who small{display:block;font:400 14px Jost;opacity:.85;margin-top:6px}
.who.ryder{background:var(--teal)}.who.hadley{background:var(--rose)}.who.mom{background:var(--forest)}
.ryder{--kc:var(--teal);--kd:var(--teal-d)}.hadley{--kc:var(--rose);--kd:var(--rose-d)}
.khead{background:var(--kc);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:16px}
.khead h1{font-size:34px}.khead .sub{opacity:.9;font-size:15px}
.tabs{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.tab{border:1px solid var(--kc,var(--forest));color:var(--kc,var(--forest));background:#fff;border-radius:999px;padding:7px 16px;font:500 14px Jost;cursor:pointer;text-decoration:none}
.tab.on{background:var(--kc,var(--forest));color:#fff}
.focus{border-left:6px solid var(--kc);background:#fff}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--kc,var(--forest));background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;font-size:19px;color:#fff;margin-top:1px}
.chk.on{background:var(--kc,var(--forest))}
.rt{flex:1}.rt .t{font-weight:500;font-size:17px}.done .t{text-decoration:line-through;opacity:.55}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:#fff;margin-left:6px;vertical-align:middle}
.b-got{background:var(--ok)}.b-needs{background:var(--warn)}.b-redo{background:var(--bad)}.b-wait{background:#8a8f7a}
.linkchip{display:inline-block;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;text-decoration:none;color:var(--kc,var(--forest))}
.msg{background:#FFF6D8;border:1px solid var(--brass);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.msg .from{font:700 13px Jost;color:#8a6414;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:860px){.week{grid-template-columns:1fr}}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.day.today{border:2px solid var(--kc)}
.day h4{font:700 15px Jost;margin-bottom:6px;color:var(--kc)}
.mini{font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}.mini:last-child{border:0}
.bar{height:10px;border-radius:6px;background:#e7dec7;overflow:hidden}.bar>i{display:block;height:100%;background:var(--kc,var(--forest))}
/* ladder */
.ladder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.ladder{grid-template-columns:1fr}}
.rungs{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;font:400 15px Jost;width:100%}
.rung .n{font:700 16px 'Cormorant Garamond',serif;width:30px;color:var(--muted)}
.rung .f{flex:1}.rung .s{font-size:12px;font-weight:600}
.rung.mastered{background:#E5F1E8;border-color:#9CC8A9}.rung.mastered .s{color:var(--ok)}
.rung.current{background:var(--kc);color:#fff;border-color:var(--kc)}.rung.current .n,.rung.current .s{color:#fff}
.rung.next{border:2px dashed var(--kc)}.rung.next .s{color:var(--kc)}
.rung.skipped{background:#F1EBDC;opacity:.8}.rung.skipped .s{color:var(--warn)}
.rung.sel{outline:3px solid var(--brass)}
.cov-w{color:var(--ok)}.cov-p{color:var(--warn)}.cov-n{color:var(--bad)}
.stage{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stage b{font-family:'Cinzel',serif;width:34px}
.pin{max-width:340px;margin:60px auto;text-align:center}
.pin input{text-align:center;font-size:28px;letter-spacing:.4em;margin:14px 0}
.hide{display:none}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.qcard.bad{border-color:var(--bad);background:#FDF3F2}.qcard.good{border-color:#9CC8A9}
.qnum{font:700 13px Jost;color:var(--kc);margin-bottom:4px}
.qtext{font-size:18px;margin-bottom:8px}
.qopt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:17px;background:#fff}
.qopt input{width:auto}
.qans{font-size:20px;max-width:260px}
.score{font:700 54px 'Cormorant Garamond',serif}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9}
.gwrap{margin:6px 0 4px;overflow-x:auto;padding-bottom:4px}
.gr{display:flex;align-items:center}
.gc{width:44px;height:50px;display:flex;align-items:center;justify-content:center;font:600 30px Jost,sans-serif;color:var(--ink);flex:none}
.gc.gs0{width:30px}
.gc.gp{width:18px;font-size:34px}
.gc.gm{width:14px;font-size:34px;align-items:flex-end;padding-bottom:4px;color:var(--ink)}
.gc.go{color:var(--muted);font-weight:400}
.gans{border-top:3px solid var(--ink);margin-top:4px;padding-top:4px}
.gb{width:42px;height:48px;margin:0 1px;text-align:center;font:600 28px Jost,sans-serif;border:2px solid #B9C7D9;background:#EEF3FB;border-radius:7px;padding:0;flex:none;color:var(--ink)}
.gb:focus{outline:0;border-color:#2F6FDB;background:#DCE8FB;box-shadow:0 0 0 2px #2F6FDB33}
.gb.gs{width:30px;font-size:24px}
.gdiv{display:flex;align-items:flex-start;gap:0}
.gdv{height:50px;margin-top:54px;padding-right:8px;display:flex;align-items:center;font:600 30px Jost,sans-serif}
.gdd{border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:8px 0 0 0;padding-left:2px;margin-top:4px}
.grm{display:flex;align-items:center;margin:54px 0 0 14px;gap:6px;font:600 22px Jost,sans-serif;color:var(--muted)}
.gk{width:36px;height:30px;margin:0 4px;text-align:center;font:500 17px Jost,sans-serif;border:1.5px dashed #C9A94B;background:#FFF8E1;border-radius:6px;padding:0;flex:none;color:var(--muted)}
.gk:focus{outline:0;border-color:#C9972B;background:#FFF0C2}
.gkw{width:44px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.pcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pctitle{font:600 26px 'Cormorant Garamond',serif;margin:0 6px;min-width:190px}
.pcscroll{overflow-x:auto}
.pcgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pcw{min-width:720px}
.pcdow{font:600 12px Jost;color:var(--muted);text-align:center;padding:2px 0}
.pcd{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:78px;padding:4px 6px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit;color:var(--ink);display:block;width:100%}
.pcd.we{background:#F6F1E4}.pcd.out{opacity:.4}
.pcd.today{border:2px solid var(--brass)}.pcd.sel{outline:3px solid var(--forest);outline-offset:-1px}
.pcn{font:600 14px Jost;margin-bottom:3px}
.pcp{display:inline-block;border-radius:999px;padding:1px 8px;color:#fff;font-size:12px;margin:1px 3px 0 0;font-weight:600}
.pcp.r{background:var(--teal)}.pcp.h{background:var(--rose)}
.pck{font:600 15px Jost;margin:12px 0 4px}
.pck.r{color:var(--teal)}.pck.h{color:var(--rose)}
.pcdw{min-height:110px}
.pcchip{display:block;border-left:4px solid var(--kc);background:#FBF6EA;border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.pcchip.dn{opacity:.6;text-decoration:line-through}
.pcyear{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcym{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.pcym h4{font:600 17px 'Cormorant Garamond',serif;margin-bottom:4px;cursor:pointer;background:none;border:0;padding:0;color:var(--forest);text-align:left}
.pcyg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.pcyd{font:500 11px Jost;text-align:center;padding:5px 0;border-radius:5px;cursor:pointer;border:0;background:transparent;color:var(--ink);font-family:inherit}
.pcyd.r{background:#BFDCE6}.pcyd.h{background:#EBC1D2}.pcyd.b{background:linear-gradient(135deg,#BFDCE6 50%,#EBC1D2 50%)}
.pcyd.today{outline:2px solid var(--brass)}.pcyd.sel{outline:2px solid var(--forest)}.pcyd.blank{cursor:default}
.pcfocus{display:block;background:var(--forest);color:#fff;border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:11px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.ldg{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:4px;align-items:center;margin:4px 0}
.ldw{font:600 12px Jost;color:var(--muted)}
.ldd{border:1px solid var(--kc);color:var(--kc);background:#fff;border-radius:8px;padding:7px 0;font:500 13px Jost;cursor:pointer}
.ldd.on{background:var(--kc);color:#fff}
.ldd:disabled{opacity:.35;cursor:default}
.pstep{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.pstep:last-child{border-bottom:0}
.pnum{width:30px;height:30px;flex:none;border-radius:50%;background:var(--kc);color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px Jost}
.pstep.lock .pnum{background:#B8B29E}.pstep.lock{opacity:.8}
.pstep.dn .pnum{background:var(--ok)}
.canbox{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.canrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;font:500 16px Jost,sans-serif;color:var(--ink);cursor:default;margin:0}
button.canrow{cursor:pointer}
.canbox>.canrow:first-of-type{margin-top:6px}
.canrow .cb{width:24px;height:24px;flex:none;border:2px solid #B8B29E;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#fff}
.canrow.on .cb{background:var(--ok);border-color:var(--ok)}
.gapwk{padding:10px 0;border-top:1px solid var(--line)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gcap{font-size:17px;color:var(--muted);margin-bottom:4px}
#kp{position:fixed;left:0;right:0;bottom:0;background:#F3F5F8;border-top:1px solid #C9D3E0;padding:8px;display:none;z-index:8;justify-content:center}
#kp .kg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:460px;width:100%}
#kp button{height:46px;font:600 22px Jost,sans-serif;border:1px solid #B9C7D9;border-radius:9px;background:#fff;cursor:pointer}
body.kpon #kp{display:flex}
body.kpon{padding-bottom:70px}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.tog .tab{padding:6px 14px}
</style>
</head>

function getIn(path){return path.split('/').reduce((o,k)=>o==null?undefined:o[k],S);}
function put(path,val){
  const keys=path.split('/');let o=S;
  for(let i=0;i<keys.length-1;i++){if(typeof o[keys[i]]!=='object'||o[keys[i]]===null)o[keys[i]]={};o=o[keys[i]];}

  if(val===null||val===undefined)delete o[last];else o[last]=val;

}

    h+='</div></div>';return h;
  }
  const dec=Math.max.apply(null,g.tk.map(t=>t.indexOf('.')<0?0:t.length-t.indexOf('.')-1));
  const astr=Math.abs(g.a).toFixed(dec);const aInt=astr.split('.')[0].length;
  const ints=g.tk.map(t=>t.split('.')[0].length);const I=Math.max(aInt,Math.max.apply(null,ints));
  const neg=g.a<0;
  const cm=(k,len)=>(k<I-1&&(I-1-k)%3===0)?cell(k>=I-len?',':'','gm'):'';
  if(carryOn(QZ?QZ.kid:'')){
    const ck=(k,mx)=>{const v=(QZ&&QZ.ck&&QZ.ck[i]&&QZ.ck[i][k])||'';return '<span class="gkw"><input class="gk" data-ck="'+i+'" data-k="'+k+'" maxlength="'+mx+'" autocomplete="off" inputmode="numeric" value="'+esc(v)+'" oninput="gIn(this)" onfocus="GF=this;try{this.select()}catch(e){}" aria-label="'+(g.k==='sub'?'borrow box':'carry box')+'"></span>';};
    const total=I+(dec?1+dec:0);let kk=0;
    h+='<div class="gr gkr">'+(neg?cell('','gs0'):'')+cell('')+'';
    for(let c=0;c<total;c++){
      const isDot=dec&&c===I;
      const last=c===total-1;
      if(isDot||(g.k!=='sub'&&last))h+=(isDot?cell('','gp'):cell(''));
      else h+=ck(kk++,g.k==='sub'?2:1);
      if(c<I-1&&(I-1-c)%3===0)h+=cell('','gm');
    }
    h+='</div>';
  }
  g.tk.forEach((t,r)=>{
    const ip=t.split('.')[0],fp=t.indexOf('.')<0?'':t.split('.')[1];
    h+='<div class="gr">'+(neg?cell('','gs0'):'');
    h+=cell(r===g.tk.length-1?g.op:'','go');
    for(let k=0;k<I-ip.length;k++)h+=cell('')+cm(k,ip.length);
    for(let x=0;x<ip.length;x++)h+=cell(ip[x])+cm(I-ip.length+x,ip.length);
    if(dec){h+=cell(fp?'.':'','gp');for(let k=0;k<dec;k++)h+=cell(fp[k]||'');}
    h+='</div>';
  });
  h+='<div class="gr gans">'+cell('','go');
  if(neg)h+=inp('s');
  for(let k=0;k<I-aInt;k++)h+=cell('')+cm(k,aInt);
  for(let k=0;k<aInt;k++)h+=inp('d')+cm(I-aInt+k,aInt);
  if(dec){h+=cell('.','gp');for(let k=0;k<dec;k++)h+=inp('f');}
  h+='</div></div>';return h;
}

/* ---------- test out / lesson / quiz path ---------- */
function pathCard(kid,n,mom){
  const K=KIDS[kid];const st=weekStatus(kid,n),g=gradeOf(kid,n),stg=stageOf(kid,n),hq=hasQuiz(kid,n);
  const dt=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const tests=quizAttempts(kid,n,'test'),quizzes=quizAttempts(kid,n,'quiz');
  const q=(x)=>'\''+kid+'\','+n+(x?','+x:'');
  let h='<div class="'+K.cls+'" style="margin-top:12px">';
  if(st==='mastered'){
    h+='<div class="pstep dn"><div class="pnum">✓</div><div><b>Week '+n+' is mastered</b>'+(g?'<div>Grade <b>'+g.letter+'</b> · '+(g.how==='test'?'tested out':'quiz '+g.score+'/15')+'</div>':'<div class="small muted">Marked mastered by Mom.</div>')+'</div></div>'+canBlock(kid,n,mom)+'</div>';
    return h;
  }
  // 1 test out
  h+='<div class="pstep"><div class="pnum">1</div><div><b>TEST OUT</b><div class="small">'
    +(!hq?'No test-out written for this week yet.':!tests.length?'Already know this? Prove it and skip the lesson. A pass counts as an A.':'Tried '+dt(tests[tests.length-1].ts)+' · '+tests[tests.length-1].score+'/15 · not yet. On to the lesson.')+'</div>';
  if(hq&&!tests.length){
    h+='<div class="pbtns">'+(mom?'<button class="btn sm k" onclick="giveQuiz('+q("'test'")+')">Give test-out today</button><button class="btn sm alt" onclick="openQuiz('+q("'test'")+')">Open here</button>':'<button class="btn sm k" onclick="openQuiz('+q("'test'")+')">Test out</button>')+'</div>';
  }
  h+='</div></div>';
  // 2 lesson
  const built=lessonList(kid,n);
  const lined=assignList(kid).filter(a=>a.week===n).length;
  h+='<div class="pstep"><div class="pnum">2</div><div><b>LESSON</b><div class="small">'
    +(stg==='check'?'Done.':stg==='ready'?'Practice done. Ready for the quiz.':stg==='lesson'?'In progress. Take a few days of practice.':'Not started.')
    +(lined?' · '+lined+' day'+(lined>1?'s':'')+' lined up':'')+'</div>';
  if(built.length){h+='<div class="pbtns">'+built.map(l=>'<a class="btn sm k" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+esc(l.u)+'">'+esc(l.t)+'</a>'+(mom&&l.mom?'<a class="btn sm alt" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+esc(l.u)+'?mom=1">Mom view</a>':'')).join('')+'</div>';}
  else h+='<div class="small muted" style="margin-top:4px">No built lesson for this week yet.</div>';
  h+='<div class="pbtns">';
  if(!stg)h+='<button class="btn sm '+(mom?'alt':'k')+'" onclick="startLesson('+q()+')">Start lesson</button>';
  if(mom&&stg==='lesson')h+='<button class="btn sm ok" onclick="setStage('+q("'ready'")+')">Ready for quiz</button>';
  if(mom&&stg==='ready')h+='<button class="btn sm alt" onclick="setStage('+q("'lesson'")+')">Back to lesson</button>';
  h+='</div></div></div>';
  // 3 quiz
  const open=stg==='ready';
  h+='<div class="pstep '+(open||stg==='check'?'':'lock')+'"><div class="pnum">'+(open?'3':stg==='check'?'✓':'🔒')+'</div><div><b>QUIZ</b><div class="small">'
    +(stg==='check'?'Passed'+(g?' · Grade '+g.letter:'')+'. Check off every I can below to master the week.':!hq?'No quiz written for this week yet. Mom marks the week mastered.':open?'Open. 15 questions, 13 to pass. A pass is graded.':mom?'Locked until you tap Ready for quiz.':'Locked until Mom says you are ready.')+'</div>';
  if(quizzes.length)h+='<div class="small">'+quizzes.map((a,i)=>'Try '+(i+1)+' · '+dt(a.ts)+' · <b>'+a.score+'/15</b> '+(a.pass?'passed':'not yet')).join('<br>')+'</div>';
  if(hq&&open)h+='<div class="pbtns">'+(mom?'<button class="btn sm k" onclick="giveQuiz('+q("'quiz'")+')">Give quiz today</button><button class="btn sm alt" onclick="openQuiz('+q("'quiz'")+')">Open here</button>':'<button class="btn sm k" onclick="openQuiz('+q("'quiz'")+')">Take the quiz</button>')+'</div>';
  h+='</div></div>'+canBlock(kid,n,mom)+'</div>';
  return h;
}

/* ---------- plan ahead calendar ---------- */
let PC={view:'week',anchor:null,sel:null,kid:'ryder'};

const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];

function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}

function pcMonth(m,tk){

  h+='<div style="margin-top:6px">';
  if(!at.length)h+='<span class="small">No attempts yet.</span>';
  at.forEach((a,i)=>{h+='<div class="small">Try '+(i+1)+' · '+new Date(a.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · <b>'+a.score+'/15</b> '+(a.pass?'<span style="color:var(--ok)">passed</span>':'<span style="color:var(--warn)">not yet</span>')+'</div>';});
  h+='</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm k" onclick="giveQuiz(\''+kid+'\','+n+')">Give quiz today</button><button class="btn sm alt" onclick="openQuiz(\''+kid+'\','+n+')">Open quiz here</button></div>';
  return h;
}
function selectRung(kid,n){sel[kid]=n;render();}
let planPrefill=null;
function planFromWeek(kid,n){const w=weekObj(kid,n);planPrefill={kid:kid,title:'Week '+n+': '+w[1]};go('#/mom/plan');}
function planView(){
  const pf=planPrefill;planPrefill=null;
  const tk=todayKey();
  let h='<div class="card"><h3 style="font-size:24px">Assign work</h3>'
   +'<label>Who</label><div class="tog" id="pk"><button class="tab on" data-k="ryder">Ryder</button><button class="tab" data-k="hadley">Hadley</button><button class="tab" data-k="both">Both</button></div>'
   +'<label>What</label><input id="pt" placeholder="e.g. Masterbooks lesson 12, or Khan Academy: fractions" value="'+esc(pf?pf.title:'')+'">'
   +'<label>Link (optional — website, PDF or video)</label><input id="pl" placeholder="https://…">'
   +'<label>Which day</label><input id="pd" type="date" value="'+tk+'">'
   +'<div style="margin-top:14px"><button class="btn" onclick="submitAssign()">Add to their list</button></div></div>';
  ['ryder','hadley'].forEach(kid=>{
    const items=assignList(kid).filter(a=>a.date>=tk).sort((a,b)=>a.date<b.date?-1:a.ts-b.ts);
    h+='<div class="card '+KIDS[kid].cls+'"><h3 style="font-size:20px;color:var(--kc)">Coming up for '+KIDS[kid].name+'</h3>';
    if(!items.length)h+='<p class="muted small">Nothing assigned yet.</p>';
    items.forEach(a=>{h+='<div class="row"><div class="rt"><div class="t">'+esc(a.title)+'</div><div class="small muted">'+esc(fmtDay(parseKey(a.date)))+'</div></div><button class="btn sm '+(armed===kid+a.id?'bad':'alt')+'" onclick="armDel(\''+kid+'\',\''+a.id+'\')">'+(armed===kid+a.id?'Tap again to delete':'Delete')+'</button></div>';});
    h+='</div>';});
  setTimeout(bindPlan,0);
  if(pf){setTimeout(()=>{const b=document.querySelector('#pk [data-k="'+pf.kid+'"]');if(b)b.click();},0);}
  return h;
}
function bindPlan(){document.querySelectorAll('#pk .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pk .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');});}
function submitAssign(){
  const on=document.querySelector('#pk .tab.on');const k=on?on.dataset.k:'ryder';
  const kids=k==='both'?['ryder','hadley']:[k];
  const ok=addAssign(kids,document.getElementById('pt').value,document.getElementById('pl').value,document.getElementById('pd').value||todayKey());
  if(ok)toast('Added');
}
function checkView(){
  let h='';
  Object.keys(KIDS).forEach(kid=>{
    const K=KIDS[kid];const items=assignList(kid);
    const pend=items.filter(a=>a.done&&!a.grade).sort((a,b)=>a.date<b.date?-1:1);
    const g=items.filter(a=>a.grade==='got').length,n=items.filter(a=>a.grade==='needs').length,r=items.filter(a=>a.grade==='redo').length;const tot=g+n+r;
    h+='<div class="card '+K.cls+'" style="border-top:6px solid var(--kc)"><h3 style="font-size:24px;color:var(--kc)">'+K.name+'</h3>';
    if(!pend.length)h+='<p class="muted small">Nothing waiting to be checked.</p>';
    pend.forEach(a=>{const u=safeUrl(a.link);
      h+='<div class="row"><div class="rt"><div class="t">'+esc(a.title)+'</div><div class="small muted">'+esc(fmtDay(parseKey(a.date)))+'</div>'+(u?'<a class="linkchip" target="_blank" rel="noopener" href="'+esc(u)+'">'+linkLabel(u)+'</a>':'')
       +'<input style="margin-top:8px" placeholder="Note for '+K.name+' (optional)" value="'+esc(a.note||'')+'" onchange="setNote(\''+kid+'\',\''+a.id+'\',this.value)"></div>'
       +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ok" onclick="grade(\''+kid+'\',\''+a.id+'\',\'got\')">Got it</button><button class="btn sm warn" onclick="grade(\''+kid+'\',\''+a.id+'\',\'needs\')">Needs work</button><button class="btn sm bad" onclick="grade(\''+kid+'\',\''+a.id+'\',\'redo\')">Redo</button></div></div>';});
    h+='<div class="small muted" style="margin-top:10px">Report card · '+(tot?Math.round(g/tot*100)+'% got it':'no checked work yet')+' ('+g+' got it, '+n+' needs work, '+r+' redo) · '+masteredCount(kid)+' of 30 weeks mastered</div></div>';
  });
  return h;
}
function sendView(){
  let h='<div class="card"><h3 style="font-size:24px">Send to a screen</h3><p class="muted small">It shows up as a “From Mom” card at the top of their Today screen the next time it is open. No email.</p>'
   +'<label>To</label><div class="tog" id="sk"><button class="tab '+(msgFilter==='ryder'?'on':'')+'" data-k="ryder">Ryder</button><button class="tab '+(msgFilter==='hadley'?'on':'')+'" data-k="hadley">Hadley</button><button class="tab '+(msgFilter==='both'?'on':'')+'" data-k="both">Both</button></div>'
   +'<label>Message</label><textarea id="sendtext" placeholder="Try this one after lunch…"></textarea>'
   +'<label>Link (optional)</label><input id="sendlink" placeholder="https://…">'
   +'<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="sendpin" style="width:auto"> Keep at the top of Today until I remove it</label>'
   +'<div style="margin-top:14px"><button class="btn" onclick="submitSend()">Send</button></div></div>';
  const sent=[];Object.keys(KIDS).forEach(k=>entries(getIn('inbox/'+k)).forEach(m=>sent.push(Object.assign({kid:k},m))));
  sent.sort((a,b)=>b.ts-a.ts);
  h+='<div class="card"><h3 style="font-size:20px">Sent recently</h3>';
  if(!sent.length)h+='<p class="muted small">Nothing sent yet.</p>';
  sent.slice(0,10).forEach(m=>{h+='<div class="row"><div class="rt"><div class="small"><b>'+KIDS[m.kid].name+'</b> '+(m.pin?'· pinned ':'')+'<span class="muted">'+(m.seen?'· seen':'· not seen yet')+'</span></div><div>'+esc(m.text)+'</div></div><button class="btn sm alt" onclick="put(\'inbox/'+m.kid+'/'+m.id+'\',null)">Remove</button></div>';});
  setTimeout(()=>document.querySelectorAll('#sk .tab').forEach(b=>b.onclick=()=>{msgFilter=b.dataset.k;document.querySelectorAll('#sk .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');}),0);
  return h+'</div>';
}
function submitSend(){
  const text=document.getElementById('sendtext').value.trim();const link=safeUrl(document.getElementById('sendlink').value);
  if(!text&&!link){toast('Write a message or add a link');return;}
  const pin=document.getElementById('sendpin').checked;
  const kids=msgFilter==='both'?['ryder','hadley']:[msgFilter];
  kids.forEach(k=>{const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    put('inbox/'+k+'/'+id,{text:text||'A link for you',link:link,pin:pin,seen:false,ts:Date.now()});});
  document.getElementById('sendtext').value='';document.getElementById('sendlink').value='';
  toast('Sent');render();
}

window.addEventListener('hashchange',function(){render(true);});
document.addEventListener('DOMContentLoaded',function(){loadLocal();render();initFirebase();});
</script>
