<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wade Classical — Math Home</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--parch:#C8D0D8;--card:#F6F8FB;--forest:#204B3A;--brass:#5A7FA0;--ink:#1E2A24;--muted:#55604F;--line:#C3CCD7;
 --teal:#17607A;--teal-d:#0F4A5F;--rose:#A8325E;--rose-d:#7A1F45;--ok:#2E7D4F;--warn:#B5603A;--bad:#A8323A;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--parch);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--forest);color:#fff;flex-wrap:wrap}
.top .brand{font-family:'Cinzel',serif;letter-spacing:.06em;font-size:15px;cursor:pointer}
.top .sp{flex:1}
.top a.pill,.top button.pill{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:500 14px Jost;text-decoration:none;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:10px 16px;font:500 15px Jost;cursor:pointer;background:var(--forest);color:#fff}
.btn.alt{background:#fff;color:var(--forest);border:1px solid var(--forest)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.btn.k{background:var(--kc)}
input,textarea,select{font:400 15px Jost;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px;font-weight:500}
.muted{color:var(--muted)}.small{font-size:13px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.who{border:0;border-radius:18px;padding:34px 18px;color:#fff;cursor:pointer;font:700 32px 'Cormorant Garamond',serif;text-align:center}
.who small{display:block;font:400 14px Jost;opacity:.85;margin-top:6px}
.who.ryder{background:var(--teal)}.who.hadley{background:var(--rose)}.who.mom{background:var(--forest)}
.ryder{--kc:var(--teal);--kd:var(--teal-d)}.hadley{--kc:var(--rose);--kd:var(--rose-d)}
.khead{background:var(--kc);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:16px}
.khead h1{font-size:34px}.khead .sub{opacity:.9;font-size:15px}
.tabs{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.tab{border:1px solid var(--kc,var(--forest));color:var(--kc,var(--forest));background:#fff;border-radius:999px;padding:7px 16px;font:500 14px Jost;cursor:pointer;text-decoration:none}
.tab.on{background:var(--kc,var(--forest));color:#fff}
.focus{border-left:6px solid var(--kc);background:#fff}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--kc,var(--forest));background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;font-size:19px;color:#fff;margin-top:1px}
.chk.on{background:var(--kc,var(--forest))}
.rt{flex:1}.rt .t{font-weight:500;font-size:17px}.done .t{text-decoration:line-through;opacity:.55}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:#fff;margin-left:6px;vertical-align:middle}
.b-got{background:var(--ok)}.b-needs{background:var(--warn)}.b-redo{background:var(--bad)}.b-wait{background:#8a8f7a}
.linkchip{display:inline-block;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;text-decoration:none;color:var(--kc,var(--forest))}
.msg{background:#E8F0F8;border:1px solid var(--brass);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.msg .from{font:700 13px Jost;color:#3F5F7F;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.btn.tst{background:#8B1E2D;color:#fff}.btn.tst:hover{background:#731825}
.lnl{margin:6px 0 2px}.lnr{font-size:14px;padding:3px 0;border-top:1px dashed var(--line)}.lnr.dn{color:var(--muted)}.lnd{font-weight:700;color:var(--kc,var(--ink));margin-right:4px}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:860px){.week{grid-template-columns:1fr}}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.day.today{border:2px solid var(--kc)}
.day h4{font:700 15px Jost;margin-bottom:6px;color:var(--kc)}
.mini{font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}.mini:last-child{border:0}
.bar{height:10px;border-radius:6px;background:#D5DCE4;overflow:hidden}.bar>i{display:block;height:100%;background:var(--kc,var(--forest))}
/* ladder */
.ladder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.ladder{grid-template-columns:1fr}}
.rungs{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;font:400 15px Jost;width:100%}
.rung .n{font:700 16px 'Cormorant Garamond',serif;width:30px;color:var(--muted)}
.rung .f{flex:1}.rung .s{font-size:12px;font-weight:600}
.rung.mastered{background:#E5F1E8;border-color:#9CC8A9}.rung.mastered .s{color:var(--ok)}
.rung.current{background:var(--kc);color:#fff;border-color:var(--kc)}.rung.current .n,.rung.current .s{color:#fff}
.rung.next{border:2px dashed var(--kc)}.rung.next .s{color:var(--kc)}
.rung.skipped{background:#E4E9EF;opacity:.8}.rung.skipped .s{color:var(--warn)}
.rung.sel{outline:3px solid var(--brass)}
.cov-w{color:var(--ok)}.cov-p{color:var(--warn)}.cov-n{color:var(--bad)}
.stage{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stage b{font-family:'Cinzel',serif;width:34px}
.pin{max-width:340px;margin:60px auto;text-align:center}
.pin input{text-align:center;font-size:28px;letter-spacing:.4em;margin:14px 0}
.hide{display:none}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.qcard.bad{border-color:var(--bad);background:#FDF3F2}.qcard.good{border-color:#9CC8A9}
.qnum{font:700 13px Jost;color:var(--kc);margin-bottom:4px}
.qtext{font-size:18px;margin-bottom:8px}
.qopt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:17px;background:#fff}
.qopt input{width:auto}
.qans{font-size:20px;max-width:260px}
.score{font:700 54px 'Cormorant Garamond',serif}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9}
.gwrap{margin:6px 0 4px;overflow-x:auto;padding-bottom:4px}
.gr{display:flex;align-items:center}
.gc{width:44px;height:50px;display:flex;align-items:center;justify-content:center;font:600 30px Jost,sans-serif;color:var(--ink);flex:none}
.gc.gs0{width:30px}
.gc.gp{width:18px;font-size:34px}
.gc.gm{width:14px;font-size:34px;align-items:flex-end;padding-bottom:4px;color:var(--ink)}
.gc.go{color:var(--muted);font-weight:400}
.gans{border-top:3px solid var(--ink);margin-top:4px;padding-top:4px}
.gb{width:42px;height:48px;margin:0 1px;text-align:center;font:600 28px Jost,sans-serif;border:2px solid #B9C7D9;background:#EEF3FB;border-radius:7px;padding:0;flex:none;color:var(--ink)}
.gb:focus{outline:0;border-color:#2F6FDB;background:#DCE8FB;box-shadow:0 0 0 2px #2F6FDB33}
.gb.gs{width:30px;font-size:24px}
.gdiv{display:flex;align-items:flex-start;gap:0}
.gdv{height:50px;margin-top:54px;padding-right:8px;display:flex;align-items:center;font:600 30px Jost,sans-serif}
.gdd{border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:8px 0 0 0;padding-left:2px;margin-top:4px}
.grm{display:flex;align-items:center;margin:54px 0 0 14px;gap:6px;font:600 22px Jost,sans-serif;color:var(--muted)}
.gk{width:36px;height:30px;margin:0 4px;text-align:center;font:500 17px Jost,sans-serif;border:1.5px dashed #7C9AB8;background:#EAF1F8;border-radius:6px;padding:0;flex:none;color:var(--muted)}
.gk:focus{outline:0;border-color:#5A7FA0;background:#E8F0F8}
.gkw{width:44px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.pcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pctitle{font:600 26px 'Cormorant Garamond',serif;margin:0 6px;min-width:190px}
.pcscroll{overflow-x:auto}
.pcgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pcw{min-width:720px}
.pcdow{font:600 12px Jost;color:var(--muted);text-align:center;padding:2px 0}
.pcd{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:78px;padding:4px 6px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit;color:var(--ink);display:block;width:100%}
.pcd.we{background:#E9EEF4}.pcd.out{opacity:.4}
.pcd.today{border:2px solid var(--brass)}.pcd.sel{outline:3px solid var(--forest);outline-offset:-1px}
.pcn{font:600 14px Jost;margin-bottom:3px}
.pcp{display:inline-block;border-radius:999px;padding:1px 8px;color:#fff;font-size:12px;margin:1px 3px 0 0;font-weight:600}
.pcp.r{background:var(--teal)}.pcp.h{background:var(--rose)}
.pck{font:600 15px Jost;margin:12px 0 4px}
.pck.r{color:var(--teal)}.pck.h{color:var(--rose)}
.pcdw{min-height:110px}
.pcchip{display:block;border-left:4px solid var(--kc);background:#FBF6EA;border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.pcchip.dn{opacity:.6;text-decoration:line-through}
.pcyear{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px}
.pcym{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.pcym h4{font:600 17px 'Cormorant Garamond',serif;margin-bottom:4px;cursor:pointer;background:none;border:0;padding:0;color:var(--forest);text-align:left}
.pcyg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pcyd{font:500 13px Jost;text-align:left;padding:4px 5px;min-height:50px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:6px;cursor:pointer;border:0;background:transparent;color:var(--ink);font-family:inherit}
.pcyd.r{background:#BFDCE6}.pcyd.h{background:#EBC1D2}.pcyd.b{background:linear-gradient(135deg,#BFDCE6 50%,#EBC1D2 50%)}
.pcyd.f{box-shadow:inset 0 -3px 0 var(--forest)}
.pcyd{position:relative}
.pcyd .pcyt{position:absolute;left:3px;top:22px;z-index:2;background:var(--forest);color:#fff;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-sizing:border-box}
.pcyf{font-size:11px;line-height:1.25;margin-top:6px;color:var(--forest);font-weight:600}
.pcyf span{display:block;overflow-wrap:anywhere}
.pcyd.today{outline:2px solid var(--brass)}.pcyd.sel{outline:2px solid var(--forest)}.pcyd.blank{cursor:default}
.pcfocus{display:block;background:var(--forest);color:#fff;border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:11px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.ldg{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:4px;align-items:center;margin:4px 0}
.ldw{font:600 12px Jost;color:var(--muted)}
.ldd{border:1px solid var(--kc);color:var(--kc);background:#fff;border-radius:8px;padding:7px 0;font:500 13px Jost;cursor:pointer}
.ldd.on{background:var(--kc);color:#fff}
.ldd:disabled{opacity:.35;cursor:default}
.pstep{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.pstep:last-child{border-bottom:0}
.pnum{width:30px;height:30px;flex:none;border-radius:50%;background:var(--kc);color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px Jost}
.pstep.lock .pnum{background:#9AA7B5}.pstep.lock{opacity:.8}
.pstep.dn .pnum{background:var(--ok)}
.canbox{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.canrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;font:500 16px Jost,sans-serif;color:var(--ink);cursor:default;margin:0}
button.canrow{cursor:pointer}
.canbox>.canrow:first-of-type{margin-top:6px}
.canrow .cb{width:24px;height:24px;flex:none;border:2px solid #9AA7B5;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#fff}
.canrow.on .cb{background:var(--ok);border-color:var(--ok)}
.gapwk{padding:10px 0;border-top:1px solid var(--line)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gcap{font-size:17px;color:var(--muted);margin-bottom:4px}
#kp{position:fixed;left:0;right:0;bottom:0;background:#F3F5F8;border-top:1px solid #C9D3E0;padding:8px;display:none;z-index:8;justify-content:center}
#kp .kg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:460px;width:100%}
#kp button{height:46px;font:600 22px Jost,sans-serif;border:1px solid #B9C7D9;border-radius:9px;background:#fff;cursor:pointer}
body.kpon #kp{display:flex}
body.kpon{padding-bottom:70px}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.tog .tab{padding:6px 14px}
</style>
</head>

function gridSpec(q){
  if(q.t==='rem'){
    let m=q.q.match(/^(\d+) cookies are shared equally among (\d+) kids/);
    if(!m)m=q.q.match(/^([\d,]+) ÷ (\d+) = \?/);

    const dv=m[1].replace(/,/g,''),dr=m[2];
    if(Math.floor(+dv/+dr)!==q.a[0]||(+dv%+dr)!==q.a[1])return null;
    return {k:'div',dv:dv,dr:dr,qa:String(q.a[0]),ra:String(q.a[1]),rem:true,cap:q.q};
  }
  if(q.t!=='num')return null;
  const m=q.q.match(/^(.*?)(\d[\d,]*(?:\.\d+)?(?:\s*[+−×÷]\s*\d[\d,]*(?:\.\d+)?)+)\s*=\s*\?$/);
  if(!m)return null;
  const pre=m[1];if(/[\d\/.,(]$/.test(pre))return null;
  const ops=m[2].match(/[+−×÷]/g);if(!ops||ops.some(o=>o!==ops[0]))return null;
  const op=ops[0];const tk=m[2].split(/\s*[+−×÷]\s*/).map(x=>x.replace(/,/g,''));

  else if(op==='×'){if(tk.length!==2||tk.some(x=>x.indexOf('.')>=0))return null;exp=nums[0]*nums[1];}
  else{if(tk.length!==2||tk.some(x=>x.indexOf('.')>=0))return null;exp=nums[0]/nums[1];}
  if(Math.abs(exp-Number(q.a))>1e-9)return null;
  const cap=pre.trim();
  if(op==='÷'){if(!Number.isInteger(exp)||exp<0)return null;return {k:'div',dv:tk[0],dr:tk[1],qa:String(exp),ra:'',rem:false,cap:cap};}
  return {k:op==='+'?'add':op==='−'?'sub':'mul',op:op,tk:tk,a:Number(q.a),cap:cap};
}
function gridHTML(i,g){
  const bx=(QZ&&QZ.bx&&QZ.bx[i])||[];let j=0;

  let h='<div class="gwrap">';

    const D=Math.max(g.dv.length,g.qa.length),pad=D-g.qa.length;
    h+='<div class="gdiv"><div class="gdv">'+esc(g.dr)+'</div><div><div class="gr">';
    for(let k=0;k<pad;k++)h+=cell('');

    h+='</div><div class="gr gdd">';

    if(g.rem){h+='<div class="grm"><span>R</span>';for(let k=0;k<Math.max(1,g.ra.length);k++)h+=inp('m');h+='</div>';}
    h+='</div></div>';return h;
  }
  const dec=Math.max.apply(null,g.tk.map(t=>t.indexOf('.')<0?0:t.length-t.indexOf('.')-1));
  const astr=Math.abs(g.a).toFixed(dec);const aInt=astr.split('.')[0].length;
  const ints=g.tk.map(t=>t.split('.')[0].length);const I=Math.max(aInt,Math.max.apply(null,ints));
  const neg=g.a<0;
  const cm=(k,len)=>(k<I-1&&(I-1-k)%3===0)?cell(k>=I-len?',':'','gm'):'';
  if(carryOn(QZ?QZ.kid:'')){
    const ck=(k,mx)=>{const v=(QZ&&QZ.ck&&QZ.ck[i]&&QZ.ck[i][k])||'';return '<span class="gkw"><input class="gk" data-ck="'+i+'" data-k="'+k+'" maxlength="'+mx+'" autocomplete="off" inputmode="numeric" value="'+esc(v)+'" oninput="gIn(this)" onfocus="GF=this;try{this.select()}catch(e){}" aria-label="'+(g.k==='sub'?'borrow box':'carry box')+'"></span>';};
    const total=I+(dec?1+dec:0);let kk=0;
    h+='<div class="gr gkr">'+(neg?cell('','gs0'):'')+cell('')+'';
    for(let c=0;c<total;c++){
      const isDot=dec&&c===I;

      if(isDot||(g.k!=='sub'&&last))h+=(isDot?cell('','gp'):cell(''));
      else h+=ck(kk++,g.k==='sub'?2:1);
      if(c<I-1&&(I-1-c)%3===0)h+=cell('','gm');
    }
    h+='</div>';
  }
  g.tk.forEach((t,r)=>{
    const ip=t.split('.')[0],fp=t.indexOf('.')<0?'':t.split('.')[1];
    h+='<div class="gr">'+(neg?cell('','gs0'):'');

    if(dec){h+=cell(fp?'.':'','gp');for(let k=0;k<dec;k++)h+=cell(fp[k]||'');}

  h+='<div class="gr gans">'+cell('','go');

  if(dec){h+=cell('.','gp');for(let k=0;k<dec;k++)h+=inp('f');}
  h+='</div></div>';return h;
}

function factLabel(id){let m;
  if(m=id.match(/^m(\d+)x(\d+)$/))return m[1]+' × '+m[2];
  if(m=id.match(/^d(\d+)q(\d+)$/))return (+m[1]).toLocaleString()+' ÷ '+m[2];
  if(m=id.match(/^a(\d+)p(\d+)$/))return m[1]+' + '+m[2];
  if(m=id.match(/^s(\d+)m(\d+)$/))return m[1]+' − '+m[2];
  if(m=id.match(/^b(\d+)_(\d+)$/))return (+m[2]).toLocaleString()+' + ? = '+(+m[1]).toLocaleString();
  return id;}

  let h='<div class="pcscroll"><div class="pcw"><div class="pcgrid">'+DOW.map(d=>'<div class="pcdow">'+d+'</div>').join('')+'</div>';
  [[PC.kid,PC.kid==='ryder'?'r':'h']].forEach(kk=>{
    const kid=kk[0];
    h+='<div class="pcgrid" style="margin-top:6px">';
    for(let i=0;i<7;i++){
      const d=addDays(mon,i),k=dkey(d);const items=(m[k]&&m[k][kid])||[];
      h+='<button class="pcd pcdw '+(i>4?'we ':'')+(k===tk?'today ':'')+(k===PC.sel?'sel':'')+'" onclick="pcPick(\''+k+'\')"><div class="pcn">'+d.getDate()+'</div>'+pcFocusTag(kid,k)+items.map(a=>pcChip(kid,a)).join('')+'</button>';
    }
    h+='</div>';
  });
  return h+'</div></div>';
}
function pcMonth(m,tk){
  const a=pcA();const first=new Date(a.getFullYear(),a.getMonth(),1);const last=new Date(a.getFullYear(),a.getMonth()+1,0);
  const start=mondayOf(first);const weeks=Math.ceil(((last-start)/86400000+1)/7);
  let h='<div class="pcscroll"><div class="pcw"><div class="pcgrid">'+DOW.map(d=>'<div class="pcdow">'+d+'</div>').join('')+'</div><div class="pcgrid" style="margin-top:4px">';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),k=dkey(d);const items=(m[k]&&m[k][PC.kid])||[];
    h+='<button class="pcd '+((i%7)>4?'we ':'')+(d.getMonth()!==a.getMonth()?'out ':'')+(k===tk?'today ':'')+(k===PC.sel?'sel':'')+'" onclick="pcPick(\''+k+'\')"><div class="pcn">'+d.getDate()+'</div>'+pcFocusTag(PC.kid,k)
      +items.slice(0,2).map(x=>pcChip(PC.kid,x)).join('')+(items.length>2?'<span class="small muted">+'+(items.length-2)+' more</span>':'')+'</button>';
  }
  return h+'</div></div></div>';
}
function pcYear(m,tk){
  const a0=pcA();const sy=a0.getMonth()>=8?a0.getFullYear():a0.getFullYear()-1; /* school year runs September to August */
  let h='<div class="pcyear">';
  for(let i0=0;i0<12;i0++){
    const mo=(8+i0)%12,y=sy+(8+i0>=12?1:0);
    const first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),lead=(first.getDay()+6)%7;
    h+='<div class="pcym"><button class="pcym-t" style="all:unset;cursor:pointer"><h4 onclick="pcOpenMonth('+y+','+mo+')">'+MON[mo]+'</h4></button><div class="pcyg">'+DOW.map(d=>'<div class="pcdow" style="font-size:11px">'+d+'</div>').join('');
    for(let i=0;i<lead;i++)h+='<span class="pcyd blank"></span>';
    const fl={};
    const fxa=[''];for(let dd=1;dd<=dim;dd++)fxa.push(focusLabel(PC.kid,y+'-'+pad(mo+1)+'-'+pad(dd)));
    for(let dd=1;dd<=dim;dd++){
      const k=y+'-'+pad(mo+1)+'-'+pad(dd);const has=m[k]&&m[k][PC.kid].length;
      const fx=fxa[dd];if(fx){if(!fl[fx])fl[fx]=[dd,dd];else fl[fx][1]=dd;}
      h+='<button class="pcyd '+(has?(PC.kid==='ryder'?'r':'h'):'')+(fx?' f':'')+' '+(k===tk?'today ':'')+(k===PC.sel?'sel':'')+'" onclick="pcPick(\''+k+'\')">'+dd+(fx&&fxa[dd-1]!==fx||fx&&((lead+dd-1)%7===0)?(()=>{let run=1;while(dd+run<=dim&&fxa[dd+run]===fx&&((lead+dd-1+run)%7)<5)run++;const cut=(((lead+dd-1)%7)+run>5)?5-((lead+dd-1)%7):run;const n=Math.max(1,Math.min(run,cut));return '<span class="pcyt" title="'+esc(fx)+'" style="width:calc('+n+'*100% + '+(n-1)*3+'px - 6px)">'+esc(fx.indexOf(': ')>0?fx.split(': ').slice(1).join(': '):fx)+'</span>';})():'')+'</button>';
    }
    h+='</div>'+(Object.keys(fl).length?'<div class="pcyf">'+Object.keys(fl).map(t=>'<span>'+esc(t)+' · '+MON[mo].slice(0,3)+' '+fl[t][0]+(fl[t][1]!==fl[t][0]?'–'+fl[t][1]:'')+'</span>').join('')+'</div>':'')+'</div>';
  }
  return h+'</div><div class="small muted" style="margin-top:10px">Shaded days have work assigned to '+KIDS[PC.kid].name+'. A green line and a label across the days mean a focus week. The week number and dates are listed under each month.</div>';
}

    const items=assignList(kid).filter(a=>a.date===PC.sel).sort((a,b)=>(a.ts||0)-(b.ts||0));

        +'<button class="btn sm '+(armed===kid+a.id?'bad':'alt')+'" onclick="armDel(\''+kid+'\',\''+a.id+'\')">'+(armed===kid+a.id?'Tap to remove':'Remove')+'</button></div>';

function planAheadView(){
  const tk=todayKey(),m=pcMap(),a=pcA();let title;
  if(PC.view==='week'){const mon=mondayOf(a),sun=addDays(mon,6);title=MON[mon.getMonth()].slice(0,3)+' '+mon.getDate()+' – '+(sun.getMonth()!==mon.getMonth()?MON[sun.getMonth()].slice(0,3)+' ':'')+sun.getDate()+', '+sun.getFullYear();}
  else if(PC.view==='month')title=MON[a.getMonth()]+' '+a.getFullYear();
  else{const sy=a.getMonth()>=8?a.getFullYear():a.getFullYear()-1;title=sy+'–'+(sy+1)+' school year';}
  let h='<div class="tog" style="margin-bottom:12px">'+['ryder','hadley'].map(k=>'<button class="tab '+(PC.kid===k?'on':'')+'" style="--kc:'+(k==='ryder'?'var(--teal)':'var(--rose)')+'" onclick="pcSetKid(\''+k+'\')">'+KIDS[k].name+'\'s calendar</button>').join('')+'</div><div class="card '+KIDS[PC.kid].cls+'" style="border-top:6px solid var(--kc)"><div class="pcbar"><div class="tog">'+['week','month','year'].map(v=>'<button class="tab '+(PC.view===v?'on':'')+'" onclick="pcView(\''+v+'\')">'+v[0].toUpperCase()+v.slice(1)+'</button>').join('')+'</div>'
    +'<button class="btn sm alt" onclick="pcNav(-1)" aria-label="Previous">◀</button><div class="pctitle">'+title+'</div><button class="btn sm alt" onclick="pcNav(1)" aria-label="Next">▶</button><button class="btn sm" onclick="pcToday()">Today</button></div>';
  h+=PC.view==='week'?pcWeek(m,tk):PC.view==='month'?pcMonth(m,tk):pcYear(m,tk);
  h+='</div>'+pcDay()+gapsView(PC.kid);

}

/* ---------- I can gaps (what to teach) ---------- */
function planGap(kid,n,i){const t=canList(kid,n)[i]||'';sel[kid]=n;ldSync(kid,n);LD.title=t;go('#/mom/ladder/'+kid);}
function gapsView(kid){
  const K=KIDS[kid];const cur=getIn('current/'+kid);
  const wk=K.weeks.map(w=>w[0]).filter(n=>{const st=weekStatus(kid,n);if(st==='mastered'||st==='skipped')return false;
    return n===cur||!!stageOf(kid,n)||!!getIn('can/'+kid+'/w'+n)||assignList(kid).some(a=>a.week===n);});
  let h='<div class="card '+K.cls+'" style="border-top:6px solid var(--kc);margin-top:14px"><h3 style="font-size:22px">Still to teach · '+esc(K.name)+'</h3><div class="small muted" style="margin:2px 0 6px">Every "I can" not checked yet, for the focus week and any week in progress. Tap Plan a lesson to put it on a day.</div>';
  if(!wk.length)return h+'<div class="small muted">Nothing in progress. Pick a focus week on the ladder to start.</div></div>';
  wk.forEach(n=>{
    const w=weekObj(kid,n),L=canList(kid,n),gp=canGaps(kid,n);
    h+='<div class="gapwk"><b>Week '+n+' · '+esc(w[1])+'</b> <span class="small muted">'+(L.length-gp.length)+' of '+L.length+' checked</span>';
    if(!gp.length)h+='<div class="small" style="color:var(--ok)">Every I can is checked.</div>';
    gp.forEach(x=>{h+='<div class="row"><div class="rt"><div class="t">'+esc(canText(x[1]))+'</div></div><button class="btn sm alt" onclick="planGap(\''+kid+'\','+n+','+x[0]+')">Plan a lesson</button></div>';});
    h+='</div>';
  });
  return h+'</div>';
}
/* ---------- add a lesson to a ladder week ---------- */
let LD={key:'',title:'',link:'',note:'',days:{},off:0};
function ldSync(kid,n){if(LD.key!==kid+':'+n)LD={key:kid+':'+n,title:'',link:'',note:'',days:{},off:0};}
function ldDay(btn,k){if(LD.days[k]){delete LD.days[k];btn.classList.remove('on');}else{LD.days[k]=1;btn.classList.add('on');}const c=document.getElementById('ldcount');if(c)c.textContent=Object.keys(LD.days).length;}
function ldOff(d){LD.off=Math.max(0,LD.off+d);render();}
function ldAdd(kid,n){
  const title=(LD.title||'').trim();const days=Object.keys(LD.days).sort();
  if(!title){toast('Add a title first');return;}
  if(!days.length){toast('Tap at least one day');return;}
  const link=safeUrl(LD.link);
  days.forEach((k,i)=>{const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+i;
    put('assign/'+kid+'/'+id,{title:title,link:link,date:k,done:false,grade:'',note:(LD.note||'').trim(),ts:Date.now()+i,week:n});});
  toast('Added to '+days.length+' day'+(days.length>1?'s':''));
  LD={key:kid+':'+n,title:'',link:'',note:'',days:{},off:LD.off};
}

  if(lined.length){

    h+='</div>';
  }
  return h+'</div>';
}
function selWeek(kid){return sel[kid]||suggested(kid)||1;}
const PACE={
 ryder:[0,5,4,6,4,5,6,7,8,7,5,4,6,5,5,5,5,6,5,6,8,4,5,4,5,4,5,5,4,6,6],
 hadley:[0,3,3,3,5,5,3,5,5,5,6,6,4,5,5,3,5,6,5,4,4,3,5,4,6,4,4,3,3,3,4]};
function paceDays(kid,n){return (PACE[kid]||[])[n]||5;}
function paceTxt(d){return d+' school days'+(d>=5?' (about '+(Math.round(d/5*2)/2)+' week'+(d>5?'s':'')+')':'');}
function paceLeft(kid){let d=0,c=0;for(let i=1;i<=30;i++){const st=weekStatus(kid,i);if(st==='mastered'||st==='skipped')continue;d+=paceDays(kid,i);c++;}return {d:d,c:c};}

  const nxt=cur?nextAfter(kid,cur):null;

    +'<div class="small muted" style="margin-top:6px">Topics</div><div class="fx">'+esc(w[2])+'</div>'
    +'<div class="small muted" style="margin-top:10px">'+(kid==='ryder'?'He':'She')+' can</div><div class="fx">'+esc(w[3])+'</div>'
    +'<div class="small" style="margin-top:10px"><b>Suggested pace:</b> '+paceTxt(paceDays(kid,n))+'. A best guess: lesson, practice days, then the quiz. Go faster if '+(kid==='ryder'?'he':'she')+' tests out or is breezing through.</div>'
    +'<div class="small cov-'+w[4]+'" style="margin-top:10px;font-weight:600">'+K.book+': '+covTxt+'</div>'

    +'<span class="small muted" style="align-self:center">Starting</span><input type="date" id="fd'+kid+'" value="'+todayKey()+'" style="width:auto;padding:6px 8px"><button class="btn sm k" onclick="startFocus(\''+kid+'\','+n+')">Make this week\'s focus</button>'
    +'<button class="btn sm ok" onclick="setWeek(\''+kid+'\','+n+',\'mastered\')">Mark mastered</button>'

  h+='</div></div></div></div>';

function fixScore(kid,n,id,right){
  const a=quizAttempts(kid,n).find(x=>x.id===id);if(!a)return;
  put('quiz/'+kid+'/w'+n+'/'+id,{ts:a.ts,score:right,form:a.form||0,pass:right>=13,kind:a.kind||'test',ans:a.ans});
  toast&&toast('Score updated to '+right+'/15');render();
}
let openAtt={};
function toggleAtt(id){openAtt[id]=!openAtt[id];render();}
function attLink(a){return ' · <a href="javascript:void(0)" onclick="toggleAtt(\''+a.id+'\')">'+(openAtt[a.id]?'Hide answers':'See answers')+'</a>';}
function attemptReview(kid,n,a){
  const form=a.form||0,qs=QUIZ[kid]&&QUIZ[kid][n]&&QUIZ[kid][n][form];
  if(!qs)return '<div class="small muted" style="margin:6px 0 10px">This try was saved without its questions, so it cannot be shown.</div>';
  let ans=[];try{ans=JSON.parse(a.ans||'[]')||[];}catch(e){}
  if(!a.ans)return '<div class="small muted" style="margin:6px 0 10px">This try was saved before answers were recorded, so only the score is available.</div>';
  const pro=KIDS[kid].name+'’s';let right=0,miss='';
  const rows=qs.map((q,i)=>{
    const resp=ans[i],ok=gradeQ(q,resp);if(ok)right++;
    let mine;
    if(resp==null||String(resp).trim()==='')mine='(left blank)';
    else if(q.t==='mc')mine=q.o[resp]!=null?String(q.o[resp]):'(unknown)';
    else if(q.t==='rem')mine=String(resp);
    else mine=fmtNum(resp);
    if(!ok)miss+=(miss?', ':'')+(i+1);
    return '<div style="padding:8px 10px;margin:6px 0;border-radius:10px;border:1px solid '+(ok?'#cfe3d3':'#e8b9b0')+';background:'+(ok?'#f4faf5':'#fdf1ee')+'"><div class="small"><b>'+(i+1)+'. '+(ok?'<span style="color:var(--ok)">✓</span>':'<span style="color:var(--warn)">✗</span>')+'</b> '+esc(q.q||q.p||'')+'</div>'
      +'<div class="small" style="margin-top:3px">'+esc(pro)+' answer: <b>'+esc(mine)+'</b>'+(ok?'':' · Correct answer: <b>'+esc(ansText(q))+'</b>')+'</div></div>';
  }).join('');
  return '<div class="fx" style="margin:6px 0 12px"><div class="small"><b>'+right+' of '+qs.length+' marked right</b>'+(a.score!==right?' (the score saved at the time was '+a.score+') <button class="btn sm k" onclick="fixScore(\''+kid+'\','+n+',\''+a.id+'\','+right+')">Update saved score to '+right+'/15</button>':'')+(miss?' · Missed: '+miss:' · None missed')+'</div>'+rows+'</div>';
}
function quizBlock(kid,n){
  let h='<div class="small muted" style="margin-top:12px">Test-out quiz · 15 questions · 13 to pass · one retake, then the week stays open</div>';
  if(!hasQuiz(kid,n))return h+'<div class="small" style="margin-top:4px">The quiz for this week is not written yet. Mark it mastered yourself if you know it.</div>';
  const at=quizAttempts(kid,n);
  h+='<div style="margin-top:6px">';
  if(!at.length)h+='<span class="small">No attempts yet.</span>';
  at.forEach((a,i)=>{h+='<div class="small">Try '+(i+1)+' · '+new Date(a.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · <b>'+a.score+'/15</b> '+(a.pass?'<span style="color:var(--ok)">passed</span>':'<span style="color:var(--warn)">not yet</span>')+' · <a href="javascript:void(0)" onclick="toggleAtt(\''+a.id+'\')">'+(openAtt[a.id]?'Hide answers':'See answers')+'</a></div>'+(openAtt[a.id]?attemptReview(kid,n,a):'');});
  h+='</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm k" onclick="giveQuiz(\''+kid+'\','+n+')">Give quiz today</button><button class="btn sm alt" onclick="openQuiz(\''+kid+'\','+n+')">Open quiz here</button></div>';
  return h;
}
function selectRung(kid,n){sel[kid]=n;render();}
let planPrefill=null;
function planFromWeek(kid,n){const w=weekObj(kid,n);planPrefill={kid:kid,title:'Week '+n+': '+w[1],week:n};go('#/mom/plan');}
function planView(){
  const pf=planPrefill;planPrefill=null;
  const tk=todayKey();
  let h='<div class="card"><h3 style="font-size:24px">Assign work</h3>'
   +'<label>Who</label><div class="tog" id="pk"><button class="tab on" data-k="ryder">Ryder</button><button class="tab" data-k="hadley">Hadley</button><button class="tab" data-k="both">Both</button></div>'
   +'<label>What</label><input id="pt" placeholder="e.g. Masterbooks lesson 12, or Khan Academy: fractions" value="'+esc(pf?pf.title:'')+'">'
   +'<label>Link (optional — website, PDF or video)</label><input id="pl" placeholder="https://…">'
   +'<label>Which day</label><input id="pd" type="date" value="'+tk+'">'
   +'<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:6px"><input type="checkbox" id="pnd" style="width:auto" onchange="document.getElementById(\'pd\').disabled=this.checked"> No day yet. Park it on a ladder week and schedule it later.</label>'
   +'<label>Ladder week (optional)</label><select id="pw"></select><div class="small muted" id="pwn" style="margin-top:4px"></div>'
   +'<div style="margin-top:14px"><button class="btn" onclick="submitAssign()">Add to their list</button></div></div>';
  ['ryder','hadley'].forEach(kid=>{
    const items=assignList(kid).filter(a=>a.date&&a.date>=tk).sort((a,b)=>a.date<b.date?-1:a.ts-b.ts);const waiting=assignList(kid).filter(a=>!a.date&&!a.done).sort((a,b)=>(a.week||99)-(b.week||99)||(a.ts||0)-(b.ts||0));
    h+='<div class="card '+KIDS[kid].cls+'"><h3 style="font-size:20px;color:var(--kc)">Coming up for '+KIDS[kid].name+'</h3>';
    if(!items.length)h+='<p class="muted small">Nothing assigned yet.</p>';
    items.forEach(a=>{h+='<div class="row"><div class="rt"><div class="t">'+esc(a.title)+'</div><div class="small muted">'+esc(fmtDay(parseKey(a.date)))+(a.week?' · Week '+a.week+' on the ladder':'')+'</div></div><button class="btn sm '+(armed===kid+a.id?'bad':'alt')+'" onclick="armDel(\''+kid+'\',\''+a.id+'\')">'+(armed===kid+a.id?'Tap again to delete':'Delete')+'</button></div>';});
    if(waiting.length){h+='<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px"><b>Waiting for a day</b><div class="small muted">Parked on a ladder week. Pick a day when you are ready and it goes on '+KIDS[kid].name+'\'s list.</div>'+waiting.map(a=>unRow(kid,a,true)).join('')+'</div>';}
    h+='</div>';});
  setTimeout(bindPlan,0);
  if(pf){setTimeout(()=>{const b=document.querySelector('#pk [data-k="'+pf.kid+'"]');if(b)b.click();if(pf.week){const w=document.getElementById('pw');if(w)w.value=String(pf.week);}},0);}
  return h;
}
function fillWeeks(kid){
  const sl=document.getElementById('pw'),nt=document.getElementById('pwn');if(!sl)return;
  if(kid==='both'){sl.innerHTML='<option value="">Pick one child to choose a ladder week</option>';sl.disabled=true;if(nt)nt.textContent='Ryder and Hadley are on different weeks, so choose one child first.';return;}
  sl.disabled=false;const K=KIDS[kid],cur=getIn('current/'+kid);
  let o='<option value="">None (just a day on their list)</option>';
  K.weeks.forEach(w=>{const n=w[0],st=weekStatus(kid,n);if(st==='mastered'||st==='skipped')return;
    o+='<option value="'+n+'">Week '+n+' · '+esc(w[1])+(n===cur?' (this week)':'')+(lessonList(kid,n).length?' · lesson built':'')+'</option>';});
  sl.innerHTML=o;if(nt)nt.textContent='It lands on the day above and also shows under Lesson on that ladder week.';
}
function bindPlan(){const on=document.querySelector('#pk .tab.on');fillWeeks(on?on.dataset.k:'ryder');document.querySelectorAll('#pk .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pk .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');fillWeeks(b.dataset.k);});}
function submitAssign(){
  const on=document.querySelector('#pk .tab.on');const k=on?on.dataset.k:'ryder';
  const kids=k==='both'?['ryder','hadley']:[k];
  const wv=kids.length===1?parseInt((document.getElementById('pw')||{}).value,10):NaN;
  const nd=document.getElementById('pnd')&&document.getElementById('pnd').checked;
  if(nd&&isNaN(wv)){toast('Pick one child and a ladder week to park it on');return;}
  const ok=addAssign(kids,document.getElementById('pt').value,document.getElementById('pl').value,nd?'':(document.getElementById('pd').value||todayKey()),isNaN(wv)?0:wv);
  if(ok)toast('Added'+(isNaN(wv)?'':' to Week '+wv)+(nd?' with no day yet':''));
}
function checkView(){
  let h='';
  Object.keys(KIDS).forEach(kid=>{
    const K=KIDS[kid];const items=assignList(kid);
    const pend=items.filter(a=>a.done&&!a.grade).sort((a,b)=>a.date<b.date?-1:1);
    const g=items.filter(a=>a.grade==='got').length,n=items.filter(a=>a.grade==='needs').length,r=items.filter(a=>a.grade==='redo').length;const tot=g+n+r;
    h+='<div class="card '+K.cls+'" style="border-top:6px solid var(--kc)"><h3 style="font-size:24px;color:var(--kc)">'+K.name+'</h3>';
    if(!pend.length)h+='<p class="muted small">Nothing waiting to be checked.</p>';
    pend.forEach(a=>{const u=safeUrl(a.link);
      h+='<div class="row"><div class="rt"><div class="t">'+esc(a.title)+'</div><div class="small muted">'+esc(dayTxt(a))+'</div>'+(u?'<a class="linkchip" target="_blank" rel="noopener" href="'+esc(u)+'">'+linkLabel(u)+'</a>':'')
       +'<input style="margin-top:8px" placeholder="Note for '+K.name+' (optional)" value="'+esc(a.note||'')+'" onchange="setNote(\''+kid+'\',\''+a.id+'\',this.value)"></div>'
       +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ok" onclick="grade(\''+kid+'\',\''+a.id+'\',\'got\')">Got it</button><button class="btn sm warn" onclick="grade(\''+kid+'\',\''+a.id+'\',\'needs\')">Needs work</button><button class="btn sm bad" onclick="grade(\''+kid+'\',\''+a.id+'\',\'redo\')">Redo</button></div></div>';});
    h+='<div class="small muted" style="margin-top:10px">Report card · '+(tot?Math.round(g/tot*100)+'% got it':'no checked work yet')+' ('+g+' got it, '+n+' needs work, '+r+' redo) · '+masteredCount(kid)+' of 30 weeks mastered</div></div>';
  });
  return h;
}
function sendView(){
  let h='<div class="card"><h3 style="font-size:24px">Send to a screen</h3><p class="muted small">It shows up as a “From Mom” card at the top of their Today screen the next time it is open. No email.</p>'
   +'<label>To</label><div class="tog" id="sk"><button class="tab '+(msgFilter==='ryder'?'on':'')+'" data-k="ryder">Ryder</button><button class="tab '+(msgFilter==='hadley'?'on':'')+'" data-k="hadley">Hadley</button><button class="tab '+(msgFilter==='both'?'on':'')+'" data-k="both">Both</button></div>'
   +'<label>Message</label><textarea id="sendtext" placeholder="Try this one after lunch…"></textarea>'
   +'<label>Link (optional)</label><input id="sendlink" placeholder="https://…">'
   +'<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="sendpin" style="width:auto"> Keep at the top of Today until I remove it</label>'
   +'<div style="margin-top:14px"><button class="btn" onclick="submitSend()">Send</button></div></div>';
  const sent=[];Object.keys(KIDS).forEach(k=>entries(getIn('inbox/'+k)).forEach(m=>sent.push(Object.assign({kid:k},m))));
  sent.sort((a,b)=>b.ts-a.ts);
  h+='<div class="card"><h3 style="font-size:20px">Sent recently</h3>';
  if(!sent.length)h+='<p class="muted small">Nothing sent yet.</p>';
  sent.slice(0,10).forEach(m=>{h+='<div class="row"><div class="rt"><div class="small"><b>'+KIDS[m.kid].name+'</b> '+(m.pin?'· pinned ':'')+'<span class="muted">'+(m.seen?'· seen':'· not seen yet')+'</span></div><div>'+esc(m.text)+'</div></div><button class="btn sm alt" onclick="put(\'inbox/'+m.kid+'/'+m.id+'\',null)">Remove</button></div>';});
  setTimeout(()=>document.querySelectorAll('#sk .tab').forEach(b=>b.onclick=()=>{msgFilter=b.dataset.k;document.querySelectorAll('#sk .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');}),0);
  return h+'</div>';
}
function submitSend(){
  const text=document.getElementById('sendtext').value.trim();const link=safeUrl(document.getElementById('sendlink').value);
  if(!text&&!link){toast('Write a message or add a link');return;}
  const pin=document.getElementById('sendpin').checked;
  const kids=msgFilter==='both'?['ryder','hadley']:[msgFilter];
  kids.forEach(k=>{const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    put('inbox/'+k+'/'+id,{text:text||'A link for you',link:link,pin:pin,seen:false,ts:Date.now()});});
  document.getElementById('sendtext').value='';document.getElementById('sendlink').value='';
  toast('Sent');render();
}
