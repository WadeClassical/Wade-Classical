<style>

 --teal:#17607A;--teal-d:#0F4A5F;--rose:#A8325E;--rose-d:#7A1F45;--ok:#2E7D4F;--warn:#B7791F;--bad:#A8323A;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--parch);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.4}

.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--forest);color:#fff;flex-wrap:wrap}

.top .sp{flex:1}
.top a.pill,.top button.pill{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:500 14px Jost;text-decoration:none;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.btn{border:0;border-radius:10px;padding:10px 16px;font:500 15px Jost;cursor:pointer;background:var(--forest);color:#fff}
.btn.alt{background:#fff;color:var(--forest);border:1px solid var(--forest)}

.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}

input,textarea,select{font:400 15px Jost;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:90px;resize:vertical}

.tab.on{background:var(--kc,var(--forest));color:#fff}
.focus{border-left:6px solid var(--kc);background:#fff}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--kc,var(--forest));background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;font-size:19px;color:#fff;margin-top:1px}

.rt{flex:1}.rt .t{font-weight:500;font-size:17px}.done .t{text-decoration:line-through;opacity:.55}

.b-got{background:var(--ok)}.b-needs{background:var(--warn)}.b-redo{background:var(--bad)}.b-wait{background:#8a8f7a}

const LS='wc_math_home_v1';
let S={}; let db=null; let online=false; let sel={}; let msgFilter='both';

/* ---------- storage ---------- */
function loadLocal(){try{S=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){S={};}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function getIn(path){return path.split('/').reduce((o,k)=>o==null?undefined:o[k],S);}
function put(path,val){
  const keys=path.split('/');let o=S;
  for(let i=0;i<keys.length-1;i++){if(typeof o[keys[i]]!=='object'||o[keys[i]]===null)o[keys[i]]={};o=o[keys[i]];}
  const last=keys[keys.length-1];
  if(val===null||val===undefined)delete o[last];else o[last]=val;
  saveLocal();
  if(db){db.ref('home/'+path).set(val===undefined?null:val).catch(e=>console.warn(e));}
  render();
}
function initFirebase(){
  try{
    if(typeof firebase==='undefined')throw new Error('no firebase');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    db.ref('home').on('value',snap=>{S=snap.val()||{};saveLocal();online=true;setSync();render();},err=>{console.warn(err);online=false;setSync();});
  }catch(e){console.warn(e);db=null;setSync();}
}
function setSync(){document.getElementById('sync').textContent=online?'● synced':'● offline copy';}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dkey(new Date());
function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
function parseKey(k){const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
const fmtDay=d=>d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}
function safeUrl(u){u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u)&&!/^[\w\-./]+\.(html|pdf)$/i.test(u))u='https://'+u;return /^(https?:\/\/|[\w\-./]+\.(html|pdf)$)/i.test(u)?u:'';}
function linkLabel(u){if(/youtu\.?be/i.test(u))return '▶ Watch video';if(/\.pdf(\?|$)/i.test(u))return '📄 Open PDF';return '🔗 Open link';}
function entries(o){return o?Object.keys(o).map(k=>Object.assign({id:k},o[k])):[];}
function weekStatus(kid,n){return getIn('progress/'+kid+'/w'+n)||'';}
function suggested(kid){
  const cur=getIn('current/'+kid);
  const ws=KIDS[kid].weeks;
  if(cur&&weekStatus(kid,cur)!=='mastered')return cur;
  for(const w of ws){const st=weekStatus(kid,w[0]);if(st!=='mastered'&&st!=='skipped')return w[0];}
  for(const w of ws){if(weekStatus(kid,w[0])!=='mastered')return w[0];}
  return null;
}
function nextAfter(kid,cur){
  const ws=KIDS[kid].weeks;
  for(const w of ws){if(w[0]===cur)continue;const st=weekStatus(kid,w[0]);if(st!=='mastered'&&st!=='skipped'&&w[0]>cur)return w[0];}
  for(const w of ws){if(w[0]===cur)continue;const st=weekStatus(kid,w[0]);if(st!=='mastered'&&st!=='skipped')return w[0];}
  return null;
}
function weekObj(kid,n){return KIDS[kid].weeks.find(w=>w[0]===n);}
function masteredCount(kid){return KIDS[kid].weeks.filter(w=>weekStatus(kid,w[0])==='mastered').length;}
function factsStage(kid){const sp=KIDS[kid].spine;for(let i=0;i<sp.length;i++){if(!getIn('facts/'+kid+'/done/'+sp[i][0]))return i;}return -1;}
function assignList(kid){return entries(getIn('assign/'+kid));}
function badge(a){
  if(a.grade==='got')return '<span class="badge b-got">Got it</span>';
  if(a.grade==='needs')return '<span class="badge b-needs">Needs work</span>';
  if(a.grade==='redo')return '<span class="badge b-redo">Redo</span>';
  if(a.done)return '<span class="badge b-wait">Waiting for Mom</span>';
  return '';
}
function itemHtml(kid,a,showDate){
  const u=safeUrl(a.link);
  return '<div class="row '+(a.done?'done':'')+'"><button class="chk '+(a.done?'on':'')+'" onclick="toggleDone(\''+kid+'\',\''+a.id+'\')" aria-label="done">'+(a.done?'✓':'')+'</button>'
   +'<div class="rt"><div class="t">'+esc(a.title)+badge(a)+'</div>'
   +(showDate?'<div class="small muted">'+esc(fmtDay(parseKey(a.date)))+'</div>':'')
   +(a.note?'<div class="small muted">Mom: '+esc(a.note)+'</div>':'')
   +(u?'<a class="linkchip" target="_blank" rel="noopener" href="'+esc(u)+'">'+linkLabel(u)+'</a>':'')+'</div></div>';
}

/* ---------- actions ---------- */
function toggleDone(kid,id){
  const a=getIn('assign/'+kid+'/'+id);if(!a)return;
  const nd=!a.done;
  const upd=Object.assign({},a,{done:nd});
  if(nd&&a.grade==='redo')upd.grade='';
  if(!nd)upd.grade='';
  put('assign/'+kid+'/'+id,upd);
}
function toggleFactsToday(kid){const k='facts/'+kid+'/log/'+todayKey();put(k,getIn(k)?null:true);}
function dismissMsg(kid,id){put('inbox/'+kid+'/'+id+'/seen',true);}
function setWeek(kid,n,st){
  if(st==='current'){put('current/'+kid,n);if(weekStatus(kid,n)==='mastered'||weekStatus(kid,n)==='skipped')put('progress/'+kid+'/w'+n,null);toast('Week '+n+' is '+KIDS[kid].name+'\'s focus');return;}
  put('progress/'+kid+'/w'+n,st||null);
  if(st==='mastered'&&getIn('current/'+kid)===n){put('current/'+kid,null);}
}
function grade(kid,id,g){
  const a=getIn('assign/'+kid+'/'+id);if(!a)return;
  const upd=Object.assign({},a,{grade:g});
  if(g==='redo')upd.done=false;
  put('assign/'+kid+'/'+id,upd);
}
function setNote(kid,id,v){const a=getIn('assign/'+kid+'/'+id);if(!a)return;put('assign/'+kid+'/'+id,Object.assign({},a,{note:v}));}
function toggleStage(kid,code){const k='facts/'+kid+'/done/'+code;put(k,getIn(k)?null:true);}
function addAssign(kids,title,link,date){
  title=(title||'').trim();if(!title){toast('Add a title first');return false;}
  kids.forEach(kid=>{const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    put('assign/'+kid+'/'+id,{title:title,link:safeUrl(link),date:date,done:false,grade:'',note:'',ts:Date.now()});});
  return true;
}
function delAssign(kid,id){put('assign/'+kid+'/'+id,null);}
let armed=null;
function armDel(kid,id){if(armed===kid+id){armed=null;delAssign(kid,id);}else{armed=kid+id;render();setTimeout(()=>{if(armed===kid+id){armed=null;render();}},3500);}}

/* ---------- routing ---------- */
function go(h){location.hash=h;}
function pinOk(){try{return localStorage.getItem('wc_math_pin')==='1';}catch(e){return false;}}
function tryPin(){
  const v=document.getElementById('pin').value;
  if(v===MOM_PIN){try{localStorage.setItem('wc_math_pin','1');}catch(e){}render();}
  else{document.getElementById('pinmsg').textContent='Not quite — try again.';document.getElementById('pin').value='';}
}
function lockMom(){try{localStorage.removeItem('wc_math_pin');}catch(e){}go('#/');}
function render(){
  const app=document.getElementById('app');
  const h=(location.hash||'#/').replace(/^#\/?/,'').split('/');
  const keep=document.activeElement&&document.activeElement.tagName==='TEXTAREA'&&document.activeElement.id==='sendtext';
  if(keep)return; // do not clobber typing
  if(h[0]==='kid'&&KIDS[h[1]]){app.innerHTML=kidView(h[1],h[2]||'today');return;}
  if(h[0]==='mom'){
    if(!pinOk()){app.innerHTML=pinView();setTimeout(()=>{const p=document.getElementById('pin');if(p)p.focus();},50);return;}
    app.innerHTML=momView(h[1]||'home',h[2]);return;
  }
  app.innerHTML=landing();
}
function landing(){
  return '<div class="card" style="text-align:center;margin-top:20px"><h1 style="font-size:40px">Whose screen is it?</h1><p class="muted">Tap a name.</p></div>'
   +'<div class="hero"><button class="who ryder" onclick="go(\'#/kid/ryder\')">Ryder<small>'+KIDS.ryder.grade+' math</small></button>'
   +'<button class="who hadley" onclick="go(\'#/kid/hadley\')">Hadley<small>'+KIDS.hadley.grade+' math</small></button>'
   +'<button class="who mom" onclick="go(\'#/mom\')">Mom<small>planning &amp; checking</small></button></div>';
}
function pinView(){
  return '<div class="card pin"><h2 style="font-size:28px">Mom only</h2><p class="muted small">Enter your PIN. You only need to do this once on each device.</p>'
   +'<input id="pin" type="password" inputmode="numeric" maxlength="4" onkeydown="if(event.key===\'Enter\')tryPin()"><div id="pinmsg" class="small" style="color:var(--bad);min-height:18px"></div>'
   +'<button class="btn" onclick="tryPin()">Open</button></div>';
}

/* ---------- kid views ---------- */
function kidView(kid,tab){
  const K=KIDS[kid];
  const cur=suggested(kid);const w=cur?weekObj(kid,cur):null;
  let h='<div class="'+K.cls+'"><div class="khead"><h1>'+esc(K.name)+'\'s math</h1><div class="sub">'+esc(fmtDay(new Date()))+'</div></div>';
  h+='<div class="tabs"><a class="tab '+(tab==='today'?'on':'')+'" href="#/kid/'+kid+'">Today</a><a class="tab '+(tab==='week'?'on':'')+'" href="#/kid/'+kid+'/week">This week</a><a class="tab '+(tab==='report'?'on':'')+'" href="#/kid/'+kid+'/report">My grades</a></div>';
  if(tab==='week')h+=kidWeek(kid);else if(tab==='report')h+=kidReport(kid);else h+=kidToday(kid,w);
  return h+'</div>';
}
function kidToday(kid,w){
  const K=KIDS[kid];const tk=todayKey();
  let h='';
  const msgs=entries(getIn('inbox/'+kid)).filter(m=>!m.seen||m.pin).sort((a,b)=>b.ts-a.ts);
  msgs.forEach(m=>{const u=safeUrl(m.link);
    h+='<div class="msg"><div class="from">From Mom</div><div>'+esc(m.text).replace(/\n/g,'<br>')+'</div>'+(u?'<a class="linkchip" target="_blank" rel="noopener" href="'+esc(u)+'">'+linkLabel(u)+'</a>':'')
     +(m.pin?'':' <button class="btn sm alt" style="margin-top:8px" onclick="dismissMsg(\''+kid+'\',\''+m.id+'\')">Got it</button>')+'</div>';});
  if(w)h+='<div class="card focus"><div class="small muted">THIS WEEK</div><h2 style="font-size:26px">Week '+w[0]+': '+esc(w[1])+'</h2><div class="small muted">'+esc(w[2])+'</div></div>';
  const items=assignList(kid);
  const today=items.filter(a=>a.date===tk).sort((a,b)=>a.ts-b.ts);
  const open=items.filter(a=>a.date<tk&&(!a.done||a.grade==='redo'||a.grade==='needs')&&a.grade!=='got').sort((a,b)=>a.date<b.date?-1:1);
  h+='<div class="card"><h3 style="font-size:24px">Today</h3>';
  const si=factsStage(kid);const sp=K.spine;
  const fdone=!!getIn('facts/'+kid+'/log/'+tk);
  if(si>=0){h+='<div class="row '+(fdone?'done':'')+'"><button class="chk '+(fdone?'on':'')+'" onclick="toggleFactsToday(\''+kid+'\')">'+(fdone?'✓':'')+'</button><div class="rt"><div class="t">Daily facts drill · 3–5 minutes</div><div class="small muted">'+sp[si][0]+': '+esc(sp[si][1])+'</div></div></div>';}
  if(!today.length)h+='<p class="muted" style="padding:10px 0">Nothing else assigned for today.</p>';
  today.forEach(a=>h+=itemHtml(kid,a));
  h+='</div>';
  if(open.length){h+='<div class="card"><h3 style="font-size:22px">Still open</h3>';open.forEach(a=>h+=itemHtml(kid,a,true));h+='</div>';}
  return h;
}
function kidWeek(kid){
  const mon=mondayOf(new Date());const tk=todayKey();const items=assignList(kid);
  const cur=suggested(kid);const w=cur?weekObj(kid,cur):null;
  let h='';
  if(w)h+='<div class="card focus"><div class="small muted">THIS WEEK</div><h2 style="font-size:24px">Week '+w[0]+': '+esc(w[1])+'</h2></div>';
  h+='<div class="week">';
  for(let i=0;i<5;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=dkey(d);
    const its=items.filter(a=>a.date===k).sort((a,b)=>a.ts-b.ts);
    h+='<div class="day '+(k===tk?'today':'')+'"><h4>'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</h4>';
    if(!its.length)h+='<div class="small muted">—</div>';
    its.forEach(a=>{h+='<div class="mini">'+(a.done?'✅ ':'⬜ ')+esc(a.title)+badge(a)+'</div>';});
    h+='</div>';}
  return h+'</div>';
}
function kidReport(kid){
  const K=KIDS[kid];const items=assignList(kid);
  const g=items.filter(a=>a.grade==='got').length,n=items.filter(a=>a.grade==='needs').length,r=items.filter(a=>a.grade==='redo').length;
  const tot=g+n+r;const pct=tot?Math.round(g/tot*100):null;
  const m=masteredCount(kid);
  let h='<div class="card"><h3 style="font-size:26px">Math report card</h3>';
  h+='<div class="grid2" style="margin-top:10px"><div><div class="small muted">Work checked by Mom</div><div style="font:700 44px \'Cormorant Garamond\',serif;color:var(--kc)">'+(pct===null?'—':pct+'%')+'</div><div class="small muted">'+g+' got it · '+n+' needs work · '+r+' redo</div></div>'
    +'<div><div class="small muted">Weeks mastered</div><div style="font:700 44px \'Cormorant Garamond\',serif;color:var(--kc)">'+m+' <span style="font-size:24px" class="muted">of 30</span></div><div class="bar"><i style="width:'+(m/30*100)+'%"></i></div></div></div>';
  const done=K.spine.filter(s=>getIn('facts/'+kid+'/done/'+s[0])).length;
  h+='<div style="margin-top:14px"><div class="small muted">Daily facts stages finished</div><b>'+done+' of '+K.spine.length+'</b></div></div>';
  return h;
}

/* ---------- mom views ---------- */
function momView(tab,arg){
  let h='<div class="tabs" style="margin-top:0"><a class="tab '+(tab==='home'?'on':'')+'" href="#/mom">Home</a><a class="tab '+(tab==='ladder'?'on':'')+'" href="#/mom/ladder/ryder">Ladder</a><a class="tab '+(tab==='plan'?'on':'')+'" href="#/mom/plan">Assign</a><a class="tab '+(tab==='check'?'on':'')+'" href="#/mom/check">Check work'+(pendingCount()?' ('+pendingCount()+')':'')+'</a><a class="tab '+(tab==='send'?'on':'')+'" href="#/mom/send">Send</a><button class="tab" onclick="lockMom()">Lock</button></div>';
  if(tab==='ladder')h+=ladderView(KIDS[arg]?arg:'ryder');
  else if(tab==='plan')h+=planView();
  else if(tab==='check')h+=checkView();
  else if(tab==='send')h+=sendView();
  else h+=homeView();
  return h;
}
function pendingCount(){let c=0;Object.keys(KIDS).forEach(k=>assignList(k).forEach(a=>{if(a.done&&!a.grade)c++;}));return c;}
function homeView(){
  const tk=todayKey();
  let h='<div class="grid2">';
  Object.keys(KIDS).forEach(kid=>{
    const K=KIDS[kid];const cur=suggested(kid);const w=cur?weekObj(kid,cur):null;
    const items=assignList(kid);const t=items.filter(a=>a.date===tk);const td=t.filter(a=>a.done).length;
    const pend=items.filter(a=>a.done&&!a.grade).length;const m=masteredCount(kid);
    h+='<div class="card '+K.cls+'" style="border-top:6px solid var(--kc)"><h2 style="font-size:30px;color:var(--kc)">'+K.name+' <span class="muted small" style="font-family:Jost">'+K.grade+'</span></h2>'
      +(w?'<div class="small muted" style="margin-top:8px">THIS WEEK</div><div style="font-weight:600;font-size:18px">Week '+w[0]+': '+esc(w[1])+'</div><div class="small muted">'+esc(w[2])+'</div>':'<p class="muted">All 30 weeks are mastered or skipped.</p>')
      +'<div style="margin:12px 0 4px" class="small muted">Ladder · '+m+' of 30 mastered</div><div class="bar"><i style="width:'+(m/30*100)+'%"></i></div>'
      +'<div class="small" style="margin-top:12px">Today: '+td+' of '+t.length+' done · '+pend+' waiting for you to check</div>'
      +'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm k" style="text-decoration:none;display:inline-block" href="#/mom/ladder/'+kid+'">Open ladder</a><a class="btn sm alt" style="text-decoration:none;display:inline-block" href="#/kid/'+kid+'">See '+K.name+'\'s screen</a></div></div>';
  });
  h+='</div>';
  const sent=[];Object.keys(KIDS).forEach(k=>entries(getIn('inbox/'+k)).forEach(m=>sent.push(Object.assign({kid:k},m))));
  sent.sort((a,b)=>b.ts-a.ts);
  h+='<div class="card"><h3 style="font-size:22px">Sent recently</h3>';
  if(!sent.length)h+='<p class="muted small">Nothing sent yet.</p>';
  sent.slice(0,5).forEach(m=>{h+='<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><b>'+KIDS[m.kid].name+'</b> · '+esc(m.text).slice(0,90)+' <span class="muted">'+(m.seen?'· seen':'· not seen yet')+'</span></div>';});
  return h+'</div>';
}
function selWeek(kid){return sel[kid]||suggested(kid)||1;}
function ladderView(kid){
  const K=KIDS[kid];const n=selWeek(kid);const cur=suggested(kid);
  const nxt=cur?nextAfter(kid,cur):null;
  let h='<div class="'+K.cls+'"><div class="tog" style="margin-bottom:12px">'
   +Object.keys(KIDS).map(k=>'<a class="tab '+(k===kid?'on':'')+'" style="--kc:'+(k==='ryder'?'var(--teal)':'var(--rose)')+'" href="#/mom/ladder/'+k+'">'+KIDS[k].name+'</a>').join('')+'</div>';
  h+='<div class="ladder"><div class="card"><h3 style="font-size:22px;margin-bottom:4px">'+K.name+'\'s ladder</h3><div class="small muted" style="margin-bottom:10px">Bottom is Week 1. Climb up. Tap a rung.</div><div class="rungs">';
  for(let i=30;i>=1;i--){
    const w=weekObj(kid,i);const st=weekStatus(kid,i);
    let cls='',lab='Open';
    if(st==='mastered'){cls='mastered';lab='Mastered ✓';}
    else if(st==='skipped'){cls='skipped';lab='Skipped for now';}
    else if(i===cur){cls='current';lab='This week';}
    else if(i===nxt){cls='next';lab='Suggested next';}
    h+='<button class="rung '+cls+' '+(i===n?'sel':'')+'" onclick="selectRung(\''+kid+'\','+i+')"><span class="n">'+i+'</span><span class="f">'+esc(w[1])+'</span><span class="s">'+lab+'</span></button>';
  }
  h+='</div></div><div>';
  const w=weekObj(kid,n);const st=weekStatus(kid,n);
  const covTxt={w:'Covered well in the book',p:'Partly covered in the book',n:'Not in the book — add supplemental practice'}[w[4]];
  h+='<div class="card" style="border-top:6px solid var(--kc)"><div class="small muted">WEEK '+n+'</div><h2 style="font-size:28px">'+esc(w[1])+'</h2>'
    +'<div class="small muted" style="margin-top:6px">Topics</div><div>'+esc(w[2])+'</div>'
    +'<div class="small muted" style="margin-top:10px">'+(kid==='ryder'?'He':'She')+' can</div><div>'+esc(w[3])+'</div>'
    +'<div class="small cov-'+w[4]+'" style="margin-top:10px;font-weight:600">'+K.book+': '+covTxt+'</div>'
    +'<div class="small muted" style="margin-top:10px">Test-out quiz: 15 questions, 85% (13 of 15) to skip. One retake; a second miss keeps the week open. Quiz questions are coming in a later update — mark the week mastered yourself for now.</div>'
    +'<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'
    +'<button class="btn sm k" onclick="setWeek(\''+kid+'\','+n+',\'current\')">Make this week\'s focus</button>'
    +'<button class="btn sm ok" onclick="setWeek(\''+kid+'\','+n+',\'mastered\')">Mark mastered</button>'
    +'<button class="btn sm warn" onclick="setWeek(\''+kid+'\','+n+',\'skipped\')">Skip for now</button>'
    +(st?'<button class="btn sm alt" onclick="setWeek(\''+kid+'\','+n+',\'\')">Reopen</button>':'')
    +'<button class="btn sm alt" onclick="planFromWeek(\''+kid+'\','+n+')">Assign to today…</button></div></div>';
  // spine
  const si=factsStage(kid);
  h+='<div class="card"><h3 style="font-size:20px">Daily facts track</h3><div class="small muted">3–5 minutes a day. A stage is done only when answers are accurate and unhesitating.</div>';
  K.spine.forEach((s,i)=>{const d=!!getIn('facts/'+kid+'/done/'+s[0]);
    h+='<div class="stage"><button class="chk '+(d?'on':'')+'" style="--kc:var(--forest)" onclick="toggleStage(\''+kid+'\',\''+s[0]+'\')">'+(d?'✓':'')+'</button><div><b>'+s[0]+'</b> '+(i===si?'<span class="badge b-wait" style="background:var(--kc)">Now</span>':'')+esc(s[1])+'<div class="small muted">Done when: '+esc(s[3])+' · '+esc(s[2])+'</div></div></div>';});
  h+='</div>';
  h+='<div class="card"><h3 style="font-size:20px">Optional extra weeks</h3><div class="small muted">Not required. Use whenever you like.</div>';
  K.extras.forEach(x=>{h+='<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><b>'+x[0]+' '+esc(x[1])+'</b> · '+esc(x[2])+'<br><span class="muted">'+esc(x[3])+'</span></div>';});
  h+='</div></div></div></div>';
  return h;
}
function selectRung(kid,n){sel[kid]=n;render();}
let planPrefill=null;
function planFromWeek(kid,n){const w=weekObj(kid,n);planPrefill={kid:kid,title:'Week '+n+': '+w[1]};go('#/mom/plan');}
function planView(){
  const pf=planPrefill;planPrefill=null;
  const tk=todayKey();
  let h='<div class="card"><h3 style="font-size:24px">Assign work</h3>'
   +'<label>Who</label><div class="tog" id="pk"><button class="tab on" data-k="ryder">Ryder</button><button class="tab" data-k="hadley">Hadley</button><button class="tab" data-k="both">Both</button></div>'
   +'<label>What</label><input id="pt" placeholder="e.g. Masterbooks lesson 12, or Khan Academy: fractions" value="'+esc(pf?pf.title:'')+'">'
   +'<label>Link (optional — website, PDF or video)</label><input id="pl" placeholder="https://…">'
   +'<label>Which day</label><input id="pd" type="date" value="'+tk+'">'
   +'<div style="margin-top:14px"><button class="btn" onclick="submitAssign()">Add to their list</button></div></div>';
  ['ryder','hadley'].forEach(kid=>{
    const items=assignList(kid).filter(a=>a.date>=tk).sort((a,b)=>a.date<b.date?-1:a.ts-b.ts);
    h+='<div class="card '+KIDS[kid].cls+'"><h3 style="font-size:20px;color:var(--kc)">Coming up for '+KIDS[kid].name+'</h3>';
    if(!items.length)h+='<p class="muted small">Nothing assigned yet.</p>';
    items.forEach(a=>{h+='<div class="row"><div class="rt"><div class="t">'+esc(a.title)+'</div><div class="small muted">'+esc(fmtDay(parseKey(a.date)))+'</div></div><button class="btn sm '+(armed===kid+a.id?'bad':'alt')+'" onclick="armDel(\''+kid+'\',\''+a.id+'\')">'+(armed===kid+a.id?'Tap again to delete':'Delete')+'</button></div>';});
    h+='</div>';});
  setTimeout(bindPlan,0);
  if(pf){setTimeout(()=>{const b=document.querySelector('#pk [data-k="'+pf.kid+'"]');if(b)b.click();},0);}
  return h;
}
function bindPlan(){document.querySelectorAll('#pk .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pk .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');});}
function submitAssign(){
  const on=document.querySelector('#pk .tab.on');const k=on?on.dataset.k:'ryder';
  const kids=k==='both'?['ryder','hadley']:[k];
  const ok=addAssign(kids,document.getElementById('pt').value,document.getElementById('pl').value,document.getElementById('pd').value||todayKey());
  if(ok)toast('Added');
}
function checkView(){
  let h='';
  Object.keys(KIDS).forEach(kid=>{
    const K=KIDS[kid];const items=assignList(kid);
    const pend=items.filter(a=>a.done&&!a.grade).sort((a,b)=>a.date<b.date?-1:1);
    const g=items.filter(a=>a.grade==='got').length,n=items.filter(a=>a.grade==='needs').length,r=items.filter(a=>a.grade==='redo').length;const tot=g+n+r;
    h+='<div class="card '+K.cls+'" style="border-top:6px solid var(--kc)"><h3 style="font-size:24px;color:var(--kc)">'+K.name+'</h3>';
    if(!pend.length)h+='<p class="muted small">Nothing waiting to be checked.</p>';
    pend.forEach(a=>{const u=safeUrl(a.link);
      h+='<div class="row"><div class="rt"><div class="t">'+esc(a.title)+'</div><div class="small muted">'+esc(fmtDay(parseKey(a.date)))+'</div>'+(u?'<a class="linkchip" target="_blank" rel="noopener" href="'+esc(u)+'">'+linkLabel(u)+'</a>':'')
       +'<input style="margin-top:8px" placeholder="Note for '+K.name+' (optional)" value="'+esc(a.note||'')+'" onchange="setNote(\''+kid+'\',\''+a.id+'\',this.value)"></div>'
       +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ok" onclick="grade(\''+kid+'\',\''+a.id+'\',\'got\')">Got it</button><button class="btn sm warn" onclick="grade(\''+kid+'\',\''+a.id+'\',\'needs\')">Needs work</button><button class="btn sm bad" onclick="grade(\''+kid+'\',\''+a.id+'\',\'redo\')">Redo</button></div></div>';});
    h+='<div class="small muted" style="margin-top:10px">Report card · '+(tot?Math.round(g/tot*100)+'% got it':'no checked work yet')+' ('+g+' got it, '+n+' needs work, '+r+' redo) · '+masteredCount(kid)+' of 30 weeks mastered</div></div>';
  });
  return h;
}
function sendView(){
  let h='<div class="card"><h3 style="font-size:24px">Send to a screen</h3><p class="muted small">It shows up as a “From Mom” card at the top of their Today screen the next time it is open. No email.</p>'
   +'<label>To</label><div class="tog" id="sk"><button class="tab '+(msgFilter==='ryder'?'on':'')+'" data-k="ryder">Ryder</button><button class="tab '+(msgFilter==='hadley'?'on':'')+'" data-k="hadley">Hadley</button><button class="tab '+(msgFilter==='both'?'on':'')+'" data-k="both">Both</button></div>'
   +'<label>Message</label><textarea id="sendtext" placeholder="Try this one after lunch…"></textarea>'
   +'<label>Link (optional)</label><input id="sendlink" placeholder="https://…">'
   +'<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="sendpin" style="width:auto"> Keep at the top of Today until I remove it</label>'
   +'<div style="margin-top:14px"><button class="btn" onclick="submitSend()">Send</button></div></div>';
  const sent=[];Object.keys(KIDS).forEach(k=>entries(getIn('inbox/'+k)).forEach(m=>sent.push(Object.assign({kid:k},m))));
  sent.sort((a,b)=>b.ts-a.ts);
  h+='<div class="card"><h3 style="font-size:20px">Sent recently</h3>';
  if(!sent.length)h+='<p class="muted small">Nothing sent yet.</p>';
  sent.slice(0,10).forEach(m=>{h+='<div class="row"><div class="rt"><div class="small"><b>'+KIDS[m.kid].name+'</b> '+(m.pin?'· pinned ':'')+'<span class="muted">'+(m.seen?'· seen':'· not seen yet')+'</span></div><div>'+esc(m.text)+'</div></div><button class="btn sm alt" onclick="put(\'inbox/'+m.kid+'/'+m.id+'\',null)">Remove</button></div>';});
  setTimeout(()=>document.querySelectorAll('#sk .tab').forEach(b=>b.onclick=()=>{msgFilter=b.dataset.k;document.querySelectorAll('#sk .tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');}),0);
  return h+'</div>';
}
function submitSend(){
  const text=document.getElementById('sendtext').value.trim();const link=safeUrl(document.getElementById('sendlink').value);
  if(!text&&!link){toast('Write a message or add a link');return;}
  const pin=document.getElementById('sendpin').checked;
  const kids=msgFilter==='both'?['ryder','hadley']:[msgFilter];
  kids.forEach(k=>{const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    put('inbox/'+k+'/'+id,{text:text||'A link for you',link:link,pin:pin,seen:false,ts:Date.now()});});
  document.getElementById('sendtext').value='';document.getElementById('sendlink').value='';
  toast('Sent');render();
}

window.addEventListener('hashchange',render);
document.addEventListener('DOMContentLoaded',function(){loadLocal();render();initFirebase();});
</script>
