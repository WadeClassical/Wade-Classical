<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythic Kin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120a06; --panel:#EAD9BE; --ink:#241812; --ink-soft:#8A6A46;
    --gold:#E8A94A; --gold-bright:#FFE5B0; --line:rgba(255,190,120,.2);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at center, #2a1a10, #120a06);
    font-family:'EB Garamond', serif; color:var(--panel); padding:26px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  .masthead{text-align:center; margin-bottom:20px;}
  .masthead .tag{color:var(--gold); font-family:'Cinzel',serif; font-size:12px; letter-spacing:.25em; text-transform:uppercase; margin-bottom:6px;}
  .masthead h1{font-family:'Cinzel',serif; font-weight:700; font-size:30px; letter-spacing:.03em; margin:0 0 4px; color:var(--gold-bright); text-transform:uppercase;}
  .masthead .sub{font-style:italic; color:var(--ink-soft); font-size:15px;}
  .rule{border:none; height:2px; margin:14px auto; width:100px; background:linear-gradient(90deg,transparent,var(--gold),transparent);}

  .kid-row{display:flex; gap:12px; justify-content:center; margin-bottom:20px;}
  .kid-badge{font-family:'Cinzel',serif; font-weight:600; font-size:14px; background:transparent; border:2px solid var(--gold); color:var(--gold); padding:10px 24px; border-radius:20px; cursor:pointer; text-transform:uppercase;}
  .kid-badge.active{background:var(--gold); color:#241812;}

  .backlink{display:inline-block; margin-bottom:14px; color:var(--ink-soft); text-decoration:none; font-family:'Cinzel',serif; font-size:12px; letter-spacing:.05em; cursor:pointer; text-transform:uppercase;}
  .backlink:hover{color:var(--gold-bright);}

  .progress-bar{background:rgba(255,255,255,.06); border-radius:20px; height:10px; overflow:hidden; margin-bottom:6px;}
  .progress-fill{background:linear-gradient(90deg,var(--gold),var(--gold-bright)); height:100%;}
  .progress-label{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:20px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-bottom:20px;}
  .slot{border-radius:12px; padding:14px 10px; text-align:center; cursor:pointer; border:2px solid var(--line);}
  .slot.locked{background:rgba(255,255,255,.03); opacity:.55;}
  .slot.unlocked{background:rgba(255,255,255,.05); border-color:var(--gold);}
  .slot .glyph{font-size:26px; margin-bottom:6px;}
  .slot .name{font-family:'Cinzel',serif; font-size:12px; text-transform:uppercase; letter-spacing:.03em;}
  .slot .chapter{font-size:11px; color:var(--ink-soft); margin-top:4px;}

  .capstone-card{
    border-radius:14px; padding:18px 20px; text-align:center; margin-top:10px; cursor:pointer;
    border:2px solid var(--gold); background:rgba(232,169,74,.08);
  }
  .capstone-card.locked{opacity:.5; cursor:default;}
  .capstone-card .glyph{font-size:32px; margin-bottom:8px;}
  .capstone-card .name{font-family:'Cinzel',serif; font-size:16px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold-bright);}

  .card{width:100%; max-width:320px; margin:0 auto; border-radius:18px; padding:14px;}
  .card-inner{background:linear-gradient(180deg,#241812,#150d09); border-radius:12px; padding:16px 16px 20px; border:1px solid rgba(255,190,120,.25);}
  .card-name{font-family:'Cinzel',serif; font-weight:700; font-size:22px; letter-spacing:.03em; text-align:center; text-transform:uppercase; margin:0 0 10px;
    background:linear-gradient(100deg,var(--gold),var(--gold-bright),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .art-window{position:relative; border-radius:10px; overflow:hidden; height:200px; margin-bottom:12px; border:1px solid rgba(255,190,120,.3);}
  .stat-block{background:rgba(255,255,255,.03); border-radius:8px; margin-bottom:12px; border:1px solid rgba(255,190,120,.25); overflow:hidden;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:7px 14px; border-bottom:1px solid rgba(255,190,120,.12);}
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-family:'Cinzel',serif; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .stat-value{font-size:14px; font-weight:600; color:var(--gold-bright); text-align:right;}
  .blurb{background:rgba(255,255,255,.04); border-radius:8px; padding:12px 14px; color:var(--panel); font-size:14px; line-height:1.5; border:1px solid rgba(255,190,120,.15); margin-bottom:10px;}
  .fun-fact{font-style:italic; color:var(--ink-soft); font-size:12px; text-align:center;}

  .panel{background:rgba(255,255,255,.04); border-radius:12px; padding:18px 20px; margin-bottom:16px; border:1px solid var(--line);}
  .q-block{background:rgba(255,255,255,.03); border-radius:8px; padding:12px 14px; margin-bottom:10px; border-left:3px solid var(--gold);}
  .btn{font-family:'Cinzel',serif; font-size:13px; letter-spacing:.03em; text-transform:uppercase; background:var(--gold); color:#241812; border:none; padding:11px 24px; border-radius:6px; cursor:pointer;}
  .btn.secondary{background:transparent; color:var(--gold); border:2px solid var(--gold); padding:9px 22px;}
  .actions{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}

  textarea{width:100%; font-family:'EB Garamond',serif; font-size:15px; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); margin-bottom:12px;}
  .reflect-label{font-family:'Cinzel',serif; font-size:13px; color:var(--gold); margin-bottom:6px; display:block;}

  .stamp{text-align:center; padding:20px; animation:stampIn .5s cubic-bezier(.3,1.6,.5,1);}
  @keyframes stampIn{0%{transform:scale(.5) rotate(-15deg); opacity:0;} 100%{transform:scale(1) rotate(-3deg); opacity:1;}}
  .stamp .box{display:inline-block; border:4px solid var(--gold); color:var(--gold-bright); font-family:'Cinzel',serif; font-weight:700; font-size:18px; padding:12px 24px; transform:rotate(-3deg); text-transform:uppercase;}

  .review-row{border-bottom:1px solid var(--line); padding:10px 0; font-size:14px;}
</style>
</head>

      name:"Hephaestus", roman:"Vulcan", unlockChapter:8,
      artBg:"radial-gradient(ellipse at 50% 65%, #7A2E0E, #2A1006 75%)",
      stats:[["Domain","Fire & Forge"],["Symbol","Hammer & Anvil"],["Roman name","Vulcan"],["Parents","Zeus & Hera"],["Wife","Aphrodite"],["Home","Mount Etna"]],
      blurb:"Born to Zeus and Hera, Hephaestus was cast out of Olympus for his lameness \u2014 yet became the greatest craftsman the gods ever knew. In his forge beneath the mountain, he built armor for heroes, thrones for gods, and mechanical servants of gold to assist him.",
      funFact:"The word \u201Cvolcano\u201D comes from Vulcan \u2014 the Romans believed eruptions were his forge venting.",
      questions:[
        "Hephaestus was rejected for how he looked, but became the most skilled craftsman of all the gods. Where have you seen someone underestimated turn out to be the most capable person in the room?"
      ]
    },
    hermes: {
      name:"Hermes", roman:"Mercury", unlockChapter:6,
      artBg:"radial-gradient(ellipse at 50% 60%, #5a5a1a, #181808 75%)",
      stats:[["Domain","Travel & Messages"],["Symbol","Winged Sandals"],["Roman name","Mercury"],["Parents","Zeus & Maia"],["Son","Luke"]],
      blurb:"God of travelers, thieves, and messengers, Hermes is the fastest of all the gods, carried by his winged sandals. He serves as the official messenger of Olympus, and was said to have invented the lyre on the very day he was born.",
      funFact:"\u201CMercurial\u201D (quick to change) comes from Mercury, his Roman name.",
      questions:[
        "Luke is Hermes' son, and he's bitter that his father was never around. Do you think that fully explains why Luke turned against everyone at camp, or is that letting him off the hook?"
      ]
    },
    dionysus: {
      name:"Dionysus", roman:"Bacchus", unlockChapter:5,
      artBg:"radial-gradient(ellipse at 50% 60%, #4a2a5a, #140a1a 75%)",
      stats:[["Domain","Wine & Festivity"],["Symbol","Grapevine"],["Roman name","Bacchus"],["Parents","Zeus & Semele"],["Camp Role","Director"]],
      blurb:"God of wine, festivity, and madness, Dionysus can bring wild joy or complete chaos wherever he goes. Zeus assigned him to run Camp Half-Blood as a punishment for chasing a forbidden wood nymph \u2014 a job he resents openly.",
      funFact:"\u201CBacchanalian\u201D (a wild, unrestrained celebration) comes from Bacchus, his Roman name.",
      questions:[
        "Mr. D clearly doesn't want to be running Camp Half-Blood \u2014 it's literally his punishment. Have you ever had to do a responsibility you didn't choose? How did you handle it?"
      ]
    }
  }
};

const GOD_ORDER = ["zeus","poseidon","hades","hera","demeter","athena","apollo","artemis","ares","aphrodite","hephaestus","hermes","dionysus"];

const CAPSTONE_QUESTIONS = [
  { id:"q1", label:"Which god's story did you connect with the most, and why?" },
  { id:"q2", label:"What's one trait from a god you'd genuinely like to have more of yourself?" },
  { id:"q3", label:"What's something about you that people might underestimate \u2014 the way people underestimated Hephaestus, or the way Percy got dismissed for his dyslexia?" }
];

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
let currentKid = null;
let kidProgress = {};
let kidCapstone = {};
const params = new URLSearchParams(location.search);
const reviewMode = params.get("review") === "1";

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ---------------------------------------------------------------------
// RENDER: KID PICKER
// ---------------------------------------------------------------------
function renderKidPicker(){
  currentKid = null;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="masthead">
      <div class="tag">Wade Classical</div>
      <h1>Mythic Kin</h1>
      <div class="sub">a collection of the gods, gathered as you read</div>
      <hr class="rule">
    </div>
    <div class="kid-row">${Object.keys(GODS).map(k=>`<button class="kid-badge" data-kid="${k}">${cap(k)}</button>`).join("")}</div>
    <div style="text-align:center; font-family:'Cinzel',serif; font-size:12px;">
      <a href="?${reviewMode?'':'review=1'}" style="color:var(--ink-soft); text-decoration:none; text-transform:uppercase;">${reviewMode?'\u2190 Back':"Parent Review \u2192"}</a>
    </div>
  `;
  document.querySelectorAll("[data-kid]").forEach(b=>b.onclick=()=>openKid(b.dataset.kid));
}

function openKid(kid){
  currentKid = kid;
  Promise.all([
    db.ref(`mythicKin/${kid}/progress`).once("value"),
    db.ref(`mythicKin/${kid}/capstone`).once("value")
  ]).then(([p,c])=>{
    kidProgress = p.val() || {};
    kidCapstone = c.val() || {};
    if (reviewMode) renderReview(); else renderCollection();
  });
}

// ---------------------------------------------------------------------
// RENDER: COLLECTION GRID
// ---------------------------------------------------------------------
function renderCollection(){
  const gods = GODS[currentKid];
  const unlockedCount = GOD_ORDER.filter(id=>kidProgress[id]).length;
  const app = document.getElementById("app");
  let html = `<a class="backlink" id="backBtn">\u2190 Switch Scholar</a>`;
  html += `<div class="masthead" style="margin-bottom:14px;"><h1 style="font-size:24px;">${cap(currentKid)}'s Collection</h1></div>`;
  html += `<div class="progress-bar"><div class="progress-fill" style="width:${(unlockedCount/GOD_ORDER.length)*100}%"></div></div>`;
  html += `<div class="progress-label">${unlockedCount} of ${GOD_ORDER.length} gathered</div>`;
  html += `<div class="grid">`;
  GOD_ORDER.forEach(id=>{
    const g = gods[id];
    const unlocked = !!kidProgress[id];
    html += `<div class="slot ${unlocked?'unlocked':'locked'}" data-open="${id}">
        <div class="glyph">${unlocked?'\u2726':'\uD83D\uDD12'}</div>
        <div class="name">${unlocked?g.name:'???'}</div>
        <div class="chapter">${unlocked?'':'Ch. '+g.unlockChapter}</div>
      </div>`;
  });
  html += `</div>`;
  const allDone = unlockedCount >= GOD_ORDER.length;
  html += `<div class="capstone-card ${allDone?'':'locked'}" id="capstoneCard">
      <div class="glyph">\u269C\uFE0F</div>
      <div class="name">${allDone ? "Reveal Your Mythic Kin" : "Mythic Kin \u2014 locked until all 13 gathered"}</div>
    </div>`;
  app.innerHTML = html;
  document.getElementById("backBtn").onclick = renderKidPicker;
  document.querySelectorAll("[data-open]").forEach(s=>s.onclick=()=>openGod(s.dataset.open));
  if (allDone) document.getElementById("capstoneCard").onclick = renderCapstone;
}

// ---------------------------------------------------------------------
// RENDER: GOD DETAIL (unlocked card, or discussion prompt if locked)
// ---------------------------------------------------------------------
function openGod(id){
  const g = GODS[currentKid][id];
  const unlocked = !!kidProgress[id];
  const app = document.getElementById("app");
  let html = `<a class="backlink" id="backBtn">\u2190 Back to Collection</a>`;

  if (unlocked){
    html += renderCardHtml(g, id);
  } else {
    html += `<div class="panel">
        <p style="text-align:center; font-family:'Cinzel',serif; color:var(--gold);">This one unlocks around Chapter ${g.unlockChapter}.</p>
        <p>Read together, then talk through these:</p>
        ${g.questions.map(q=>`<div class="q-block">${escapeHtml(q)}</div>`).join("")}
        <div class="actions"><button class="btn" id="discussedBtn">We talked about this \u2014 unlock</button></div>
      </div>`;
  }
  app.innerHTML = html;
  document.getElementById("backBtn").onclick = renderCollection;
  const btn = document.getElementById("discussedBtn");
  if (btn) btn.onclick = () => {
    kidProgress[id] = true;
    db.ref(`mythicKin/${currentKid}/progress/${id}`).set(true).then(()=>openGod(id));
  };
}

function renderCardHtml(g, id){
  return `
    <div class="card">
      <div class="card-inner">
        <div class="card-name">${g.name}</div>
        <div class="art-window" style="background:${g.artBg}">
          <svg viewBox="0 0 300 200" width="100%" height="100%">
            <defs><radialGradient id="${id}Bg"><stop offset="0%" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
            ${GOD_ART[id] || ""}
          </svg>
        </div>
        <div class="stat-block">
          ${g.stats.map(([label,value])=>`<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${value}</span></div>`).join("")}
        </div>
        <div class="blurb">${g.blurb}</div>
        ${g.funFact ? `<div class="fun-fact">Fun fact: ${g.funFact}</div>` : ""}
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------
// RENDER: CAPSTONE
// ---------------------------------------------------------------------
function renderCapstone(){
  const app = document.getElementById("app");
  let html = `<a class="backlink" id="backBtn">\u2190 Back to Collection</a>`;
  html += `<div class="masthead" style="margin-bottom:10px;"><h1 style="font-size:24px;">Your Mythic Kin</h1></div>`;
  html += `<div class="panel">`;
  CAPSTONE_QUESTIONS.forEach(q=>{
    html += `<label class="reflect-label">${q.label}</label><textarea rows="2" data-cq="${q.id}">${escapeHtml(kidCapstone[q.id]||"")}</textarea>`;
  });
  html += `<label class="reflect-label">If you had to name your Mythic Kin \u2014 not your favorite, but the one whose nature actually matches yours \u2014 who is it?</label>
    <textarea rows="2" data-cq="kinChoice">${escapeHtml(kidCapstone.kinChoice||"")}</textarea>
    <label class="reflect-label">Why?</label>
    <textarea rows="3" data-cq="kinReason">${escapeHtml(kidCapstone.kinReason||"")}</textarea>`;
  html += `<div class="actions"><button class="btn" id="saveCapstoneBtn">Save</button></div>
    <div id="capstoneSaved" style="display:none; text-align:center; margin-top:14px;">
      <div class="stamp"><div class="box">Mythic Kin Declared</div></div>
    </div>`;
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById("backBtn").onclick = renderCollection;
  document.getElementById("saveCapstoneBtn").onclick = () => {
    document.querySelectorAll("[data-cq]").forEach(t=>{ kidCapstone[t.dataset.cq] = t.value; });
    db.ref(`mythicKin/${currentKid}/capstone`).set(kidCapstone).then(()=>{
      document.getElementById("capstoneSaved").style.display = "block";
    });
  };
}

// ---------------------------------------------------------------------
// PARENT REVIEW
// ---------------------------------------------------------------------
function renderReview(){
  const gods = GODS[currentKid];
  const unlockedCount = GOD_ORDER.filter(id=>kidProgress[id]).length;
  const app = document.getElementById("app");
  let html = `<a class="backlink" id="backBtn">\u2190 Switch Scholar</a>`;
  html += `<div class="masthead" style="margin-bottom:10px;"><h1 style="font-size:24px;">${cap(currentKid)}'s Progress</h1></div>`;
  html += `<div class="panel"><p><strong>Gathered:</strong> ${unlockedCount} of ${GOD_ORDER.length}</p>`;
  GOD_ORDER.forEach(id=>{
    html += `<div class="review-row">${gods[id].name} \u2014 ${kidProgress[id] ? "discussed" : "not yet"}</div>`;
  });
  html += `</div>`;
  if (Object.keys(kidCapstone).length){
    html += `<div class="panel"><div style="font-family:'Cinzel',serif; color:var(--gold); margin-bottom:10px;">Mythic Kin Reflection</div>`;
    CAPSTONE_QUESTIONS.forEach(q=>{
      html += `<div class="review-row"><strong>${q.label}</strong><br>${escapeHtml(kidCapstone[q.id]||"(no answer yet)")}</div>`;
    });
    html += `<div class="review-row"><strong>Chosen Mythic Kin:</strong> ${escapeHtml(kidCapstone.kinChoice||"(not yet)")}<br>${escapeHtml(kidCapstone.kinReason||"")}</div>`;
    html += `</div>`;
  }
  app.innerHTML = html;
  document.getElementById("backBtn").onclick = renderKidPicker;
}

// ---------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
  renderKidPicker();
});
</script>
</body>
</html>
