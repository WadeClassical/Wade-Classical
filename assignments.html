<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wade Classical — Assignments</title>
<style>
  /* ===== SEASONAL THEME — currently: FALL =====
     To swap seasons later, just change these values — every component
     below references these variables, nothing else needs to change. */
  :root{
    --bg:#F7EDDE;
    --card:#FFFCF6;
    --panel:#FBF1DE;
    --ink:#2E2018;
    --ink-soft:#7A6754;
    --accent:#C1592B;
    --accent-soft:#F3DCC0;
    --line:#B9C99A;
    --good:#6B7F4A;
    --good-soft:#E7EDDA;
    --good-ink:#3D4E2A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia,'Times New Roman',serif;
    background:
      radial-gradient(ellipse at top, rgba(193,89,43,.10), transparent 60%),
      var(--bg);
    color:var(--ink); line-height:1.5;
    padding:24px 16px 80px;
  }
  h1,h2,h3{font-family:Georgia,serif; margin:0 0 8px;}
  .wrap{max-width:760px; margin:0 auto;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .brand{font-size:22px; font-weight:bold; letter-spacing:.5px;}
  .kidswitch{display:flex; gap:8px;}
  .kidswitch button{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-family:inherit; font-size:14px;
  }
  .kidswitch button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:18px;
  }
  .assign-card{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .assign-card:hover{border-color:var(--accent);}
  .assign-title{font-size:18px; font-weight:bold;}
  .assign-sub{color:var(--ink-soft); font-size:14px; margin-top:2px;}
  .pill{
    font-size:12px; padding:4px 10px; border-radius:999px; font-family:sans-serif;
    background:var(--accent-soft); color:var(--accent); white-space:nowrap;
  }
  .pill.done{background:var(--good-soft); color:var(--good);}
  .btn{
    background:var(--accent); color:#fff; border:none; padding:10px 18px;
    border-radius:8px; cursor:pointer; font-family:sans-serif; font-size:14px; font-weight:600;
  }
  .btn.secondary{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .backlink{
    display:inline-block; margin-bottom:16px; color:var(--ink-soft); text-decoration:none;
    font-family:sans-serif; font-size:14px; cursor:pointer;
  }
  .section-label{
    background:var(--accent-soft); color:var(--accent); font-family:sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.5px; text-transform:uppercase;
    padding:6px 12px; border-radius:6px; display:inline-block; margin:22px 0 12px;
  }
  .passage-box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:16px;
  }
  .passage-box p{margin:0 0 10px;}
  .passage-box p:last-child{margin-bottom:0;}
  .q{margin-bottom:18px;}
  .q-prompt{font-weight:bold; margin-bottom:8px;}
  textarea, input[type=text]{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    background:#fff;
  }
  textarea{resize:vertical;}
  .blank-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .blank-row input{width:60px; flex:none; text-align:center;}
  .blank-row label{flex:1;}
  .field-label{font-family:sans-serif; font-size:13px; color:var(--ink-soft); margin:10px 0 4px;}
  .compare-box{background:var(--accent-soft); border-radius:8px; padding:10px 14px; margin-bottom:8px;}
  .status-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--line); padding:12px 16px; display:flex;
    align-items:center; justify-content:space-between; font-family:sans-serif; font-size:14px;
  }
  .status-msg{color:var(--ink-soft);}
  .status-msg.saved{color:var(--good);}
  .empty{color:var(--ink-soft); font-family:sans-serif; font-style:italic;}
  .review-row{border-bottom:1px solid var(--line); padding:14px 0;}
  .review-row:last-child{border-bottom:none;}
  .review-answer{background:var(--panel); border-radius:8px; padding:10px 12px; margin-top:6px; white-space:pre-wrap;}
  .review-key{background:var(--good-soft); border-radius:8px; padding:10px 12px; margin-top:6px; font-size:14px; color:var(--good-ink);}
  .footer-link{
    text-align:center; margin-top:30px; font-family:sans-serif; font-size:13px;
  }
  .footer-link a{color:var(--ink-soft);}

  .leaves-layer{
    position:fixed; top:0; left:0; width:100%; height:100%;
    overflow:hidden; pointer-events:none; z-index:0;
  }
  .leaf{
    position:absolute; top:-40px; will-change:transform;
    animation-name:leafFall; animation-timing-function:linear; animation-iteration-count:infinite;
    opacity:.75; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));
  }
  @keyframes leafFall{
    0%   { transform:translateY(0)     translateX(0)    rotate(0deg); }
    25%  { transform:translateY(27vh)  translateX(22px) rotate(90deg); }
    50%  { transform:translateY(54vh)  translateX(-18px) rotate(180deg); }
    75%  { transform:translateY(81vh)  translateX(16px)  rotate(270deg); }
    100% { transform:translateY(112vh) translateX(-12px) rotate(360deg); }
  }
  .wrap{position:relative; z-index:1;}
  .status-bar{z-index:2;}
</style>
</head>

          { id: "p1_diagram", type: "static", text: `Garden bed (how much fencing?):<br><svg viewBox="0 0 260 150" width="220" height="127" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="35" width="140" height="80" fill="#FFFFFF" stroke="#5B4E38" stroke-width="3"/><text x="130" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">8 ft</text><text x="45" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 45 75)">6 ft</text></svg>` },
          { id: "p1", type: "short", prompt: "Perimeter of the garden bed = ___ ft" },
          { id: "p2_diagram", type: "static", text: `Picture frame (how much trim?):<br><svg viewBox="0 0 260 150" width="220" height="127" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="35" width="140" height="80" fill="#FFFFFF" stroke="#5B4E38" stroke-width="3"/><text x="130" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9 in</text><text x="45" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 45 75)">7 in</text></svg>` },
          { id: "p2", type: "short", prompt: "Perimeter of the picture frame = ___ in" },
          { id: "p3_diagram", type: "static", text: `Deck (how much railing?):<br><svg viewBox="0 0 260 150" width="220" height="127" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="35" width="140" height="80" fill="#FFFFFF" stroke="#5B4E38" stroke-width="3"/><text x="130" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">12 ft</text><text x="45" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 45 75)">9 ft</text></svg>` },
          { id: "p3", type: "short", prompt: "Perimeter of the deck = ___ ft" }
        ]
      },
      {
        label: "Part 4 \u2014 Find the Missing Side",
        intro: "This time you know the area and one side \u2014 use division (the reverse of multiplication) to find the other side.",
        questions: [
          { id: "m1", type: "short", prompt: "A board has an area of 54 sq ft. One side is 6 ft. The other side = ___ ft" },
          { id: "m2", type: "short", prompt: "A panel has an area of 96 sq in. One side is 8 in. The other side = ___ in" },
          { id: "m3", type: "short", prompt: "A tile has an area of 63 sq ft. One side is 9 ft. The other side = ___ ft" }
        ]
      }
    ],
    answerKey: {
      a1: "56 sq ft (7 \u00d7 8)",
      a2: "54 sq ft (9 \u00d7 6)",
      a3: "84 sq in (12 \u00d7 7)",
      p1: "28 ft (8+6+8+6)",
      p2: "32 in (9+7+9+7)",
      p3: "42 ft (12+9+12+9)",
      m1: "9 ft (54 \u00f7 6)",
      m2: "12 in (96 \u00f7 8)",
      m3: "7 ft (63 \u00f7 9)"
    },
    scoringNotes: "This leans hard on the 6, 7, 8, 9, and 12 times tables \u2014 both forward (Parts 2-3) and backward as division (Part 4). If Part 4 is where he stumbles, that's a sign the multiplication facts are solid but the reverse (division) connection needs more practice \u2014 not a sign the geometry concept didn't land."
  }
};

const KIDS = ["ryder", "hadley"];

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
let currentKid = "ryder";
let currentWorksheetId = null;
let currentResponses = {};
let saveTimer = null;
const params = new URLSearchParams(location.search);
const reviewMode = params.get("review") === "1";

// ---------------------------------------------------------------------
// RENDER: PICKER (list of assignments for the selected kid)
// ---------------------------------------------------------------------
const SUBJECT_ORDER = ["Math", "Science", "Social Studies", "ELA", "Other"];

function renderPicker() {
  currentWorksheetId = null;
  const app = document.getElementById("app");
  document.getElementById("statusBar").style.display = "none";

  const list = Object.entries(WORKSHEETS).filter(([id, w]) => w.child === currentKid);
  const bySubject = {};
  list.forEach(([id, w]) => {
    const subj = w.subject || "Other";
    if (!bySubject[subj]) bySubject[subj] = [];
    bySubject[subj].push([id, w]);
  });

  let html = `
    <div class="topbar">
      <div class="brand">Wade Classical — Assignments</div>
      <div class="kidswitch">
        ${KIDS.map(k => `<button data-kid="${k}" class="${k === currentKid ? 'active' : ''}">${cap(k)}</button>`).join("")}
      </div>
    </div>
  `;

  if (reviewMode) {
    html += `<div class="section-label">Parent Review</div>`;
  }

  if (list.length === 0) {
    html += `<div class="card empty">No assignments yet for ${cap(currentKid)}.</div>`;
  } else {
    SUBJECT_ORDER.forEach(subj => {
      const items = bySubject[subj];
      if (!items || items.length === 0) return;
      html += `<div class="section-label">${subj}</div>`;
      items.forEach(([id, w]) => {
        html += `
          <div class="card assign-card" data-open="${id}">
            <div>
              <div class="assign-title">${w.title}</div>
              <div class="assign-sub">${w.subtitle || ""}</div>
            </div>
            <div class="pill" id="pill-${id}">...</div>
          </div>
        `;
      });
    });
  }

  html += `<div class="footer-link"><a href="?${reviewMode ? '' : 'review=1'}">${reviewMode ? '\u2190 Back to assignments' : 'Parent review view \u2192'}</a></div>`;

  app.innerHTML = html;

  document.querySelectorAll(".kidswitch button").forEach(btn => {
    btn.onclick = () => { currentKid = btn.dataset.kid; renderPicker(); };
  });
  document.querySelectorAll("[data-open]").forEach(card => {
    card.onclick = () => {
      const id = card.dataset.open;
      if (reviewMode) renderReview(id); else openWorksheet(id);
    };
  });

  // fill in completion pills async
  list.forEach(([id]) => {
    db.ref(`assignments/${currentKid}/${id}/meta`).once("value").then(snap => {
      const meta = snap.val() || {};
      const pill = document.getElementById(`pill-${id}`);
      if (!pill) return;
      pill.textContent = meta.submitted ? "Done" : "Not started";
      pill.className = "pill" + (meta.submitted ? " done" : "");
    });
  });
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ---------------------------------------------------------------------
// RENDER: WORKSHEET (student fill-in view)
// ---------------------------------------------------------------------
function openWorksheet(id) {
  currentWorksheetId = id;
  const w = WORKSHEETS[id];
  db.ref(`assignments/${currentKid}/${id}/responses`).once("value").then(snap => {
    currentResponses = snap.val() || {};
    renderWorksheet(w);
  });
}

function renderWorksheet(w) {
  const app = document.getElementById("app");
  let html = `<a class="backlink" id="backBtn">\u2190 All assignments</a>`;
  html += `<h1>${w.title}</h1>`;
  if (w.subtitle) html += `<div class="assign-sub" style="margin-bottom:12px;">${w.subtitle}</div>`;
  if (w.intro) html += `<div class="card" style="font-style:italic; color:var(--ink-soft); font-family:sans-serif; font-size:14px;">${w.intro}</div>`;

  w.sections.forEach(section => {
    html += `<div class="section-label">${section.label}</div>`;
    if (section.intro) html += `<p>${section.intro}</p>`;
    if (section.passage) {
      html += `<div class="passage-box"><h3>${section.passage.title}</h3>`;
      section.passage.paragraphs.forEach(p => html += `<p>${p}</p>`);
      html += `</div>`;
    }
    (section.questions || []).forEach(q => { html += renderQuestion(q); });
  });

  app.innerHTML = html;
  document.getElementById("backBtn").onclick = renderPicker;

  attachInputHandlers();
  const statusBar = document.getElementById("statusBar");
  statusBar.style.display = "flex";
  document.getElementById("markDoneBtn").style.display = "inline-block";
  document.getElementById("markDoneBtn").onclick = markDone;
  refreshDoneLabel();
}

function renderQuestion(q) {
  if (q.type === "static") {
    return `<div class="compare-box">${q.text}</div>`;
  }
  let out = `<div class="q">`;
  if (q.prompt) out += `<div class="q-prompt">${q.prompt}</div>`;

  if (q.type === "long") {
    out += `<textarea rows="${q.rows || 3}" data-id="${q.id}">${escapeHtml(currentResponses[q.id] || "")}</textarea>`;
  } else if (q.type === "short") {
    out += `<input type="text" data-id="${q.id}" value="${escapeHtml(currentResponses[q.id] || "")}">`;
  } else if (q.type === "blanks") {
    q.fields.forEach(f => {
      out += `<div class="field-label">${f.label}</div><input type="text" data-id="${f.id}" value="${escapeHtml(currentResponses[f.id] || "")}">`;
    });
  } else if (q.type === "ordering") {
    q.items.forEach(item => {
      out += `<div class="blank-row"><input type="text" maxlength="1" data-id="${item.id}" value="${escapeHtml(currentResponses[item.id] || "")}"><label>${item.label}</label></div>`;
    });
  } else if (q.type === "compare") {
    out += `<div class="compare-box"><strong>Version A:</strong> ${q.versionA}</div>`;
    out += `<div class="compare-box"><strong>Version B:</strong> ${q.versionB}</div>`;
    out += `<textarea rows="2" data-id="${q.id}">${escapeHtml(currentResponses[q.id] || "")}</textarea>`;
  }
  out += `</div>`;
  return out;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function attachInputHandlers() {
  document.querySelectorAll("[data-id]").forEach(el => {
    el.addEventListener("input", () => {
      currentResponses[el.dataset.id] = el.value;
      scheduleSave();
    });
  });
}

function scheduleSave() {
  const statusMsg = document.getElementById("statusMsg");
  statusMsg.textContent = "Saving\u2026";
  statusMsg.className = "status-msg";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    db.ref(`assignments/${currentKid}/${currentWorksheetId}/responses`).update(currentResponses).then(() => {
      statusMsg.textContent = "All changes saved";
      statusMsg.className = "status-msg saved";
    });
  }, 800);
}

function markDone() {
  db.ref(`assignments/${currentKid}/${currentWorksheetId}/meta`).update({
    submitted: true,
    submittedAt: new Date().toISOString()
  }).then(refreshDoneLabel);
}

function refreshDoneLabel() {
  db.ref(`assignments/${currentKid}/${currentWorksheetId}/meta`).once("value").then(snap => {
    const meta = snap.val() || {};
    const btn = document.getElementById("markDoneBtn");
    if (!btn) return;
    btn.textContent = meta.submitted ? "Marked done \u2014 undo?" : "Mark as Done";
    btn.onclick = meta.submitted ? unmarkDone : markDone;
  });
}

function unmarkDone() {
  db.ref(`assignments/${currentKid}/${currentWorksheetId}/meta`).update({ submitted: false }).then(refreshDoneLabel);
}

// ---------------------------------------------------------------------
// RENDER: PARENT REVIEW (responses next to answer key)
// ---------------------------------------------------------------------
function renderReview(id) {
  const w = WORKSHEETS[id];
  db.ref(`assignments/${currentKid}/${id}/responses`).once("value").then(snap => {
    const responses = snap.val() || {};
    const app = document.getElementById("app");
    let html = `<a class="backlink" id="backBtn">\u2190 All assignments</a>`;
    html += `<h1>${w.title} \u2014 Review</h1>`;
    html += `<div class="assign-sub" style="margin-bottom:16px;">${cap(currentKid)}</div>`;

    if (w.scoringNotes) {
      html += `<div class="card" style="font-family:sans-serif; font-size:13px; color:var(--ink-soft);">${w.scoringNotes}</div>`;
    }

    w.sections.forEach(section => {
      html += `<div class="section-label">${section.label}</div>`;
      (section.questions || []).forEach(q => {
        if (q.type === "static") return;
        if (q.type === "blanks") {
          q.fields.forEach(f => html += reviewRow(f.label, responses[f.id], w.answerKey[f.id]));
        } else if (q.type === "ordering") {
          const given = q.items.map(it => `${it.label} \u2192 ${responses[it.id] || "\u2014"}`).join("<br>");
          html += reviewRowRaw(q.prompt, given, w.answerKey[q.id]);
        } else {
          html += reviewRow(q.prompt || "Response", responses[q.id], w.answerKey[q.id]);
        }
      });
    });

    app.innerHTML = html;
    document.getElementById("backBtn").onclick = renderPicker;
  });
}

function reviewRow(prompt, answer, key) {
  return reviewRowRaw(prompt, escapeHtml(answer || "(no answer yet)"), key);
}
function reviewRowRaw(prompt, answerHtml, key) {
  return `
    <div class="review-row">
      <div class="q-prompt">${prompt}</div>
      <div class="review-answer">${answerHtml}</div>
      ${key ? `<div class="review-key"><strong>Key:</strong> ${key}</div>` : ""}
    </div>
  `;
}

// ---------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------
function spawnLeaves(){
  const layer = document.createElement("div");
  layer.className = "leaves-layer";
  const emojis = ["\uD83C\uDF41", "\uD83C\uDF42", "\uD83C\uDF43"]; // 🍁 🍂 🍃
  const count = 12;
  for (let i = 0; i < count; i++){
    const leaf = document.createElement("span");
    leaf.className = "leaf";
    leaf.textContent = emojis[i % emojis.length];
    const left = Math.random() * 100;
    const size = 16 + Math.random() * 14;
    const duration = 9 + Math.random() * 7;
    const delay = Math.random() * -duration;
    leaf.style.left = left + "%";
    leaf.style.fontSize = size + "px";
    leaf.style.animationDuration = duration + "s";
    leaf.style.animationDelay = delay + "s";
    layer.appendChild(leaf);
  }
  document.body.appendChild(layer);
}

document.addEventListener("DOMContentLoaded", () => {
  spawnLeaves();
  renderPicker();
});
</script>
</body>
</html>
