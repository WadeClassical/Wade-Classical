<style>

.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.pbtn button.on{border-color:var(--teal);background:var(--tint)}

ul{margin:6px 0 6px 22px}

.nlw{width:100%;overflow-x:auto}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.am{border-collapse:collapse;margin:8px auto;font-size:18px}.am td,.am th{border:2px solid var(--line);padding:8px 12px;text-align:center;min-width:64px}.am th{background:#E3EAF0;color:var(--main-d)}.am td.hl{background:#EAF3F7;font-weight:700}

@media(max-width:560px){body{font-size:17px}.cc{width:46px}.cc .dg{font-size:24px;height:42px}.cc .nm{font-size:10px}.cc .vl{font-size:10px}.cm{width:8px;font-size:24px}input.num{width:100%}}

<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "A part of a line with two endpoints is called a:", "o": ["ray", "line segment", "line"], "c": 1, "show": "line segment", "hint": "Segments stop at both ends.", "why": "A line segment has two endpoints."}, {"t": "A part of a line that starts at one endpoint and goes on forever in one direction is a:", "o": ["ray", "line segment", "point"], "c": 0, "show": "ray", "hint": "It has one endpoint.", "why": "That is a ray."}, {"t": "A straight path that goes on forever in both directions is a:", "o": ["ray", "line", "line segment"], "c": 1, "show": "line", "hint": "It has no endpoints.", "why": "That is a line."}, {"t": "How many endpoints does a line segment have?", "a": "2", "show": "2", "hint": "Count the two ends.", "why": "A segment has 2 endpoints."}, {"t": "How many endpoints does a ray have?", "a": "1", "show": "1", "hint": "It stops at one end only.", "why": "A ray has 1 endpoint."}, {"t": "How many endpoints does a line have?", "a": "0", "show": "0", "hint": "It goes on in both directions.", "why": "A line has no endpoints."}, {"t": "Two lines that never meet and stay the same distance apart are:", "o": ["perpendicular", "intersecting at a right angle", "parallel"], "c": 2, "show": "parallel", "hint": "Think of railroad tracks.", "why": "Parallel lines never meet."}, {"t": "Two lines that meet to make a right angle are:", "o": ["perpendicular", "parallel", "rays"], "c": 0, "show": "perpendicular", "hint": "Think of the corner of a page.", "why": "Perpendicular lines meet at 90°."}, {"t": "Which is an example of parallel lines?", "o": ["The two rails of a straight train track", "The corner of a door", "The two hands of a clock at 3:00"], "c": 0, "show": "The two rails of a straight train track", "hint": "They stay the same distance apart.", "why": "The rails of a train track are parallel."}, {"t": "The hands of a clock at 3:00 are an example of:", "o": ["parallel lines", "a straight line", "perpendicular lines meeting"], "c": 2, "show": "perpendicular lines meeting", "hint": "12 to 3 is a quarter turn.", "why": "At 3:00 the hands make a right angle, so they are perpendicular."}];const SECB=[{"t": "What kind of angle measures 35°?", "o": ["acute", "right", "obtuse", "straight"], "c": 0, "show": "acute", "hint": "Acute is less than 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is 180°.", "why": "35° is an acute angle."}, {"t": "What kind of angle measures 90°?", "o": ["acute", "obtuse", "right", "straight"], "c": 2, "show": "right", "hint": "Acute is less than 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is 180°.", "why": "90° is a right angle."}, {"t": "What kind of angle measures 120°?", "o": ["obtuse", "acute", "right", "straight"], "c": 0, "show": "obtuse", "hint": "Acute is less than 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is 180°.", "why": "120° is an obtuse angle."}, {"t": "What kind of angle measures 180°?", "o": ["acute", "straight", "right", "obtuse"], "c": 1, "show": "straight", "hint": "Acute is less than 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is 180°.", "why": "180° is a straight angle."}, {"t": "What kind of angle measures 75°?", "o": ["acute", "right", "obtuse", "straight"], "c": 0, "show": "acute", "hint": "Acute is less than 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is 180°.", "why": "75° is an acute angle."}, {"t": "What kind of angle measures 150°?", "o": ["obtuse", "acute", "right", "straight"], "c": 0, "show": "obtuse", "hint": "Acute is less than 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is 180°.", "why": "150° is an obtuse angle."}, {"t": "A quarter turn is how many degrees?", "a": "90", "show": "90", "hint": "A full turn is 360°. Divide by 4.", "why": "360 ÷ 4 = 90°."}, {"t": "A half turn is how many degrees?", "a": "180", "show": "180", "hint": "360 ÷ 2.", "why": "180°."}, {"t": "A three-quarter turn is how many degrees?", "a": "270", "show": "270", "hint": "3 × 90.", "why": "3 × 90 = 270°."}, {"t": "A full turn is how many degrees?", "a": "360", "show": "360", "hint": "All the way around.", "why": "360°."}];const SECC=[{"t": "How many right angles make a straight angle?", "a": "2", "show": "2", "hint": "2 × 90 = 180.", "why": "Two right angles make 180°."}, {"t": "How many right angles make a full turn?", "a": "4", "show": "4", "hint": "4 × 90 = 360.", "why": "Four right angles make 360°."}, {"t": "The minute hand moves from 12 to 3. How many degrees did it turn?", "a": "90", "show": "90", "hint": "12 to 3 is a quarter of the clock.", "why": "A quarter turn is 90°."}, {"t": "The minute hand moves from 12 to 9. How many degrees did it turn clockwise?", "a": "270", "show": "270", "hint": "12 to 9 is three quarters of the clock.", "why": "3 quarter turns = 270°."}, {"t": "An angle is bigger than 90° but smaller than 180°. It is:", "o": ["acute", "obtuse", "right"], "c": 1, "show": "obtuse", "hint": "Between right and straight.", "why": "That is an obtuse angle."}, {"t": "A student says an angle of 89° is a right angle. What is true?", "o": ["He is right", "It is acute because it is less than 90°", "It is obtuse"], "c": 1, "show": "It is acute because it is less than 90°", "hint": "A right angle is exactly 90°.", "why": "89° is less than 90°, so it is acute."}, {"t": "What fraction of a full turn is a 90° turn?", "o": ["1/4", "1/2", "3/4"], "c": 0, "show": "1/4", "hint": "90/360.", "why": "90/360 = 1/4."}, {"t": "Which pair is always perpendicular?", "o": ["Two lines that make a 90° angle", "Two lines that never meet", "Two rays with the same endpoint"], "c": 0, "show": "Two lines that make a 90° angle", "hint": "Perpendicular means 90°.", "why": "Perpendicular lines meet at a right angle (90°)."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function geoTool(){
  const k=$('gk').value;const W=380,H=130;let s='<svg viewBox="0 0 '+W+' '+H+'" class="sv" style="max-width:420px;background:#fff;border:2px solid var(--line);border-radius:10px">';
  const dot=(x,y,l)=>'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#17607A"/><text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-size="14" fill="#2B3A44">'+l+'</text>';
  const arrow=(x,y,dir)=>'<polygon points="'+x+','+y+' '+(x-dir*12)+','+(y-6)+' '+(x-dir*12)+','+(y+6)+'" fill="#17607A"/>';
  let note='';
  if(k==='point'){s+=dot(190,70,'A');note='A <b>point</b> is an exact location. It has no size.';}
  if(k==='segment'){s+='<line x1="80" y1="70" x2="300" y2="70" stroke="#17607A" stroke-width="4"/>'+dot(80,70,'A')+dot(300,70,'B');note='A <b>line segment</b> has two endpoints. Name it segment AB.';}
  if(k==='ray'){s+='<line x1="80" y1="70" x2="340" y2="70" stroke="#17607A" stroke-width="4"/>'+dot(80,70,'A')+arrow(350,70,1);note='A <b>ray</b> has one endpoint and goes on forever one way. Name it ray AB, starting at A.';}
  if(k==='line'){s+='<line x1="20" y1="70" x2="350" y2="70" stroke="#17607A" stroke-width="4"/>'+arrow(362,70,1)+arrow(8,70,-1)+dot(130,70,'A')+dot(250,70,'B');note='A <b>line</b> goes on forever both ways. Name it line AB.';}
  if(k==='parallel'){s+='<line x1="30" y1="45" x2="350" y2="45" stroke="#17607A" stroke-width="4"/><line x1="30" y1="95" x2="350" y2="95" stroke="#17607A" stroke-width="4"/>';note='<b>Parallel lines</b> never meet. They stay the same distance apart.';}
  if(k==='perp'){s+='<line x1="40" y1="100" x2="340" y2="100" stroke="#17607A" stroke-width="4"/><line x1="190" y1="15" x2="190" y2="115" stroke="#17607A" stroke-width="4"/><rect x="190" y="84" width="16" height="16" fill="none" stroke="#C9972B" stroke-width="3"/>';note='<b>Perpendicular lines</b> meet to make a right angle, 90°. The little square shows the right angle.';}
  $('gr').innerHTML=s+'</svg><div class="out2">'+note+'</div>';
}
function angTool(){
  const d=gv('ad',0,360);const W=380,H=170,cx=110,cy=135,R=95;const r=d*Math.PI/180;
  const ex=cx+R*Math.cos(-r),ey=cy+R*Math.sin(-r);
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="sv" style="max-width:420px;background:#fff;border:2px solid var(--line);border-radius:10px"><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke="#17607A" stroke-width="4"/><line x1="'+cx+'" y1="'+cy+'" x2="'+ex+'" y2="'+ey+'" stroke="#17607A" stroke-width="4"/>';
  const ar=36;const ax=cx+ar*Math.cos(-r),ay=cy+ar*Math.sin(-r);
  if(d>0&&d<360)s+='<path d="M '+(cx+ar)+' '+cy+' A '+ar+' '+ar+' 0 '+(d>180?1:0)+' 0 '+ax+' '+ay+'" fill="none" stroke="#C9972B" stroke-width="3"/>';
  if(d===90)s+='<rect x="'+cx+'" y="'+(cy-18)+'" width="18" height="18" fill="none" stroke="#C9972B" stroke-width="2"/>';
  s+='<text x="'+(cx+110)+'" y="40" font-size="26" font-weight="700" fill="#17607A">'+d+'°</text></svg>';
  const k=d===0?'zero':d<90?'acute':d===90?'right':d<180?'obtuse':d===180?'straight':d<360?'reflex (more than a half turn)':'a full turn';
  const g=gcdf(d,360);
  $('ar').innerHTML=s+'<div class="out2"><b>'+d+'°</b> is '+(d===360||d===0?k:(k.startsWith('a')||k.startsWith('o')?'an ':'a ')+k+' angle')+'.<br>As a part of a full turn: '+(d?d/g+'/'+360/g:'0')+'.<br>Acute: less than 90°. Right: 90°. Obtuse: between 90° and 180°. Straight: 180°.</div>';
}
function rA(){secPage('a','<div class="card"><h1>Points, lines and rays</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">A <b>point</b> is a location. A <b>line segment</b> has two endpoints. A <b>ray</b> has one endpoint. A <b>line</b> has none. <b>Parallel</b> lines never meet. <b>Perpendicular</b> lines meet at a right angle.</div>'
 +'<h3>Show me</h3><div class="row"><select id="gk" onchange="geoTool()" style="font:600 18px Jost,sans-serif;padding:6px"><option value="point">point</option><option value="segment" selected>line segment</option><option value="ray">ray</option><option value="line">line</option><option value="parallel">parallel lines</option><option value="perp">perpendicular lines</option></select></div><div id="gr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Kinds of angles</h2><div class="rule"><b>Acute</b>: less than 90°. <b>Right</b>: exactly 90°. <b>Obtuse</b>: more than 90° and less than 180°. <b>Straight</b>: 180°. A full turn is 360°, so a quarter turn is 90°, a half turn is 180° and a three-quarter turn is 270°.</div>'
 +'<h3>Open the angle</h3><div class="row"><span>degrees</span><input class="num" id="ad" value="60" oninput="angTool()" inputmode="numeric"></div><div id="ar"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Putting it together</h2><div class="rule">A clock face is a full turn of 360°, so each 5-minute jump of the minute hand is 30°, and 15 minutes is a quarter turn of 90°.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
