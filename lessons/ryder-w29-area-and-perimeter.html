<div class="wrap">

<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "A rectangle is 8 cm long and 5 cm wide. What is its area in square cm?", "a": "40", "show": "40", "hint": "Area = length × width.", "why": "8 × 5 = 40 square cm."}, {"t": "A rectangle is 12 m long and 7 m wide. What is its area in square m?", "a": "84", "show": "84", "hint": "Area = length × width.", "why": "12 × 7 = 84 square m."}, {"t": "A rectangle is 8 cm long and 5 cm wide. What is its perimeter in cm?", "a": "26", "show": "26", "hint": "Perimeter = 2 × (length + width).", "why": "2 × (8 + 5) = 2 × 13 = 26 cm."}, {"t": "A rectangle is 12 m long and 7 m wide. What is its perimeter in m?", "a": "38", "show": "38", "hint": "Perimeter = 2 × (length + width).", "why": "2 × (12 + 7) = 2 × 19 = 38 m."}, {"t": "A square has sides of 9 cm. What is its area in square cm?", "a": "81", "show": "81", "hint": "Area = side × side.", "why": "9 × 9 = 81 square cm."}, {"t": "A square has sides of 9 cm. What is its perimeter in cm?", "a": "36", "show": "36", "hint": "Perimeter = 4 × side.", "why": "4 × 9 = 36 cm."}, {"t": "A rectangle has an area of 72 square meters and a length of 9 m. What is its width in meters?", "a": "8", "show": "8", "hint": "Width = area ÷ length.", "why": "72 ÷ 9 = 8 m."}, {"t": "A rectangle has an area of 54 square cm and a width of 6 cm. What is its length in cm?", "a": "9", "show": "9", "hint": "Length = area ÷ width.", "why": "54 ÷ 6 = 9 cm."}, {"t": "A rectangle has a perimeter of 30 cm and a length of 9 cm. What is its width in cm?", "a": "6", "show": "6", "hint": "Half the perimeter is length + width.", "why": "30 ÷ 2 = 15, and 15 − 9 = 6 cm."}, {"t": "A square has a perimeter of 28 m. What is the length of one side in meters?", "a": "7", "show": "7", "hint": "Side = perimeter ÷ 4.", "why": "28 ÷ 4 = 7 m."}];const SECB=[{"t": "A garden is 14 m long and 6 m wide. How many square meters is it?", "a": "84", "show": "84", "hint": "Area.", "why": "14 × 6 = 84 square m."}, {"t": "How many meters of fence go all the way around the same 14 m by 6 m garden?", "a": "40", "show": "40", "hint": "Perimeter.", "why": "2 × (14 + 6) = 40 m."}, {"t": "A room is 5 m by 4 m. Carpet costs $3 per square meter. How much does the carpet cost? (number only)", "a": "60", "show": "60", "hint": "Find the area first.", "why": "5 × 4 = 20 square m, and 20 × 3 = $60."}, {"t": "A rectangular field is 20 m by 15 m. How much does 1 meter of fence cost if the whole fence costs $350 and goes all around? (give dollars per meter)", "a": "5", "show": "5", "hint": "Find the perimeter first.", "why": "Perimeter is 2 × (20 + 15) = 70 m, and 350 ÷ 70 = $5 per meter."}, {"t": "A square poster has a perimeter of 24 cm. What is its area in square cm?", "a": "36", "show": "36", "hint": "Side = 24 ÷ 4.", "why": "Side = 6 cm, and 6 × 6 = 36 square cm."}, {"t": "Which unit is used for area?", "o": ["centimeters", "square centimeters", "cubic centimeters"], "c": 1, "show": "square centimeters", "hint": "Area covers a surface.", "why": "Area is measured in square units."}, {"t": "Which unit is used for perimeter?", "o": ["centimeters", "square centimeters", "cubic centimeters"], "c": 0, "show": "centimeters", "hint": "Perimeter is a distance around.", "why": "Perimeter is a length, so centimeters."}, {"t": "To find how much carpet covers a floor, you find the:", "o": ["perimeter", "area", "volume"], "c": 1, "show": "area", "hint": "Carpet covers the surface.", "why": "You find the area."}];const SECC=[{"t": "Rectangle A is 12 by 2 and rectangle B is 8 by 3. What is the area of rectangle B in square units?", "a": "24", "show": "24", "hint": "8 × 3.", "why": "8 × 3 = 24 square units. Rectangle A (12 × 2) is also 24."}, {"t": "What is the perimeter of the 12 by 2 rectangle?", "a": "28", "show": "28", "hint": "2 × (12 + 2).", "why": "2 × 14 = 28."}, {"t": "What is the perimeter of the 8 by 3 rectangle?", "a": "22", "show": "22", "hint": "2 × (8 + 3).", "why": "2 × 11 = 22."}, {"t": "Rectangles with the same area:", "o": ["always have the same perimeter", "must be squares", "can have different perimeters"], "c": 2, "show": "can have different perimeters", "hint": "Compare 12 by 2 and 8 by 3.", "why": "Both have area 24, but their perimeters are 28 and 22."}, {"t": "Two rectangles have the same perimeter. Their areas:", "o": ["can be different", "must be equal", "must be 0"], "c": 0, "show": "can be different", "hint": "Try 1 by 9 and 5 by 5, both with perimeter 20.", "why": "1 × 9 = 9 and 5 × 5 = 25, so the areas can be different."}, {"t": "A rectangle with perimeter 20 has sides 1 and 9. What is its area?", "a": "9", "show": "9", "hint": "1 × 9.", "why": "1 × 9 = 9 square units."}, {"t": "A square with perimeter 20 has sides 5. What is its area?", "a": "25", "show": "25", "hint": "5 × 5.", "why": "5 × 5 = 25 square units."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function rectTool(){
  const l=gv('rl',1,40),w=gv('rw',1,40),sc=Math.min(300/l,110/w,22);const W=l*sc,H=w*sc;
  $('rr').innerHTML='<svg viewBox="0 0 340 '+(H+40)+'" class="sv" style="max-width:380px"><rect x="20" y="14" width="'+W+'" height="'+H+'" fill="#D6ECF3" stroke="#17607A" stroke-width="3"/><text x="'+(20+W/2)+'" y="'+(H+34)+'" text-anchor="middle" font-size="14" fill="#2B3A44">length '+l+'</text><text x="'+(26+W)+'" y="'+(14+H/2)+'" font-size="14" fill="#2B3A44">'+w+'</text></svg><div class="out2">Area = '+l+' × '+w+' = <b>'+(l*w)+'</b> square units<br>Perimeter = 2 × ('+l+' + '+w+') = <b>'+(2*(l+w))+'</b> units'+(l===w?'<br>It is a square, so perimeter = 4 × '+l+' = '+4*l+'.':'')+'</div>';
}
function samTool(){
  const a=gv('sa',1,200);let rows=[];for(let l=1;l<=a;l++){if(a%l===0&&l<=a/l)rows.push('<tr><td>'+l+' × '+a/l+'</td><td>'+2*(l+a/l)+'</td></tr>');}
  $('sm').innerHTML='<div class="out2">All the whole-number rectangles with area <b>'+a+'</b>:</div><table class="am"><tr><th>Size</th><th>Perimeter</th></tr>'+rows.join('')+'</table><div class="out2">Same area, different perimeters. The shape closest to a square has the smallest perimeter.</div>';
}
function rA(){secPage('a','<div class="card"><h1>Area and perimeter</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule"><b>Area</b> covers the inside: <b>A = l × w</b>, in square units. <b>Perimeter</b> goes around the edge: <b>P = 2 × (l + w)</b>, in units. For a square with side s: A = s × s and P = 4 × s. A missing side: divide the area by the known side.</div>'
 +'<h3>Try it</h3><div class="row"><span>length</span><input class="num" id="rl" value="8" oninput="rectTool()" inputmode="numeric"><span>width</span><input class="num" id="rw" value="5" oninput="rectTool()" inputmode="numeric"></div><div id="rr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Which one do I need?</h2><div class="rule">Covering a floor, painting a wall or planting a garden: <b>area</b>. Fencing, framing or walking around: <b>perimeter</b>.</div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Same area or same perimeter</h2><div class="rule">Rectangles with the <b>same area</b> can have different perimeters, and rectangles with the <b>same perimeter</b> can have different areas.</div>'
 +'<h3>Try it</h3><div class="row"><span>area</span><input class="num" id="sa" value="24" oninput="samTool()" inputmode="numeric"></div><div id="sm"></div></div>',SECC,true);}

}
