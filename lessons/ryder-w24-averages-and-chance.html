<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "What is the mode of these numbers?  4, 7, 4, 9, 4, 2", "a": "4", "show": "4", "hint": "The mode is the number that appears most often.", "why": "4 appears most often."}, {"t": "What is the mode of these numbers?  12, 15, 12, 18, 15, 12, 10", "a": "12", "show": "12", "hint": "The mode is the number that appears most often.", "why": "12 appears most often."}, {"t": "What is the mode of these numbers?  5, 8, 8, 3, 5, 8, 1", "a": "8", "show": "8", "hint": "The mode is the number that appears most often.", "why": "8 appears most often."}, {"t": "What is the median of these numbers?  3, 9, 5, 7, 1", "a": "5", "show": "5", "hint": "Put the numbers in order first. The median is in the middle.", "why": "Sorted: 1, 3, 5, 7, 9. The middle number is 5."}, {"t": "What is the median of these numbers?  14, 8, 10, 6, 12", "a": "10", "show": "10", "hint": "Put the numbers in order first. The median is in the middle.", "why": "Sorted: 6, 8, 10, 12, 14. The middle number is 10."}, {"t": "What is the median of these numbers?  2, 4, 6, 8", "a": "5", "show": "5", "hint": "Put the numbers in order first. The median is in the middle.", "why": "Sorted: 2, 4, 6, 8. The two middle numbers are 4 and 6. Their halfway point is 5."}, {"t": "What is the median of these numbers?  10, 12, 15, 19", "a": "13.5", "show": "13.5", "hint": "Put the numbers in order first. The median is in the middle.", "why": "Sorted: 10, 12, 15, 19. The two middle numbers are 12 and 15. Their halfway point is 13.5."}, {"t": "What is the median of these numbers?  21, 18, 30, 24, 27, 33", "a": "25.5", "show": "25.5", "hint": "Put the numbers in order first. The median is in the middle.", "why": "Sorted: 18, 21, 24, 27, 30, 33. The two middle numbers are 24 and 27. Their halfway point is 25.5."}, {"t": "Which number is an outlier?  5, 6, 6, 7, 48", "a": "48", "show": "48", "hint": "Look for the number that is far away from all the others.", "why": "48 is far from the rest, which are all close together."}, {"t": "Which number is an outlier?  22, 25, 24, 3, 23", "a": "3", "show": "3", "hint": "Look for the number that is far away from all the others.", "why": "3 is far from the rest, which are all close together."}, {"t": "A tally of pets: dog 7, cat 5, fish 3, bird 2. What is the mode of the categories?", "o": ["cat", "dog", "fish"], "c": 1, "show": "dog", "hint": "Which category has the most?", "why": "Dog has the most (7), so it is the mode."}];const SECB=[{"t": "A spinner has 4 equal sections: red, red, blue, green. What is the chance of red as a fraction in simplest form?", "a": "1/2", "show": "1/2", "hint": "2 red out of 4 sections.", "why": "2 out of 4 = 2/4 = 1/2."}, {"t": "A bag has 3 red marbles and 5 blue marbles. What is the chance of picking blue? (fraction)", "a": "5/8", "show": "5/8", "hint": "How many blue out of how many in all?", "why": "5 out of 8 is 5/8."}, {"t": "A number cube has the numbers 1 to 6. What is the chance of rolling an even number? (simplest form)", "a": "1/2", "show": "1/2", "hint": "Even numbers: 2, 4, 6.", "why": "3 out of 6 = 3/6 = 1/2."}, {"t": "A number cube has the numbers 1 to 6. What is the chance of rolling a number greater than 4? (simplest form)", "a": "1/3", "show": "1/3", "hint": "The numbers are 5 and 6.", "why": "2 out of 6 = 2/6 = 1/3."}, {"t": "You flip a coin twice. How many possible outcomes are there? (HH, HT, TH, TT)", "a": "4", "show": "4", "hint": "List them all.", "why": "HH, HT, TH, TT. There are 4."}, {"t": "You flip a coin twice. What is the chance of getting two heads? (fraction)", "a": "1/4", "show": "1/4", "hint": "1 outcome out of 4.", "why": "Only HH is two heads, so 1 out of 4 = 1/4."}, {"t": "You flip a coin twice. What is the chance of getting one head and one tail? (simplest form)", "a": "1/2", "show": "1/2", "hint": "HT and TH both count.", "why": "2 out of 4 = 1/2."}, {"t": "A bag has only red marbles. What is the chance of picking a red marble?", "o": ["Certain: 1 out of 1", "Impossible: 0", "Unlikely"], "c": 0, "show": "Certain: 1 out of 1", "hint": "Every marble is red.", "why": "Every pick is red, so it is certain."}, {"t": "Which is the most likely?", "o": ["Picking red from a bag with 1 red and 7 blue", "Picking red from a bag with 7 red and 1 blue", "Picking red from a bag with 4 red and 4 blue"], "c": 1, "show": "Picking red from a bag with 7 red and 1 blue", "hint": "Compare the fractions of red marbles.", "why": "7/8 is greater than 4/8 and 1/8."}, {"t": "Say the chance of 3 out of 4 in words:", "o": ["4 out of 3, or 4/3", "3 out of 7", "3 out of 4, or 3/4"], "c": 2, "show": "3 out of 4, or 3/4", "hint": "Outcomes you want over all outcomes.", "why": "The chance is the number you want out of the total: 3/4."}];const SECC=[{"t": "The test scores are 80, 85, 90, 95, 100. What is the median?", "a": "90", "show": "90", "hint": "The middle of 5 numbers.", "why": "The middle score is 90."}, {"t": "The heights are 54, 55, 55, 56, 90 inches. Which is the outlier?", "o": ["90", "54", "55"], "c": 0, "show": "90", "hint": "One is far from the rest.", "why": "90 is far from the rest."}, {"t": "The numbers are 6, 6, 7, 8, 8, 8, 9. What is the mode?", "a": "8", "show": "8", "hint": "Which number appears the most?", "why": "8 appears three times."}, {"t": "The numbers are 20, 21, 22, 25, 90. What is the median?", "a": "22", "show": "22", "hint": "It is already in order.", "why": "The middle number is 22."}, {"t": "A spinner has 8 equal sections. 3 are blue. What is the chance of blue? (fraction)", "a": "3/8", "show": "3/8", "hint": "3 out of 8.", "why": "3/8."}, {"t": "A student says the mode of 4, 6, 6, 8, 8 is 7. What went wrong?", "o": ["There are two modes: 6 and 8", "He is right", "The mode is 4"], "c": 0, "show": "There are two modes: 6 and 8", "hint": "The mode is the most common number, not the middle.", "why": "6 and 8 each appear twice, so the data has two modes."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function statTool(){
  const v=$('sd').value.split(/[ ,]+/).filter(x=>x!=='').map(Number);
  if(!v.length||v.some(isNaN)){$('sr').innerHTML='<div class="out2">Type numbers separated by commas.</div>';return;}
  const s=v.slice().sort((a,b)=>a-b),n=s.length,med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
  const c={};v.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c));const modes=Object.keys(c).filter(k=>c[k]===mx);
  const q1=s[Math.floor((n-1)/4)],q3=s[Math.ceil(3*(n-1)/4)];
  const out=s.filter(x=>x>s[n-1-0]*0+0&&false);
  const gap=[];for(let i=1;i<n;i++)gap.push(s[i]-s[i-1]);const rng=s[n-1]-s[0];
  let o='';if(n>=4&&gap[n-2]>2*(rng-gap[n-2])&&gap[n-2]>0)o=s[n-1];else if(n>=4&&gap[0]>2*(rng-gap[0])&&gap[0]>0)o=s[0];
  $('sr').innerHTML='<div class="out2">In order: <b>'+s.join(', ')+'</b><br>Mode: <b>'+(mx===1?'none (every number appears once)':modes.join(' and '))+'</b><br>Median: <b>'+med+'</b>'+(n%2===0?' (halfway between '+s[n/2-1]+' and '+s[n/2]+')':'')+'<br>Possible outlier: <b>'+(o===''?'none':o)+'</b></div>';
}
function chTool(){
  const r=gv('cr1',0,20),b=gv('cb1',0,20),g=gv('cg1',0,20),t=r+b+g;
  if(!t){$('cr2').innerHTML='<div class="out2">Put at least one marble in the bag.</div>';return;}
  const f=(n)=>{const d=gcdf(n,t);return n===0?'0 (impossible)':n===t?'1 (certain)':n+'/'+t+(d>1?' = '+n/d+'/'+t/d:'');};
  $('cr2').innerHTML='<div class="out2">'+t+' marbles in the bag.<br>Chance of red: <b>'+f(r)+'</b><br>Chance of blue: <b>'+f(b)+'</b><br>Chance of green: <b>'+f(g)+'</b></div>';
}

 +'<h3>Try it</h3><input id="sd" value="3, 5, 5, 7, 9, 5, 40" oninput="statTool()" style="width:100%;font:600 17px Jost,sans-serif;padding:8px;border:2px solid var(--line);border-radius:9px"><div id="sr"></div></div>',SECA);}
