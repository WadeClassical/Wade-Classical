<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "3/8 + 2/8 = ?  (simplest form)", "a": "5/8", "show": "5/8", "hint": "Add the numerators and keep the denominator. Then simplify.", "why": "3 + 2 = 5, so the sum is 5/8."}, {"t": "1/9 + 4/9 = ?  (simplest form)", "a": "5/9", "show": "5/9", "hint": "Add the numerators and keep the denominator. Then simplify.", "why": "1 + 4 = 5, so the sum is 5/9."}, {"t": "2/10 + 5/10 = ?  (simplest form)", "a": "7/10", "show": "7/10", "hint": "Add the numerators and keep the denominator. Then simplify.", "why": "2 + 5 = 7, so the sum is 7/10."}, {"t": "3/12 + 3/12 = ?  (simplest form)", "a": "1/2", "show": "1/2", "hint": "Add the numerators and keep the denominator. Then simplify.", "why": "3 + 3 = 6, so the sum is 6/12 = 1/2."}, {"t": "4/6 + 5/6 = ?  Write the answer as a mixed number.", "a": "1 1/2", "show": "1 1/2", "hint": "Add the numerators, then see how many wholes you can make.", "why": "4 + 5 = 9, so 9/6 = 3/2 = 1 1/2."}, {"t": "5/8 + 7/8 = ?  Write the answer as a mixed number.", "a": "1 1/2", "show": "1 1/2", "hint": "Add the numerators, then see how many wholes you can make.", "why": "5 + 7 = 12, so 12/8 = 3/2 = 1 1/2."}, {"t": "7/9 − 2/9 = ?  (simplest form)", "a": "5/9", "show": "5/9", "hint": "Subtract the numerators and keep the denominator. Then simplify.", "why": "7 − 2 = 5, so the difference is 5/9."}, {"t": "5/8 − 3/8 = ?  (simplest form)", "a": "1/4", "show": "1/4", "hint": "Subtract the numerators and keep the denominator. Then simplify.", "why": "5 − 3 = 2, so the difference is 2/8 = 1/4."}, {"t": "9/10 − 4/10 = ?  (simplest form)", "a": "1/2", "show": "1/2", "hint": "Subtract the numerators and keep the denominator. Then simplify.", "why": "9 − 4 = 5, so the difference is 5/10 = 1/2."}, {"t": "1 − 3/8 = ?  (simplest form)", "a": "5/8", "show": "5/8", "hint": "Write 1 as 8/8.", "why": "1 = 8/8, and 8/8 − 3/8 = 5/8."}];const SECB=[{"t": "11/12 − 5/12 = ?  (simplest form)", "a": "1/2", "show": "1/2", "hint": "Subtract the numerators and keep the denominator. Then simplify.", "why": "11 − 5 = 6, so the difference is 6/12 = 1/2."}, {"t": "7/6 − 1/6 = ?  (simplest form)", "a": "1", "show": "1", "hint": "Subtract the numerators and keep the denominator. Then simplify.", "why": "7 − 1 = 6, so the difference is 6/6 = 1."}, {"t": "7/10 + 8/10 = ?  Write the answer as a mixed number.", "a": "1 1/2", "show": "1 1/2", "hint": "Add the numerators, then see how many wholes you can make.", "why": "7 + 8 = 15, so 15/10 = 3/2 = 1 1/2."}, {"t": "1 − 2/5 = ?  (simplest form)", "a": "3/5", "show": "3/5", "hint": "Write 1 as 5/5.", "why": "1 = 5/5, and 5/5 − 2/5 = 3/5."}, {"t": "1 − 5/12 = ?  (simplest form)", "a": "7/12", "show": "7/12", "hint": "Write 1 as 12/12.", "why": "1 = 12/12, and 12/12 − 5/12 = 7/12."}, {"t": "Ava ate 2/8 of a pizza and Ben ate 3/8 of the same pizza. What fraction of the pizza did they eat in all?", "a": "5/8", "show": "5/8", "hint": "Add the fractions of the same whole.", "why": "2/8 + 3/8 = 5/8."}, {"t": "A ribbon is 7/8 yard long. Ruth cuts off 3/8 yard. What fraction of a yard is left? (simplest form)", "a": "1/2", "show": "1/2", "hint": "Subtract, then simplify.", "why": "7/8 − 3/8 = 4/8 = 1/2."}, {"t": "Sam drank 3/10 of a jug in the morning and 4/10 in the afternoon. What fraction of the jug did he drink? (simplest form)", "a": "7/10", "show": "7/10", "hint": "Add the numerators.", "why": "3/10 + 4/10 = 7/10."}, {"t": "A pie has 9/12 left. The family eats 5/12 of the whole pie. What fraction of the pie is left? (simplest form)", "a": "1/3", "show": "1/3", "hint": "Subtract, then simplify.", "why": "9/12 − 5/12 = 4/12 = 1/3."}, {"t": "When you add fractions with the same denominator, what happens to the denominator?", "o": ["You add the denominators", "It stays the same", "You multiply the denominators"], "c": 1, "show": "It stays the same", "hint": "The pieces stay the same size.", "why": "The pieces are the same size, so you only count how many pieces there are."}];const SECC=[{"t": "Ana says 1/4 + 1/4 = 2/8. Is she right?", "o": ["No. It is 2/4 = 1/2", "Yes", "No. It is 1/2 = 2/8"], "c": 0, "show": "No. It is 2/4 = 1/2", "hint": "Do the pieces change size when you add?", "why": "The pieces are still fourths. 1/4 + 1/4 = 2/4 = 1/2."}, {"t": "5/8 + 6/8 = ?  Write the answer as a mixed number.", "a": "1 3/8", "show": "1 3/8", "hint": "Add the numerators, then see how many wholes you can make.", "why": "5 + 6 = 11, so 11/8 = 1 3/8."}, {"t": "9/12 + 6/12 = ?  Write the answer as a mixed number.", "a": "1 1/4", "show": "1 1/4", "hint": "Add the numerators, then see how many wholes you can make.", "why": "9 + 6 = 15, so 15/12 = 5/4 = 1 1/4."}, {"t": "13/15 − 3/15 = ?  (simplest form)", "a": "2/3", "show": "2/3", "hint": "Subtract the numerators and keep the denominator. Then simplify.", "why": "13 − 3 = 10, so the difference is 10/15 = 2/3."}, {"t": "3/5 + ?/5 = 1.  What is the missing numerator?", "a": "2", "show": "2", "hint": "1 = 5/5.", "why": "3/5 + 2/5 = 5/5 = 1."}, {"t": "?/9 − 2/9 = 4/9.  What is the missing numerator?", "a": "6", "show": "6", "hint": "Add 4 and 2.", "why": "6/9 − 2/9 = 4/9."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function opTool(){
  const d=gv('od',2,16),a=gv('oa',0,3*d),b=gv('ob',0,3*d),sg=$('op').value;
  let r=sg==='+'?a+b:a-b;
  if(r<0){$('or').innerHTML='<div class="out2">The answer would be less than 0. Try a first fraction that is at least as big as the second.</div>';return;}
  $('or').innerHTML=fbar(Math.min(a,d),d,'#8FC4D6')+'<div class="small">'+a+'/'+d+(a>d?' (more than 1)':'')+'</div>'+fbar(Math.min(b,d),d,'#A9B7C0')+'<div class="small">'+b+'/'+d+(b>d?' (more than 1)':'')+'</div>'
   +'<div class="out2"><b>'+a+'/'+d+' '+sg+' '+b+'/'+d+' = '+r+'/'+d+'</b> (keep the denominator '+d+')<br>Simplest form: <b>'+fstr(r,d)+'</b>'+(r>d?'<br>As a mixed number: <b>'+mstr(r,d)+'</b>':'')+'</div>';
}
function rA(){secPage('a','<div class="card"><h1>Adding and subtracting fractions</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">When the denominators are the same, the pieces are the same size. <b>Add or subtract the numerators and keep the denominator.</b> Then simplify. Write answers in simplest form, and write answers greater than 1 as mixed numbers when asked.</div>'
 +'<h3>Try it</h3><div class="row"><input class="num" id="oa" value="5" oninput="opTool()" inputmode="numeric"><select id="op" onchange="opTool()" style="font:600 18px Jost,sans-serif;padding:6px"><option>+</option><option>−</option></select><input class="num" id="ob" value="2" oninput="opTool()" inputmode="numeric"><span>over</span><input class="num" id="od" value="8" oninput="opTool()" inputmode="numeric"></div><div id="or"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Same whole, word problems</h2><div class="rule">In a word problem, check that every fraction is a part of the <b>same whole</b>. Then add if parts are joined and subtract if parts are taken away. Remember that 1 whole can be written as 8/8 or 12/12 or any fraction with the same top and bottom.</div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Putting it together</h2><div class="rule">Keep the denominator, work with the numerators, then simplify.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];

function gv(id,lo,hi){let v=parseInt(norm($(id).value),10);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v));}
