<style>

*{box-sizing:border-box;margin:0;padding:0}

.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.pbtn button.on{border-color:var(--teal);background:var(--tint)}

ul{margin:6px 0 6px 22px}

.eq{text-align:center;font:700 24px Jost,sans-serif;color:var(--teal-d);margin:6px 0;min-height:34px}
.nlw{width:100%;overflow-x:auto}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.am{border-collapse:collapse;margin:8px auto;font-size:18px}.am td,.am th{border:2px solid var(--line);padding:8px 12px;text-align:center;min-width:64px}.am th{background:#E3EAF0;color:var(--main-d)}.am td.hl{background:#EAF3F7;font-weight:700}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:4px 0}

.sv{display:block;margin:8px auto;max-width:100%}

@media(max-width:560px){body{font-size:17px}.cc{width:46px}.cc .dg{font-size:24px;height:42px}.cc .nm{font-size:10px}.cc .vl{font-size:10px}.cm{width:8px;font-size:24px}input.num{width:100%}}

<body>
<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Building Fractions</div><a class="back" id="modeLink" href="#">Mom view</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "How many 1/8 pieces make 5/8?", "a": "5", "show": "5", "hint": "5/8 = 1/8 + 1/8 + …", "why": "5/8 is 5 pieces that are each 1/8."}, {"t": "3/8 = 1/8 + 1/8 + ?  What is the last unit fraction?", "a": "1/8", "show": "1/8", "hint": "Three pieces of 1/8 make 3/8.", "why": "3/8 = 1/8 + 1/8 + 1/8."}, {"t": "5/6 = 2/6 + ?/6. What is the missing numerator?", "a": "3", "show": "3", "hint": "2 + ? = 5.", "why": "2/6 + 3/6 = 5/6."}, {"t": "7/10 = 3/10 + 2/10 + ?/10. What is the missing numerator?", "a": "2", "show": "2", "hint": "3 + 2 + ? = 7.", "why": "3 + 2 + 2 = 7, so 7/10 = 3/10 + 2/10 + 2/10."}, {"t": "4/5 = 1/5 + ?/5. What is the missing numerator?", "a": "3", "show": "3", "hint": "1 + ? = 4.", "why": "1/5 + 3/5 = 4/5."}, {"t": "Which is NOT a way to write 4/5?", "o": ["2/5 + 2/5", "1/5 + 4/5", "1/5 + 1/5 + 2/5"], "c": 1, "show": "1/5 + 4/5", "hint": "Add the numerators and keep the denominator 5.", "why": "1/5 + 4/5 = 5/5 = 1, not 4/5. The others add to 4/5."}, {"t": "Which is a way to write 5/8?", "o": ["3/8 + 2/8", "4/8 + 2/8", "1/8 + 3/8"], "c": 0, "show": "3/8 + 2/8", "hint": "Add the numerators.", "why": "3 + 2 = 5, so 3/8 + 2/8 = 5/8."}, {"t": "Which fraction is the sum 1/6 + 1/6 + 1/6 + 1/6?", "o": ["4/24", "4/6 (which is 2/3)", "1/24"], "c": 1, "show": "4/6 (which is 2/3)", "hint": "You are adding four pieces that are each one sixth.", "why": "Four 1/6 pieces make 4/6, which simplifies to 2/3."}];const SECB=[{"t": "3 pies are shared equally among 4 people. What fraction of a pie does each person get?", "a": "3/4", "show": "3/4", "hint": "3 ÷ 4 can be written as 3/4.", "why": "3 ÷ 4 = 3/4."}, {"t": "4 pies are shared equally among 5 people. What fraction of a pie does each person get?", "a": "4/5", "show": "4/5", "hint": "4 ÷ 5 can be written as 4/5.", "why": "4 ÷ 5 = 4/5."}, {"t": "5 pies are shared equally among 8 people. What fraction of a pie does each person get?", "a": "5/8", "show": "5/8", "hint": "5 ÷ 8 can be written as 5/8.", "why": "5 ÷ 8 = 5/8."}, {"t": "2 pies are shared equally among 6 people. What fraction of a pie does each person get?", "a": "1/3", "show": "1/3", "hint": "2 ÷ 6 can be written as 2/6.", "why": "2 ÷ 6 = 2/6 = 1/3 in simplest form."}, {"t": "Write 7 ÷ 3 as a fraction.", "a": "7/3", "show": "7/3", "hint": "The dividend is the numerator.", "why": "7 ÷ 3 = 7/3."}, {"t": "Write 5 ÷ 2 as a fraction.", "a": "5/2", "show": "5/2", "hint": "The dividend is the numerator.", "why": "5 ÷ 2 = 5/2."}, {"t": "There are 12 marbles. 3/4 of them are red. How many marbles are red?", "a": "9", "show": "9", "hint": "Find 1/4 of 12 first.", "why": "12 ÷ 4 = 3 for 1/4, so 3/4 is 3 × 3 = 9."}, {"t": "There are 20 stickers. 2/5 of them are stars. How many are stars?", "a": "8", "show": "8", "hint": "Find 1/5 of 20 first.", "why": "20 ÷ 5 = 4, so 2/5 is 2 × 4 = 8."}, {"t": "There are 18 apples. 5/6 of them are ripe. How many are ripe?", "a": "15", "show": "15", "hint": "Find 1/6 of 18 first.", "why": "18 ÷ 6 = 3, so 5/6 is 5 × 3 = 15."}, {"t": "In a group of 8 children, 6 are girls. What fraction of the group are girls? Write it in simplest form.", "a": "3/4", "show": "3/4", "hint": "6/8 can be simplified.", "why": "6/8 = 3/4."}];const SECC=[{"t": "What does 3/5 mean as a division?", "o": ["5 ÷ 3", "3 × 5", "3 ÷ 5"], "c": 2, "show": "3 ÷ 5", "hint": "The numerator is divided by the denominator.", "why": "3/5 means 3 ÷ 5."}, {"t": "4 ÷ 9 = ?/9. What is the missing numerator?", "a": "4", "show": "4", "hint": "A fraction bar means divide.", "why": "4 ÷ 9 = 4/9."}, {"t": "3/10 of a class of 30 students wear glasses. How many wear glasses?", "a": "9", "show": "9", "hint": "Find 1/10 of 30.", "why": "30 ÷ 10 = 3, so 3/10 is 9."}, {"t": "A rope is 9/12 yard long. Write 9/12 in simplest form.", "a": "3/4", "show": "3/4", "hint": "Divide top and bottom by 3.", "why": "9/12 = 3/4."}, {"t": "Two ways to write 5/8 are:", "o": ["1/8 + 4/8 and 2/8 + 3/8", "1/8 + 5/8 and 4/8 + 4/8", "5/8 + 0/8 only"], "c": 0, "show": "1/8 + 4/8 and 2/8 + 3/8", "hint": "The numerators must add to 5.", "why": "1 + 4 = 5 and 2 + 3 = 5."}, {"t": "Which statement is true?", "o": ["4 ÷ 5 = 4/5", "4 ÷ 5 = 5/4", "4 ÷ 5 = 9/5"], "c": 0, "show": "4 ÷ 5 = 4/5", "hint": "The number being divided goes on top.", "why": "4 ÷ 5 = 4/5."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function decTool(){
  const d=gv('dd',2,12),n=Math.min(gv('dn',2,12),d*1);let n2=Math.min(n,d);if(n2<2)n2=2;
  let rows=[];for(let a=1;a<=n2/2;a++)rows.push('<b>'+a+'/'+d+' + '+(n2-a)+'/'+d+'</b> = '+n2+'/'+d);
  $('dr').innerHTML=fbar(n2,d,'#8FC4D6')+'<div class="out2"><b>All the unit-fraction sums:</b><br>'+Array(n2).fill('1/'+d).join(' + ')+' = '+n2+'/'+d+'<br><b>Ways to split into two parts:</b><br>'+rows.join('<br>')+'</div>';
}
function divTool(){
  const a=gv('va',1,40),b=gv('vb',2,12);const q=Math.floor(a/b),r=a%b;const g=gcdf(a,b);
  $('vr').innerHTML='<div class="out2"><b>'+a+' ÷ '+b+' = '+a+'/'+b+'</b>'+(g>1?'<br>In simplest form that is '+a/g+'/'+b/g+'.':'')+(a>b?'<br>As a mixed number: '+(r?q+' '+r+'/'+b:q)+'.':'')+'<br>Share '+a+' whole things equally among '+b+' people, and each person gets '+a+'/'+b+' of one thing.</div>';
}
function rA(){secPage('a','<div class="card"><h1>Building fractions</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">A fraction like 3/8 is made of <b>unit fractions</b>: 3/8 = 1/8 + 1/8 + 1/8. You can also split it other ways, like 3/8 = 1/8 + 2/8, as long as the denominator stays the same.</div>'
 +'<h3>Try it</h3><div class="row"><span class="fin"><input class="num" id="dn" value="5" oninput="decTool()" inputmode="numeric"><i></i><input class="num" id="dd" value="8" oninput="decTool()" inputmode="numeric"></span></div><div id="dr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>A fraction is a division</h2><div class="rule">The fraction bar means divide: <b>a ÷ b = a/b</b>. 3 pies shared among 4 people is 3 ÷ 4 = 3/4 of a pie each. A fraction can also name parts of a set: 3/4 of 12 is 3 × (12 ÷ 4). Write fractions in simplest form.</div>'
 +'<h3>Try it</h3><div class="row"><input class="num" id="va" value="3" oninput="divTool()" inputmode="numeric"><span>÷</span><input class="num" id="vb" value="4" oninput="divTool()" inputmode="numeric"></div><div id="vr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Putting it together</h2><div class="rule">Fractions can be sums of unit fractions, a division, or part of a set. They all name the same amounts.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
