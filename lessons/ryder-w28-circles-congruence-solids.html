<style>

table.cmp{border-collapse:separate;border-spacing:3px;margin:10px auto}

.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.pbtn button.on{border-color:var(--teal);background:var(--tint)}

ul{margin:6px 0 6px 22px}

.nlw{width:100%;overflow-x:auto}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.am{border-collapse:collapse;margin:8px auto;font-size:18px}.am td,.am th{border:2px solid var(--line);padding:8px 12px;text-align:center;min-width:64px}.am th{background:#E3EAF0;color:var(--main-d)}.am td.hl{background:#EAF3F7;font-weight:700}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:4px 0}

@media(max-width:560px){body{font-size:17px}.cc{width:46px}.cc .dg{font-size:24px;height:42px}.cc .nm{font-size:10px}.cc .vl{font-size:10px}.cm{width:8px;font-size:24px}input.num{width:100%}}

<body>
<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Circles, Congruence and Solids</div><a class="back" id="modeLink" href="#">Mom view</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "A circle has a radius of 5 cm. What is its diameter in cm?", "a": "10", "show": "10", "hint": "The diameter is twice the radius.", "why": "2 × 5 = 10 cm."}, {"t": "A circle has a diameter of 18 cm. What is its radius in cm?", "a": "9", "show": "9", "hint": "The radius is half the diameter.", "why": "18 ÷ 2 = 9 cm."}, {"t": "A circle has a radius of 12 m. What is its diameter in meters?", "a": "24", "show": "24", "hint": "Double it.", "why": "2 × 12 = 24 m."}, {"t": "A circle has a diameter of 7 inches. What is its radius? (decimal)", "a": "3.5", "show": "3.5", "hint": "Half of 7.", "why": "7 ÷ 2 = 3.5 inches."}, {"t": "The distance from the center of a circle to any point on the circle is the:", "o": ["diameter", "radius", "center"], "c": 1, "show": "radius", "hint": "It is the shorter one.", "why": "That is the radius."}, {"t": "A line segment that passes through the center and has both endpoints on the circle is the:", "o": ["diameter", "radius", "point"], "c": 0, "show": "diameter", "hint": "It is the longest segment across a circle.", "why": "That is the diameter."}, {"t": "Which is true for a circle?", "o": ["The radius is twice the diameter", "The diameter is twice the radius", "They are always equal"], "c": 1, "show": "The diameter is twice the radius", "hint": "The diameter goes all the way across.", "why": "The diameter is always 2 times the radius."}];const SECB=[{"t": "Two figures are congruent when they have the:", "o": ["same shape but different sizes", "same color", "same size and the same shape"], "c": 2, "show": "same size and the same shape", "hint": "You could place one exactly on top of the other.", "why": "Congruent figures match exactly in size and shape."}, {"t": "Which pair is always congruent?", "o": ["Two squares with side length 4 cm", "Two rectangles with a 4 cm side", "Two triangles"], "c": 0, "show": "Two squares with side length 4 cm", "hint": "Check both size and shape.", "why": "Two squares with the same side length match exactly."}, {"t": "A figure is flipped, turned or slid to a new place. Is it still congruent to the original?", "o": ["Yes, its size and shape do not change", "No", "Only if it is turned"], "c": 0, "show": "Yes, its size and shape do not change", "hint": "Moving does not change size or shape.", "why": "Flips, turns and slides keep the figure congruent."}, {"t": "A 3 cm by 5 cm rectangle and a 3 cm by 6 cm rectangle are:", "o": ["congruent", "circles", "not congruent"], "c": 2, "show": "not congruent", "hint": "Compare the sides.", "why": "The sides are not the same, so they are not congruent."}];const SECC=[{"t": "How many faces does a cube have?", "a": "6", "show": "6", "hint": "Faces are the flat surfaces.", "why": "A cube has 6 faces, 12 edges and 8 vertices."}, {"t": "How many edges does a cube have?", "a": "12", "show": "12", "hint": "Edges are where two faces meet.", "why": "A cube has 6 faces, 12 edges and 8 vertices."}, {"t": "How many vertices does a cube have?", "a": "8", "show": "8", "hint": "Vertices are the corners.", "why": "A cube has 6 faces, 12 edges and 8 vertices."}, {"t": "How many faces does a triangular prism have?", "a": "5", "show": "5", "hint": "Faces are the flat surfaces.", "why": "A triangular prism has 5 faces, 9 edges and 6 vertices."}, {"t": "How many edges does a triangular prism have?", "a": "9", "show": "9", "hint": "Edges are where two faces meet.", "why": "A triangular prism has 5 faces, 9 edges and 6 vertices."}, {"t": "How many vertices does a triangular prism have?", "a": "6", "show": "6", "hint": "Vertices are the corners.", "why": "A triangular prism has 5 faces, 9 edges and 6 vertices."}, {"t": "How many faces does a square pyramid have?", "a": "5", "show": "5", "hint": "Faces are the flat surfaces.", "why": "A square pyramid has 5 faces, 8 edges and 5 vertices."}, {"t": "How many edges does a square pyramid have?", "a": "8", "show": "8", "hint": "Edges are where two faces meet.", "why": "A square pyramid has 5 faces, 8 edges and 5 vertices."}, {"t": "How many vertices does a square pyramid have?", "a": "5", "show": "5", "hint": "Vertices are the corners.", "why": "A square pyramid has 5 faces, 8 edges and 5 vertices."}, {"t": "How many faces does a triangular pyramid have?", "a": "4", "show": "4", "hint": "Faces are the flat surfaces.", "why": "A triangular pyramid has 4 faces, 6 edges and 4 vertices."}, {"t": "A net is a flat pattern that folds into a solid. A net of 6 squares folds into a:", "o": ["cube", "pyramid", "triangular prism"], "c": 0, "show": "cube", "hint": "Six equal faces.", "why": "Six squares fold into a cube."}, {"t": "A net with 4 triangles folds into a:", "o": ["triangular prism", "triangular pyramid", "cube"], "c": 1, "show": "triangular pyramid", "hint": "Four faces, all triangles.", "why": "4 triangles make a triangular pyramid."}, {"t": "A net with 2 triangles and 3 rectangles folds into a:", "o": ["square pyramid", "cube", "triangular prism"], "c": 2, "show": "triangular prism", "hint": "Two matching bases and three side faces.", "why": "That is a triangular prism."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

const SO={"cube": [6, 12, 8], "rectangular prism": [6, 12, 8], "triangular prism": [5, 9, 6], "square pyramid": [5, 8, 5], "triangular pyramid": [4, 6, 4], "pentagonal prism": [7, 15, 10]};
function circTool(){
  const r=gv('cr1',1,50),R=70,cx=110,cy=90;
  $('cr2').innerHTML='<svg viewBox="0 0 220 180" class="sv" style="max-width:260px;background:#fff;border:2px solid var(--line);border-radius:10px"><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#D6ECF3" stroke="#17607A" stroke-width="3"/><line x1="'+(cx-R)+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke="#2B3A44" stroke-width="2.5"/><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*0.7)+'" y2="'+(cy-R*0.7)+'" stroke="#C9972B" stroke-width="3.5"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#2B3A44"/><text x="'+(cx+R*0.38)+'" y="'+(cy-R*0.42)+'" font-size="13" fill="#C9972B" font-weight="700">radius</text><text x="'+(cx-R+6)+'" y="'+(cy+16)+'" font-size="13" fill="#2B3A44" font-weight="700">diameter</text></svg><div class="out2">Radius <b>'+r+'</b> → diameter <b>'+(2*r)+'</b>. Diameter '+(2*r)+' → radius '+r+'.<br>The diameter is always 2 × the radius.</div>';
}
function solTool(){
  const k=$('so').value,v=SO[k];
  $('sor').innerHTML='<div class="out2"><b>'+k+'</b><br>Faces: '+v[0]+'<br>Edges: '+v[1]+'<br>Vertices: '+v[2]+'<br><span class="small">Check: faces + vertices − edges = '+(v[0]+v[2]-v[1])+'</span></div>';
}
function rA(){secPage('a','<div class="card"><h1>Circles</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">The <b>radius</b> goes from the center to the circle. The <b>diameter</b> goes all the way across through the center. <b>Diameter = 2 × radius</b>, and radius = diameter ÷ 2.</div>'
 +'<h3>Try it</h3><div class="row"><span>radius</span><input class="num" id="cr1" value="5" oninput="circTool()" inputmode="numeric"></div><div id="cr2"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Congruent figures</h2><div class="rule">Figures are <b>congruent</b> if they have exactly the same size and the same shape. You can slide, flip or turn one to fit exactly on the other.</div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Solids and nets</h2><div class="rule">A solid has <b>faces</b> (flat surfaces), <b>edges</b> (where faces meet) and <b>vertices</b> (corners). A <b>net</b> is the solid unfolded flat.</div>'
 +'<h3>Solid facts</h3><div class="row"><select id="so" onchange="solTool()" style="font:600 18px Jost,sans-serif;padding:6px">'+Object.keys(SO).map(k=>'<option>'+k+'</option>').join('')+'</select></div><div id="sor"></div></div>',SECC,true);}
