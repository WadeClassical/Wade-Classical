<style>

table.cmp{border-collapse:separate;border-spacing:3px;margin:10px auto}

.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.pbtn button.on{border-color:var(--teal);background:var(--tint)}

.steps{margin:8px 0;padding-left:22px}.steps li{margin:4px 0}

@media(max-width:560px){body{font-size:17px}.cc{width:46px}.cc .dg{font-size:24px;height:42px}.cc .nm{font-size:10px}.cc .vl{font-size:10px}.cm{width:8px;font-size:24px}input.num{width:100%}}

<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Mixed Numbers</div><a class="back" id="modeLink" href="#">Mom view</a></div>

<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "Write 7/4 as a mixed number.", "a": "1 3/4", "show": "1 3/4", "hint": "7 ÷ 4 = ?  with a remainder.", "why": "7 ÷ 4 = 1 remainder 3, so 7/4 = 1 3/4."}, {"t": "Write 11/3 as a mixed number.", "a": "3 2/3", "show": "3 2/3", "hint": "11 ÷ 3 = ?  with a remainder.", "why": "11 ÷ 3 = 3 remainder 2, so 11/3 = 3 2/3."}, {"t": "Write 17/5 as a mixed number.", "a": "3 2/5", "show": "3 2/5", "hint": "17 ÷ 5 = ?  with a remainder.", "why": "17 ÷ 5 = 3 remainder 2, so 17/5 = 3 2/5."}, {"t": "Write 9/2 as a mixed number.", "a": "4 1/2", "show": "4 1/2", "hint": "9 ÷ 2 = ?  with a remainder.", "why": "9 ÷ 2 = 4 remainder 1, so 9/2 = 4 1/2."}, {"t": "Write 19/8 as a mixed number.", "a": "2 3/8", "show": "2 3/8", "hint": "19 ÷ 8 = ?  with a remainder.", "why": "19 ÷ 8 = 2 remainder 3, so 19/8 = 2 3/8."}, {"t": "Write 2 1/2 as a fraction greater than 1.", "a": "5/2", "show": "5/2", "hint": "2 × 2 + 1 = ?", "why": "2 1/2 = 4/2 + 1/2 = 5/2."}, {"t": "Write 3 1/4 as a fraction greater than 1.", "a": "13/4", "show": "13/4", "hint": "3 × 4 + 1 = ?", "why": "3 1/4 = 12/4 + 1/4 = 13/4."}, {"t": "Write 1 5/6 as a fraction greater than 1.", "a": "11/6", "show": "11/6", "hint": "1 × 6 + 5 = ?", "why": "1 5/6 = 6/6 + 5/6 = 11/6."}, {"t": "Write 4 2/3 as a fraction greater than 1.", "a": "14/3", "show": "14/3", "hint": "4 × 3 + 2 = ?", "why": "4 2/3 = 12/3 + 2/3 = 14/3."}, {"t": "Write 2 3/8 as a fraction greater than 1.", "a": "19/8", "show": "19/8", "hint": "2 × 8 + 3 = ?", "why": "2 3/8 = 16/8 + 3/8 = 19/8."}];const SECB=[{"t": "1 1/5 + 2 2/5 = ?  (write as a mixed number in simplest form)", "a": "3 3/5", "show": "3 3/5", "hint": "Add the whole numbers and add the fractions. Regroup if the fractions make more than 1.", "why": "Wholes: 1 + 2 = 3. Fractions: 1/5 + 2/5 = 3/5. Together that is 3 3/5."}, {"t": "2 3/8 + 1 2/8 = ?  (write as a mixed number in simplest form)", "a": "3 5/8", "show": "3 5/8", "hint": "Add the whole numbers and add the fractions. Regroup if the fractions make more than 1.", "why": "Wholes: 2 + 1 = 3. Fractions: 3/8 + 2/8 = 5/8. Together that is 3 5/8."}, {"t": "3 1/6 + 2 1/6 = ?  (write as a mixed number in simplest form)", "a": "5 1/3", "show": "5 1/3", "hint": "Add the whole numbers and add the fractions. Regroup if the fractions make more than 1.", "why": "Wholes: 3 + 2 = 5. Fractions: 1/6 + 1/6 = 2/6. Together that is 5 1/3 after simplifying 2/6 to 1/3."}, {"t": "1 3/4 + 2 3/4 = ?  (write as a mixed number in simplest form)", "a": "4 1/2", "show": "4 1/2", "hint": "Add the whole numbers and add the fractions. Regroup if the fractions make more than 1.", "why": "Wholes: 1 + 2 = 3. Fractions: 3/4 + 3/4 = 6/4 = 1 1/2. Together that is 4 1/2."}, {"t": "2 5/6 + 3 4/6 = ?  (write as a mixed number in simplest form)", "a": "6 1/2", "show": "6 1/2", "hint": "Add the whole numbers and add the fractions. Regroup if the fractions make more than 1.", "why": "Wholes: 2 + 3 = 5. Fractions: 5/6 + 4/6 = 9/6 = 1 1/2. Together that is 6 1/2."}, {"t": "4 3/5 − 2 1/5 = ?  (write as a mixed number in simplest form)", "a": "2 2/5", "show": "2 2/5", "hint": "Change both to fractions greater than 1, or regroup 1 whole as 5/5.", "why": "4 3/5 = 23/5 and 2 1/5 = 11/5. 23 − 11 = 12, so the answer is 2 2/5."}, {"t": "3 5/8 − 1 2/8 = ?  (write as a mixed number in simplest form)", "a": "2 3/8", "show": "2 3/8", "hint": "Change both to fractions greater than 1, or regroup 1 whole as 8/8.", "why": "3 5/8 = 29/8 and 1 2/8 = 10/8. 29 − 10 = 19, so the answer is 2 3/8."}, {"t": "5 3/4 − 2 3/4 = ?  (write as a mixed number in simplest form)", "a": "3", "show": "3", "hint": "Change both to fractions greater than 1, or regroup 1 whole as 4/4.", "why": "5 3/4 = 23/4 and 2 3/4 = 11/4. 23 − 11 = 12, so the answer is 3."}, {"t": "3 1/4 − 1 3/4 = ?  (write as a mixed number in simplest form)", "a": "1 1/2", "show": "1 1/2", "hint": "Change both to fractions greater than 1, or regroup 1 whole as 4/4.", "why": "3 1/4 = 13/4 and 1 3/4 = 7/4. 13 − 7 = 6, so the answer is 1 1/2."}, {"t": "4 1/6 − 2 5/6 = ?  (write as a mixed number in simplest form)", "a": "1 1/3", "show": "1 1/3", "hint": "Change both to fractions greater than 1, or regroup 1 whole as 6/6.", "why": "4 1/6 = 25/6 and 2 5/6 = 17/6. 25 − 17 = 8, so the answer is 1 1/3."}];const SECC=[{"t": "A board is 2 3/8 feet long. Another board is 1 4/8 feet long. How long are they together? (mixed number, simplest form)", "a": "3 7/8", "show": "3 7/8", "hint": "Add the wholes and add the fractions.", "why": "2 + 1 = 3 and 3/8 + 4/8 = 7/8, so 3 7/8 feet."}, {"t": "Mia has 5 1/4 cups of flour and uses 2 3/4 cups. How many cups are left? (mixed number, simplest form)", "a": "2 1/2", "show": "2 1/2", "hint": "Change to fractions greater than 1 first.", "why": "21/4 − 11/4 = 10/4 = 2 2/4 = 2 1/2 cups."}, {"t": "Which is the same as 3 2/5?", "o": ["11/5", "17/5", "15/5"], "c": 1, "show": "17/5", "hint": "3 × 5 + 2 = ?", "why": "3 × 5 = 15, plus 2 is 17, so 3 2/5 = 17/5."}, {"t": "Ruth says 1 3/4 + 2 3/4 = 3 6/4. Is that a complete answer in simplest form?", "o": ["No. 3 6/4 = 4 1/2", "Yes", "No. It is 3 3/4"], "c": 0, "show": "No. 3 6/4 = 4 1/2", "hint": "6/4 is more than 1 whole.", "why": "6/4 = 1 2/4 = 1 1/2, so 3 + 1 1/2 = 4 1/2."}, {"t": "A trail is 6 1/3 miles. Sam has walked 2 2/3 miles. How many miles are left? (mixed number)", "a": "3 2/3", "show": "3 2/3", "hint": "6 1/3 = 19/3.", "why": "19/3 − 8/3 = 11/3 = 3 2/3 miles."}, {"t": "Which mixed number is greater than 4?", "o": ["3 7/8", "4 1/8", "3 3/4"], "c": 1, "show": "4 1/8", "hint": "A mixed number is greater than 4 if its whole part is at least 4 and it has a fraction.", "why": "4 1/8 is 4 plus a little more. The others are less than 4."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function mfTool(){
  const d=gv('md',2,12),n=gv('mn',1,12*9);
  const w=Math.floor(n/d),r=n%d;
  $('mr').innerHTML='<div class="out2"><b>'+n+'/'+d+'</b> = '+(r?(w?w+' '+r+'/'+d:r+'/'+d):w)+'<br>'+n+' ÷ '+d+' = '+w+' remainder '+r+'<br>So '+w+' whole'+(w===1?'':'s')+' ('+w*d+'/'+d+') and '+r+'/'+d+' left over.'+(r&&gcdf(r,d)>1?'<br>Simplest form: <b>'+w+' '+r/gcdf(r,d)+'/'+d/gcdf(r,d)+'</b>':'')+'</div>';
}
function mxTool(){
  $('xd2').value=gv('xd',2,12);
  const w1=gv('x1',0,9),n1=gv('x2',0,11),w2=gv('x3',0,9),n2=gv('x4',0,11),d=gv('xd',2,12);const a=w1*d+n1,b=w2*d+n2,sg=$('xo').value;
  const r=sg==='+'?a+b:a-b;
  if(r<0){$('xr').innerHTML='<div class="out2">The answer would be less than 0. Try a larger first number.</div>';return;}
  $('xr').innerHTML='<div class="out2">'+w1+' '+n1+'/'+d+' = '+a+'/'+d+'<br>'+w2+' '+n2+'/'+d+' = '+b+'/'+d+'<br>'+a+'/'+d+' '+sg+' '+b+'/'+d+' = '+r+'/'+d+'<br><b>Answer: '+mstr(r,d)+'</b></div>';
}
function rA(){secPage('a','<div class="card"><h1>Mixed numbers</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">A <b>mixed number</b> has a whole number and a fraction, like 2 3/4. To change to a fraction, <b>multiply the whole by the denominator, then add the numerator</b>: 2 3/4 = (2 × 4 + 3)/4 = 11/4. To change back, divide the numerator by the denominator.</div>'
 +'<h3>Try it: fraction to mixed number</h3><div class="row"><span class="fin"><input class="num" id="mn" value="11" oninput="mfTool()" inputmode="numeric"><i></i><input class="num" id="md" value="4" oninput="mfTool()" inputmode="numeric"></span></div><div id="mr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Adding and subtracting mixed numbers</h2><div class="rule">Two ways. <b>1.</b> Change both to fractions greater than 1, add or subtract the numerators, then change back. <b>2.</b> Add the wholes and the fractions separately, and regroup if the fractions make more than 1. Enter answers like 3 7/8 with a space. Use simplest form.</div>'
 +'<h3>Try it</h3><p class="small">Each mixed number has a whole number box, then a fraction box. Both use the same bottom number.</p><div class="row"><input class="num whole" id="x1" value="2" oninput="mxTool()" inputmode="numeric"><span class="fin"><input class="num" id="x2" value="3" oninput="mxTool()" inputmode="numeric"><i></i><input class="num" id="xd" value="4" oninput="mxTool()" inputmode="numeric"></span><select id="xo" onchange="mxTool()" style="font:600 18px Jost,sans-serif;padding:6px"><option>+</option><option>−</option></select><input class="num whole" id="x3" value="1" oninput="mxTool()" inputmode="numeric"><span class="fin"><input class="num" id="x4" value="3" oninput="mxTool()" inputmode="numeric"><i></i><input class="num" id="xd2" disabled></span></div><div id="xr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Putting it together</h2><div class="rule">Change to fractions greater than 1, work with the numerators, then change back to a mixed number in simplest form.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
function INITS(){if($('mn'))mfTool();if($('x1'))mxTool();}
const ORAL=["Change 3 2/5 to a fraction. Explain each step.", "Add 1 3/4 + 2 3/4 and explain the regrouping.", "Subtract 4 1/3 − 1 2/3 in two different ways."];
const WEEKNO=16;

let SECBASE=0,SECTOTAL=0,ST=0;
const MOM2=MOM;
function momGate(cb){cb();} /* PIN turned off for now */
function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}

function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}
function buildMom(){
  let all='<div class="card" style="border-top-color:#C9972B"><h2>Mom view</h2><p>The whole lesson on one page, with every answer shown. Nothing is scored or saved. Click Student view to give it to Ryder.</p></div>';
  SECFNS.forEach(fn=>{fn();all+=$('stage').innerHTML;});
  all+='<div class="card"><h2>Check him on these, out loud</h2><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="small">If he does these well, tick them on his rung in Math Home. If he is solid, let him test out.</p></div>';
  $('stage').innerHTML=all;$('bar').style.width='100%';INITS();
}
function bar(){$('bar').style.width=Math.round(ST/(SECFNS.length)*100)+'%';}
function nav(last){if(MOM)return '';return '<div class="row" style="margin-top:14px"><button class="btn" id="nextbtn" onclick="nextSec()" disabled>'+(last?'Finish':'Next')+'</button><span class="small" id="cnt"></span></div>';}
function nextSec(){ST++;render();window.scrollTo(0,0);}
function listHTML(sec,arr){let h='';arr.forEach((q,i)=>{h+=qHTML(sec,i,q);});return h;}
function render(){bar();QS={};SECBASE=ANSWERED;if(ST>=SECFNS.length){rDone();return;}SECFNS[ST]();INITS();upd();}
function secPage(id,intro,items,last){SECTOTAL=items.length;$('stage').innerHTML=intro+'<div class="card"><h2>Check it</h2>'+listHTML(id,items)+nav(last)+'</div>';}
function rDone(){
  const pct=Math.round(FIRST/TOTAL*100);
  $('stage').innerHTML='<div class="card"><h1>Done</h1><p>First-try correct: <span class="score">'+FIRST+' of '+TOTAL+'</span></p>'
   +'<p>'+(pct>=85?'That is strong. Tell Mom you may be ready to test out of Week '+WEEKNO+'.':pct>=60?'Good start. Look again at anything you missed, then tell Mom.':'Go back through the rules with Mom before you test out.')+'</p>'
   +'<h3>Now say these to Mom, out loud</h3><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
   +'<div class="row" style="margin-top:14px"><a class="btn" style="text-decoration:none" href="../wade-math-home.html#/kid/ryder">Back to Math Home</a><button class="btn alt" onclick="location.reload()">Do it again</button></div></div>';
}
function gv(id,lo,hi){let v=parseInt(norm($(id).value),10);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v));}
function fmt(n){return Number(n).toLocaleString('en-US');}
begin();

(function(){if(/[?&]mom=1/.test(location.search)){var b=document.querySelector('a.back');if(b){b.href=b.getAttribute('href').replace(/#\/kid\/(\w+)/,'#/mom/ladder/$1');b.textContent='\u2190 Lessons';}}})();
</script>
