<body>
<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Factors and Multiples</div><a class="back" id="modeLink" href="#">Mom view</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="numeric" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,v===norm(s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "How many factor pairs does 24 have?", "a": "4", "show": "4", "hint": "List them: 1 × 24, 2 × 12, 3 × 8, 4 × 6.", "why": "24 has 4 factor pairs."}, {"t": "7 × ? = 56. What is the missing factor?", "a": "8", "show": "8", "hint": "56 ÷ 7.", "why": "7 × 8 = 56."}, {"t": "Which of these is NOT a factor of 36?", "o": ["4", "8", "9"], "c": 1, "show": "8", "hint": "Divide 36 by each. Which does not come out even?", "why": "36 ÷ 8 = 4 remainder 4, so 8 is not a factor."}, {"t": "How many factors does 20 have in all?", "a": "6", "show": "6", "hint": "1, 2, 4, 5, 10, 20.", "why": "20 has 6 factors."}, {"t": "What is the largest factor of 45 that is smaller than 45?", "a": "15", "show": "15", "hint": "45 = 3 × 15.", "why": "The factors of 45 are 1, 3, 5, 9, 15, 45."}, {"t": "How many factor pairs does 49 have?", "a": "2", "show": "2", "hint": "1 × 49 and 7 × 7.", "why": "49 has 2 factor pairs. 7 × 7 counts once."}, {"t": "How many factor pairs does 100 have?", "a": "5", "show": "5", "hint": "1 × 100, 2 × 50, 4 × 25, 5 × 20, 10 × 10.", "why": "100 has 5 factor pairs."}];const SECB=[{"t": "What is the 6th multiple of 7?", "a": "42", "show": "42", "hint": "Count by 7s six times, or 6 × 7.", "why": "7, 14, 21, 28, 35, 42."}, {"t": "Which of these is a multiple of 8?", "o": ["56", "58", "74"], "c": 0, "show": "56", "hint": "Count by 8s or use the 8s facts.", "why": "8 × 7 = 56."}, {"t": "What is the first multiple of 9 that is greater than 50?", "a": "54", "show": "54", "hint": "9 × 5 = 45 is too small.", "why": "9 × 6 = 54."}, {"t": "How many multiples of 5 are there from 1 to 100?", "a": "20", "show": "20", "hint": "5, 10, 15, … up to 100. 100 ÷ 5 = ?", "why": "5 × 20 = 100, so there are 20."}, {"t": "Is 91 a multiple of 7?", "o": ["No", "Yes"], "c": 1, "show": "Yes", "hint": "Does 7 divide 91 evenly? 7 × 13 = ?", "why": "7 × 13 = 91."}, {"t": "Is 85 a multiple of 6?", "o": ["No", "Yes"], "c": 0, "show": "No", "hint": "6 × 14 = 84. 6 × 15 = 90.", "why": "85 is between 84 and 90, so it is not a multiple of 6."}, {"t": "What is the smallest number that is a multiple of both 4 and 6?", "a": "12", "show": "12", "hint": "List multiples of 6: 6, 12, 18. Is 12 a multiple of 4?", "why": "12 is the smallest. 4 × 3 = 12 and 6 × 2 = 12."}];const SECC=[{"t": "A teacher has 36 students. She wants equal rows. How many different row arrangements (factor pairs) can she make?", "a": "5", "show": "5", "hint": "List the factor pairs of 36.", "why": "1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6: 5 ways."}, {"t": "A number has the factors 1, 3, 5 and 15. Which number is it?", "o": ["15", "30", "45"], "c": 0, "show": "15", "hint": "It is the largest factor.", "why": "Every number is its own largest factor."}, {"t": "Which number between 20 and 40 is a multiple of both 3 and 5?", "a": "30", "show": "30", "hint": "Multiples of 15: 15, 30, 45.", "why": "30 = 3 × 10 = 5 × 6."}, {"t": "True or false: every factor of 12 is also a factor of 24.", "o": ["True", "False"], "c": 0, "show": "True", "hint": "12 × 2 = 24, so anything that divides 12 divides 24.", "why": "1, 2, 3, 4, 6 and 12 all divide 24."}, {"t": "A baker packs 48 muffins into equal boxes. Each box must hold more than 1 muffin and fewer than 48. How many different box sizes are possible?", "a": "8", "show": "8", "hint": "Count the factors of 48, then leave out 1 and 48.", "why": "The factors are 1, 2, 3, 4, 6, 8, 12, 16, 24, 48. Leave out 1 and 48: 8 sizes."}, {"t": "Is 0 a multiple of 7?", "o": ["No, it is too small", "Yes, 0 × 7 = 0"], "c": 1, "show": "Yes, 0 × 7 = 0", "hint": "Zero times any number is zero.", "why": "0 = 7 × 0, so 0 is a multiple of every number."}];
function facTool(){
  const n=gv('fa',1,100),ps=[];for(let i=1;i*i<=n;i++)if(n%i===0)ps.push([i,n/i]);
  let h='';ps.forEach(p=>{const w=Math.min(18,Math.floor(200/Math.max(p[1],1))),sz=Math.max(6,Math.min(16,w));
    let dots='';for(let r=0;r<p[0];r++){dots+='<div style="display:flex">';for(let c=0;c<p[1];c++)dots+='<span style="width:'+sz+'px;height:'+sz+'px;margin:1px;border-radius:50%;background:#17607A;display:inline-block"></span>';dots+='</div>';}
    h+='<div style="display:inline-block;margin:8px 14px 8px 0;vertical-align:top"><div><b>'+p[0]+' × '+p[1]+'</b></div>'+dots+'</div>';});
  const all=[];ps.forEach(p=>{all.push(p[0]);if(p[1]!==p[0])all.push(p[1]);});all.sort((a,b)=>a-b);
  $('fr').innerHTML='<div class="out2">Factors of '+n+': <b>'+all.join(', ')+'</b><br>'+ps.length+' factor pair'+(ps.length===1?'':'s')+(n===1?'.':all.length===2?'. Only 1 and itself, so '+n+' is <b>prime</b>.':'. More than 2 factors, so '+n+' is <b>composite</b>.')+'</div>'+h;
}
function mulTool(){
  const n=gv('mn',1,100),k=gv('mk',2,9),q=Math.floor(n/k),r=n%k;let h='';
  for(let m=k;m<=100;m+=k)h+='<span style="display:inline-block;min-width:34px;text-align:center;padding:3px 5px;margin:2px;border-radius:7px;border:2px solid '+(m===n?'#C9972B':'var(--line)')+';background:'+(m===n?'#FBF0D2':'#fff')+';font-weight:'+(m===n?'700':'400')+'">'+m+'</span>';
  $('mr').innerHTML='<div class="out2">'+n+' ÷ '+k+' = '+q+(r?' remainder '+r:'')+'<br>'+(r?'<b>'+n+' is not a multiple of '+k+'</b>, because there is a remainder.':'<b>'+n+' is a multiple of '+k+'</b>: '+k+' × '+q+' = '+n+'.')+'</div><p class="small">Multiples of '+k+' up to 100:</p><div>'+h+'</div>';
}
function rA(){secPage('a','<div class="card"><h1>Factors and multiples</h1><p class="small">About 15 minutes. This is practice only. Nothing here is saved or graded.</p><h2 style="margin-top:12px">Factor pairs</h2>'
 +'<div class="rule">Two numbers that multiply to make a number are a <b>factor pair</b>. 24 = 4 × 6, so 4 and 6 are factors of 24. A factor divides the number with nothing left over.</div>'
 +'<h3>Try it. Type a number from 1 to 100.</h3><div class="row"><input class="num" id="fa" value="24" oninput="facTool()" inputmode="numeric"></div><div id="fr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Multiples</h2>'
 +'<div class="rule">A <b>multiple</b> of a number is what you get when you multiply it by 1, 2, 3, and so on. The multiples of 7 are 7, 14, 21, 28. A number is a multiple of k if k divides it with no remainder.</div>'
 +'<h3>Try it. Is the number a multiple?</h3><div class="row"><span>number</span><input class="num" id="mn" value="91" oninput="mulTool()" inputmode="numeric"><span>of</span><input class="num" id="mk" value="7" oninput="mulTool()" inputmode="numeric"></div><div id="mr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Using factors and multiples</h2><div class="rule">Factors go in: they divide the number. Multiples go out: they are the number times 1, 2, 3 and so on. The smallest number that is a multiple of two numbers is their least common multiple.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
function INITS(){if($('fa'))facTool();if($('mn'))mulTool();}
const ORAL=["What is a factor pair? Give the factor pairs of 24.", "How can you tell if 91 is a multiple of 7?", "What is the difference between a factor and a multiple?"];
const WEEKNO=10;

let SECBASE=0,SECTOTAL=0,ST=0;
const MOM2=MOM;
function momGate(cb){cb();} /* PIN turned off for now */
function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}

function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}
function buildMom(){
  let all='<div class="card" style="border-top-color:#C9972B"><h2>Mom view</h2><p>The whole lesson on one page, with every answer shown. Nothing is scored or saved. Click Student view to give it to Ryder.</p></div>';
  SECFNS.forEach(fn=>{fn();all+=$('stage').innerHTML;});
  all+='<div class="card"><h2>Check him on these, out loud</h2><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="small">If he does these well, tick them on his rung in Math Home. If he is solid, let him test out.</p></div>';
  $('stage').innerHTML=all;$('bar').style.width='100%';INITS();
}
function bar(){$('bar').style.width=Math.round(ST/(SECFNS.length)*100)+'%';}
function nav(last){if(MOM)return '';return '<div class="row" style="margin-top:14px"><button class="btn" id="nextbtn" onclick="nextSec()" disabled>'+(last?'Finish':'Next')+'</button><span class="small" id="cnt"></span></div>';}
function nextSec(){ST++;render();window.scrollTo(0,0);}
function listHTML(sec,arr){let h='';arr.forEach((q,i)=>{h+=qHTML(sec,i,q);});return h;}
function render(){bar();QS={};SECBASE=ANSWERED;if(ST>=SECFNS.length){rDone();return;}SECFNS[ST]();INITS();upd();}
function secPage(id,intro,items,last){SECTOTAL=items.length;$('stage').innerHTML=intro+'<div class="card"><h2>Check it</h2>'+listHTML(id,items)+nav(last)+'</div>';}
function rDone(){
  const pct=Math.round(FIRST/TOTAL*100);
  $('stage').innerHTML='<div class="card"><h1>Done</h1><p>First-try correct: <span class="score">'+FIRST+' of '+TOTAL+'</span></p>'
   +'<p>'+(pct>=85?'That is strong. Tell Mom you may be ready to test out of Week '+WEEKNO+'.':pct>=60?'Good start. Look again at anything you missed, then tell Mom.':'Go back through the rules with Mom before you test out.')+'</p>'
   +'<h3>Now say these to Mom, out loud</h3><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
   +'<div class="row" style="margin-top:14px"><a class="btn" style="text-decoration:none" href="../wade-math-home.html#/kid/ryder">Back to Math Home</a><button class="btn alt" onclick="location.reload()">Do it again</button></div></div>';
}
function gv(id,lo,hi){let v=parseInt(norm($(id).value),10);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v));}
function fmt(n){return Number(n).toLocaleString('en-US');}
