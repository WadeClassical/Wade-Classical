<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "An L-shaped figure is made of a 8 by 3 rectangle and a 4 by 2 rectangle that do not overlap. What is the total area in square units?", "a": "32", "show": "32", "hint": "Find each rectangle’s area and add.", "why": "8 × 3 = 24 and 4 × 2 = 8. 24 + 8 = 32 square units."}, {"t": "An L-shaped figure is made of a 10 by 4 rectangle and a 6 by 3 rectangle that do not overlap. What is the total area in square units?", "a": "58", "show": "58", "hint": "Find each rectangle’s area and add.", "why": "10 × 4 = 40 and 6 × 3 = 18. 40 + 18 = 58 square units."}, {"t": "An L-shaped figure is made of a 7 by 5 rectangle and a 3 by 3 rectangle that do not overlap. What is the total area in square units?", "a": "44", "show": "44", "hint": "Find each rectangle’s area and add.", "why": "7 × 5 = 35 and 3 × 3 = 9. 35 + 9 = 44 square units."}, {"t": "An L-shaped figure is made of a 9 by 2 rectangle and a 5 by 4 rectangle that do not overlap. What is the total area in square units?", "a": "38", "show": "38", "hint": "Find each rectangle’s area and add.", "why": "9 × 2 = 18 and 5 × 4 = 20. 18 + 20 = 38 square units."}, {"t": "A 12 by 9 rectangle has a 4 by 3 rectangle cut out of one corner. What is the area that is left, in square units?", "a": "96", "show": "96", "hint": "Find the whole rectangle’s area and subtract the corner.", "why": "12 × 9 = 108, the corner is 4 × 3 = 12, and 108 − 12 = 96 square units."}, {"t": "A 10 by 8 rectangle has a 4 by 3 rectangle cut out of one corner. What is the area that is left, in square units?", "a": "68", "show": "68", "hint": "Find the whole rectangle’s area and subtract the corner.", "why": "10 × 8 = 80, the corner is 4 × 3 = 12, and 80 − 12 = 68 square units."}, {"t": "A 15 by 6 rectangle has a 5 by 2 rectangle cut out of one corner. What is the area that is left, in square units?", "a": "80", "show": "80", "hint": "Find the whole rectangle’s area and subtract the corner.", "why": "15 × 6 = 90, the corner is 5 × 2 = 10, and 90 − 10 = 80 square units."}, {"t": "A figure is split into three rectangles: 5 by 4, 3 by 4 and 2 by 6. What is the total area in square units?", "a": "44", "show": "44", "hint": "Add the three areas.", "why": "20 + 12 + 12 = 44 square units."}, {"t": "To find the area of an L-shaped figure, you can:", "o": ["multiply all the sides", "split it into rectangles and add their areas", "add all the sides"], "c": 1, "show": "split it into rectangles and add their areas", "hint": "Break it into pieces you know.", "why": "Splitting into rectangles and adding works for any L-shape."}, {"t": "Another way to find the area of an L-shape is to:", "o": ["make it a big rectangle and subtract the missing part", "double the perimeter", "count the corners"], "c": 0, "show": "make it a big rectangle and subtract the missing part", "hint": "Fill in the missing corner, then take it away.", "why": "Fill in a big rectangle, then subtract the part that is not there."}];const SECB=[{"t": "A box is 4 cubes long, 3 cubes wide and 2 cubes high. How many unit cubes fill it?", "a": "24", "show": "24", "hint": "Count one layer, then multiply by the number of layers.", "why": "One layer has 4 × 3 = 12 cubes. 2 layers make 24 cubes."}, {"t": "A box is 5 cubes long, 2 cubes wide and 3 cubes high. How many unit cubes fill it?", "a": "30", "show": "30", "hint": "Count one layer, then multiply by the number of layers.", "why": "One layer has 5 × 2 = 10 cubes. 3 layers make 30 cubes."}, {"t": "A box is 6 cubes long, 2 cubes wide and 2 cubes high. How many unit cubes fill it?", "a": "24", "show": "24", "hint": "Count one layer, then multiply by the number of layers.", "why": "One layer has 6 × 2 = 12 cubes. 2 layers make 24 cubes."}, {"t": "A box is 10 cubes long, 2 cubes wide and 3 cubes high. How many unit cubes fill it?", "a": "60", "show": "60", "hint": "Count one layer, then multiply by the number of layers.", "why": "One layer has 10 × 2 = 20 cubes. 3 layers make 60 cubes."}, {"t": "A box is 3 cubes long, 3 cubes wide and 3 cubes high. How many unit cubes fill it?", "a": "27", "show": "27", "hint": "Count one layer, then multiply by the number of layers.", "why": "One layer has 3 × 3 = 9 cubes. 3 layers make 27 cubes."}, {"t": "The bottom layer of a box has 12 cubes. The box is 5 layers high. How many cubes in all?", "a": "60", "show": "60", "hint": "12 per layer × 5 layers.", "why": "12 × 5 = 60 cubes."}, {"t": "A box is 5 cm long, 4 cm wide and 3 cm high. Each cube is 1 cubic cm. What is the volume in cubic cm?", "a": "60", "show": "60", "hint": "Volume = length × width × height.", "why": "5 × 4 × 3 = 60 cubic cm."}, {"t": "A cube has edges of 4 cm. What is its volume in cubic cm?", "a": "64", "show": "64", "hint": "4 × 4 × 4.", "why": "4 × 4 × 4 = 64 cubic cm."}, {"t": "Volume is measured in:", "o": ["square units", "cubic units", "units"], "c": 1, "show": "cubic units", "hint": "Volume fills space.", "why": "Volume is measured in cubic units."}, {"t": "A solid is built from 36 unit cubes. What is its volume?", "o": ["36 square units", "6 cubic units", "36 cubic units"], "c": 2, "show": "36 cubic units", "hint": "Each cube is 1 cubic unit.", "why": "36 unit cubes make 36 cubic units."}];const SECC=[{"t": "A prism that is 2 by 3 by 4 and another that is 1 by 3 by 4 are stuck together. What is the total volume in cubic units?", "a": "36", "show": "36", "hint": "Add the two volumes.", "why": "24 + 12 = 36 cubic units."}, {"t": "How many more cubes are in a 5 by 4 by 3 box than in a 4 by 4 by 3 box?", "a": "12", "show": "12", "hint": "Find both volumes.", "why": "60 − 48 = 12 more cubes."}, {"t": "A box has a volume of 48 cubic cm. Its base is 4 cm by 3 cm. How tall is it in cm?", "a": "4", "show": "4", "hint": "Base area is 12. Divide.", "why": "4 × 3 = 12, and 48 ÷ 12 = 4 cm."}, {"t": "A fish tank is 10 in long, 5 in wide and 6 in high. What is its volume in cubic inches?", "a": "300", "show": "300", "hint": "10 × 5 × 6.", "why": "10 × 5 = 50 and 50 × 6 = 300 cubic inches."}, {"t": "A student says a 3 by 4 by 2 box has a volume of 9. What went wrong?", "o": ["He added instead of multiplying: 3 × 4 × 2 = 24", "He is right", "He should have multiplied by 3 only"], "c": 0, "show": "He added instead of multiplying: 3 × 4 × 2 = 24", "hint": "Volume is a product.", "why": "3 + 4 + 2 = 9, but the volume is 3 × 4 × 2 = 24 cubic units."}, {"t": "Which has the greatest volume?", "o": ["A box 6 by 2 by 3 (36)", "A box 5 by 3 by 2 (30)", "A box 4 by 2 by 2 (16)"], "c": 0, "show": "A box 6 by 2 by 3 (36)", "hint": "Multiply each.", "why": "6 × 2 × 3 = 36, 5 × 3 × 2 = 30 and 4 × 2 × 2 = 16."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function lTool(){
  const a=gv('la',2,20),b=gv('lb',2,20),c=gv('lc',1,a-1),d=gv('ld',1,b-1);
  const sc=Math.min(220/a,150/b,20),W=a*sc,H=b*sc,cw=c*sc,ch=d*sc;
  $('lr').innerHTML='<svg viewBox="0 0 300 '+(H+30)+'" class="sv" style="max-width:340px"><path d="M 20 14 H '+(20+W)+' V '+(14+H-ch)+' H '+(20+W-cw)+' V '+(14+H)+' H 20 Z" fill="#D6ECF3" stroke="#17607A" stroke-width="3"/><rect x="'+(20+W-cw)+'" y="'+(14+H-ch)+'" width="'+cw+'" height="'+ch+'" fill="none" stroke="#C9972B" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(20+W/2)+'" y="'+(H+28)+'" text-anchor="middle" font-size="13" fill="#2B3A44">'+a+'</text><text x="'+(26+W)+'" y="'+(14+(H-ch)/2)+'" font-size="13" fill="#2B3A44">'+b+'</text></svg><div class="out2">Big rectangle: '+a+' × '+b+' = '+a*b+'<br>Missing corner: '+c+' × '+d+' = '+c*d+'<br>L-shape area = '+a*b+' − '+c*d+' = <b>'+(a*b-c*d)+'</b> square units</div>';
}
function volTool(){
  const l=gv('vl',1,10),w=gv('vw',1,10),h=gv('vh',1,8);
  let s='';const u=14,ox=20,oy=h*u+30;let items=[];
  for(let k=0;k<h;k++)for(let j=0;j<w;j++)for(let i=0;i<l;i++)items.push([i,j,k]);
  items.sort((p,q)=>(q[1]-p[1])||(p[2]-q[2])||(p[0]-q[0]));
  let svg='<svg viewBox="0 0 330 '+(h*u+w*u*0.5+24)+'" class="sv" style="max-width:360px">';
  const bx=14,by=h*u+w*u*0.5+6-u;
  items.forEach(([i,j,k])=>{const x=bx+i*u+(w-1-j)*u*0.5*0+j*u*0.5,y=by-k*u-j*u*0.5;svg+='<rect x="'+x+'" y="'+y+'" width="'+u+'" height="'+u+'" fill="'+(k%2?'#8FC4D6':'#A9D4E3')+'" stroke="#17607A" stroke-width="1"/>';});
  svg+='</svg>';
  $('vr').innerHTML=svg+'<div class="out2">One layer: '+l+' × '+w+' = '+l*w+' cubes<br>'+h+' layer'+(h===1?'':'s')+': '+l*w+' × '+h+' = <b>'+l*w*h+' cubic units</b></div>';
}
function rA(){secPage('a','<div class="card"><h1>Area of complex figures</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">For an L-shape or other complex figure, <b>split it into rectangles and add</b> the areas, or <b>fill in a big rectangle and subtract</b> the missing part.</div>'
 +'<h3>Cut a corner out</h3><div class="row"><span>big</span><input class="num" id="la" value="12" oninput="lTool()" inputmode="numeric"><span>×</span><input class="num" id="lb" value="9" oninput="lTool()" inputmode="numeric"></div><div class="row"><span>corner</span><input class="num" id="lc" value="4" oninput="lTool()" inputmode="numeric"><span>×</span><input class="num" id="ld" value="3" oninput="lTool()" inputmode="numeric"></div><div id="lr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Volume by counting cubes</h2><div class="rule"><b>Volume</b> is how many unit cubes fill a solid. Each cube is 1 cubic unit. Count one layer, then multiply by the number of layers: <b>V = l × w × h</b>.</div>'
 +'<h3>Build a box</h3><div class="row"><span>length</span><input class="num" id="vl" value="4" oninput="volTool()" inputmode="numeric"><span>width</span><input class="num" id="vw" value="3" oninput="volTool()" inputmode="numeric"><span>height</span><input class="num" id="vh" value="2" oninput="volTool()" inputmode="numeric"></div><div id="vr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Putting it together</h2><div class="rule">Volume is in cubic units. Add the volumes of solids that are stuck together. To find a missing height, divide the volume by the area of the base.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
function INITS(){if($('la'))lTool();if($('vl'))volTool();}
const ORAL=["How do you find the area of an L-shaped figure? Show two ways.", "What does volume measure, and how do you count it with cubes?", "A box is 5 by 4 by 3. What is its volume, and how do you know?"];

}
function gv(id,lo,hi){let v=parseInt(norm($(id).value),10);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v));}
function fmt(n){return Number(n).toLocaleString('en-US');}
