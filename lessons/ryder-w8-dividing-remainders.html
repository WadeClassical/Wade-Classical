<style>

<body>
<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Dividing and Remainders</div><a class="back" id="modeLink" href="#">Mom view</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="numeric" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,v===norm(s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "84 ÷ 4 = ?", "a": "21", "show": "21", "hint": "Divide one digit at a time: 8 ÷ 4 = 2; 4 ÷ 4 = 1.", "why": "84 ÷ 4 = 21."}, {"t": "156 ÷ 3 = ?", "a": "52", "show": "52", "hint": "Divide one digit at a time: 1 ÷ 3 = 0 r 1; 15 ÷ 3 = 5; 6 ÷ 3 = 2.", "why": "156 ÷ 3 = 52."}, {"t": "725 ÷ 5 = ?", "a": "145", "show": "145", "hint": "Divide one digit at a time: 7 ÷ 5 = 1 r 2; 22 ÷ 5 = 4 r 2; 25 ÷ 5 = 5.", "why": "725 ÷ 5 = 145."}, {"t": "1,248 ÷ 6 = ?", "a": "208", "show": "208", "hint": "Divide one digit at a time: 1 ÷ 6 = 0 r 1; 12 ÷ 6 = 2; 4 ÷ 6 = 0 r 4; 48 ÷ 6 = 8.", "why": "1,248 ÷ 6 = 208."}, {"t": "3,654 ÷ 9 = ?", "a": "406", "show": "406", "hint": "Divide one digit at a time: 3 ÷ 9 = 0 r 3; 36 ÷ 9 = 4; 5 ÷ 9 = 0 r 5; 54 ÷ 9 = 6.", "why": "3,654 ÷ 9 = 406."}, {"t": "9,000 ÷ 8 = ?", "a": "1125", "show": "1,125", "hint": "Divide one digit at a time: 9 ÷ 8 = 1 r 1; 10 ÷ 8 = 1 r 2; 20 ÷ 8 = 2 r 4; 40 ÷ 8 = 5.", "why": "9,000 ÷ 8 = 1,125."}, {"t": "2,418 ÷ 3 = ?", "a": "806", "show": "806", "hint": "Divide one digit at a time: 2 ÷ 3 = 0 r 2; 24 ÷ 3 = 8; 1 ÷ 3 = 0 r 1; 18 ÷ 3 = 6.", "why": "2,418 ÷ 3 = 806."}];const SECB=[{"t": "47 ÷ 6 = 7 remainder ___", "a": "5", "show": "5", "hint": "7 × 6 = 42. How much is left from 47?", "why": "47 − 42 = 5."}, {"t": "158 ÷ 7: the quotient is 22. What is the remainder?", "a": "4", "show": "4", "hint": "22 × 7 = 154. 158 − 154 = ?", "why": "158 = 22 × 7 + 4."}, {"t": "1,000 ÷ 9 = 111 remainder ___", "a": "1", "show": "1", "hint": "111 × 9 = 999.", "why": "1,000 − 999 = 1."}, {"t": "2,345 ÷ 4: the quotient is 586. What is the remainder?", "a": "1", "show": "1", "hint": "586 × 4 = 2,344.", "why": "2,345 − 2,344 = 1."}, {"t": "Which check proves that 47 ÷ 6 = 7 remainder 5?", "o": ["7 + 6 + 5 = 18", "7 × 6 + 5 = 47", "7 × 5 + 6 = 41"], "c": 1, "show": "7 × 6 + 5 = 47", "hint": "Multiply the quotient by the divisor, then add the remainder.", "why": "7 × 6 = 42 and 42 + 5 = 47, the starting number."}, {"t": "When you divide by 6, which of these can NOT be a remainder?", "o": ["6", "5", "0"], "c": 0, "show": "6", "hint": "If the remainder is 6 or more, you can make another group of 6.", "why": "A remainder is always less than the divisor."}];const SECC=[{"t": "47 students need rides. Each van seats 6. How many vans are needed?", "a": "8", "show": "8", "hint": "47 ÷ 6 = 7 r 5. The 5 students left over still need a van.", "why": "Round UP: 8 vans."}, {"t": "47 cookies are shared equally among 6 friends. How many cookies does each friend get?", "a": "7", "show": "7", "hint": "47 ÷ 6 = 7 r 5. The 5 cookies left cannot be shared equally.", "why": "Round DOWN: each friend gets 7."}, {"t": "47 pencils are packed in boxes of 6. How many pencils are left over?", "a": "5", "show": "5", "hint": "47 ÷ 6 = 7 r 5.", "why": "The question asks for the remainder: 5."}, {"t": "How many full 8-egg cartons can be filled from 100 eggs?", "a": "12", "show": "12", "hint": "100 ÷ 8 = 12 r 4. Only full cartons count.", "why": "Round DOWN: 12 full cartons."}, {"t": "A rope is 150 feet long. It is cut into 7-foot pieces. How many full pieces are there?", "a": "21", "show": "21", "hint": "150 ÷ 7 = 21 r 3.", "why": "Round DOWN: 21 pieces, with 3 feet left over."}, {"t": "47 people need rides in 6-seat vans. Why do we round UP to 8 vans?", "o": ["Because 47 is odd", "The 5 people left over still need a van", "Because 6 is even"], "c": 1, "show": "The 5 people left over still need a van", "hint": "What happens to the people in the remainder?", "why": "The leftover people need a ride, so we need one more van."}];
const PN=['ones','tens','hundreds','thousands'];
function divTool(){
  const n=gv('da',10,9999),d=gv('db',2,9),s=String(n);let rem=0,qd='',st='';
  for(let i=0;i<s.length;i++){const cur=rem*10+Number(s[i]),q=Math.floor(cur/d),r=cur%d;qd+=q;st+='<li>'+PN[s.length-1-i]+': '+cur+' ÷ '+d+' = '+q+(r?' r '+r:'')+(i<s.length-1&&r?' (the '+r+' left carries to the next digit)':'')+'</li>';rem=r;}
  const q=Math.floor(n/d),r=n%d;
  $('dvr').innerHTML='<ol class="steps">'+st+'</ol><div class="out2">'+fmt(n)+' ÷ '+d+' = <b>'+fmt(q)+(r?' remainder '+r:'')+'</b><br>Check: '+fmt(q)+' × '+d+(r?' + '+r:'')+' = '+fmt(q*d+r)+' ✓</div>';
}
function remTool(){
  const n=gv('ra',10,999),d=gv('rb',2,9),q=Math.floor(n/d),r=n%d;
  $('rmr').innerHTML='<div class="out2">'+n+' ÷ '+d+' = '+q+' remainder '+r+'</div>'
   +'<table class="am" style="text-align:left"><tr><th>The question asks…</th><th>Answer</th><th>Why</th></tr>'
   +'<tr><td>How many are left over?</td><td class="hl">'+r+'</td><td>The remainder is the answer.</td></tr>'
   +'<tr><td>How many full groups can be made?</td><td class="hl">'+q+'</td><td>Round down. The leftover cannot fill a group.</td></tr>'
   +'<tr><td>How many groups are needed to hold everyone?</td><td class="hl">'+(r?q+1:q)+'</td><td>'+(r?'Round up. The leftover still needs a group.':'Nothing is left over, so no extra group.')+'</td></tr></table>';
}
function rA(){secPage('a','<div class="card"><h1>Dividing and remainders</h1><p class="small">About 15 minutes. This is practice only. Nothing here is saved or graded.</p><h2 style="margin-top:12px">Dividing one digit at a time</h2>'
 +'<div class="rule">Divide from the left, one place at a time. Whatever is left over moves to the next digit. Check by multiplying: quotient × divisor + remainder = the starting number.</div>'
 +'<h3>Try it. Type a number up to 9999 and a divisor from 2 to 9.</h3><div class="row"><input class="num" id="da" value="3654" oninput="divTool()" inputmode="numeric"><span>÷</span><input class="num" id="db" value="9" oninput="divTool()" inputmode="numeric"></div><div id="dvr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>What is a remainder?</h2>'
 +'<div class="rule">The remainder is what is left over after making as many equal groups as you can. It is always smaller than the divisor.</div>'
 +'<h3>Try it.</h3><div class="row"><input class="num" id="ra" value="47" oninput="remTool()" inputmode="numeric"><span>÷</span><input class="num" id="rb" value="6" oninput="remTool()" inputmode="numeric"></div><div id="rmr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>What do we do with the remainder?</h2><div class="rule">Read the question. <b>Left over?</b> The remainder is the answer. <b>Full groups?</b> Round down. <b>Enough to hold everyone?</b> Round up. Try 47 ÷ 6 in the tool above to see all three.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
function INITS(){if($('da'))divTool();if($('ra'))remTool();}
const ORAL=["Divide 3,654 by 9 one digit at a time. What happens to a leftover?", "How do you check a division answer with a remainder?", "47 students and 6-seat vans: why do we round up? When would we round down?"];
const WEEKNO=8;

let SECBASE=0,SECTOTAL=0,ST=0;
const MOM2=MOM;
function momGate(cb){cb();} /* PIN turned off for now */
function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}

function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}
function buildMom(){
  let all='<div class="card" style="border-top-color:#C9972B"><h2>Mom view</h2><p>The whole lesson on one page, with every answer shown. Nothing is scored or saved. Click Student view to give it to Ryder.</p></div>';
  SECFNS.forEach(fn=>{fn();all+=$('stage').innerHTML;});
  all+='<div class="card"><h2>Check him on these, out loud</h2><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="small">If he does these well, tick them on his rung in Math Home. If he is solid, let him test out.</p></div>';
  $('stage').innerHTML=all;$('bar').style.width='100%';INITS();
}
function bar(){$('bar').style.width=Math.round(ST/(SECFNS.length)*100)+'%';}
function nav(last){if(MOM)return '';return '<div class="row" style="margin-top:14px"><button class="btn" id="nextbtn" onclick="nextSec()" disabled>'+(last?'Finish':'Next')+'</button><span class="small" id="cnt"></span></div>';}
function nextSec(){ST++;render();window.scrollTo(0,0);}
function listHTML(sec,arr){let h='';arr.forEach((q,i)=>{h+=qHTML(sec,i,q);});return h;}
