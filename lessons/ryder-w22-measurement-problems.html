<!DOCTYPE html>
<html lang="en">
<head>

<title>Ryder · Week 22 · Measurement Problems</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--parch:#C8D0D8;--card:#F6F8FB;--forest:#204B3A;--ink:#1E2A24;--muted:#55604F;--line:#C3CCD7;--teal:#17607A;--teal-d:#0F4A5F;--ok:#2E7D4F;--bad:#A8323A;--tint:#E3F0F4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',system-ui,sans-serif;background:var(--parch);color:var(--ink);font-size:18px;line-height:1.45;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 70px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.back{color:var(--teal);text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--teal);border-radius:10px;padding:6px 12px;background:#fff}
.title{font-weight:700;font-size:20px;color:var(--teal-d);flex:1;text-align:center}
.prog{height:8px;background:#fff;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:30px;line-height:1.15;color:var(--teal-d)}
h2{font-size:23px;line-height:1.2;color:var(--teal-d);margin-bottom:6px}
h3{font-size:17px;color:var(--teal-d);margin:14px 0 6px}
p{margin:8px 0}
.small{font-size:15px;color:var(--muted)}
.rule{background:var(--tint);border-left:5px solid var(--teal);border-radius:8px;padding:10px 14px;margin:10px 0;font-weight:500}
.btn{font-family:inherit;font-weight:600;font-size:17px;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;color:#fff;background:var(--teal)}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.num{font:600 22px Jost,sans-serif;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:190px;background:#fff;color:var(--ink)}
input.num:focus{outline:none;border-color:var(--teal)}
/* chart */
.chart{display:flex;justify-content:center;gap:0;margin:12px 0 6px;overflow-x:auto;padding-bottom:4px}
.cc{width:68px;flex:none;text-align:center}
.cc .nm{font-size:12px;color:var(--muted);min-height:30px;line-height:1.1;display:flex;align-items:flex-end;justify-content:center;padding:0 2px}
.cc .dg{font:700 34px Jost,sans-serif;background:#fff;border:2px solid var(--teal);border-radius:8px;margin:3px 2px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--teal-d)}
.cc .dg.z{color:#B9C7CC;border-color:#C9D6DA}
.cc .vl{font-size:13px;font-weight:600;color:var(--ink);min-height:18px}
.cm{width:14px;flex:none;font:700 34px Jost,sans-serif;align-self:center;margin-top:12px;color:var(--ink);text-align:center}
.arrows{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--teal-d);margin:6px 8px 0;gap:10px;flex-wrap:wrap}
.arrows span{background:var(--tint);border-radius:99px;padding:4px 12px}
/* questions */
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .t{font-weight:500;margin-bottom:6px}
.q .res{margin-top:6px;font-size:16px;font-weight:600}
.q.good .res{color:var(--ok)}.q.bad .res{color:var(--bad)}
.q.good input{border-color:var(--ok);background:#EEF7F1}
.opt{display:block;width:100%;text-align:left;font:500 17px Jost,sans-serif;padding:9px 12px;margin:5px 0;background:#fff;border:2px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt.sym{display:inline-block;width:auto;min-width:76px;text-align:center;font-size:28px;font-weight:700;margin-right:8px}
.opt.right{border-color:var(--ok);background:#EEF7F1}.opt.wrong{border-color:var(--bad);background:#FAEBEC}
table.cmp{border-collapse:separate;border-spacing:3px;margin:10px auto}
table.cmp td{width:42px;height:46px;text-align:center;font:700 26px Jost,sans-serif;background:#fff;border:2px solid var(--line);border-radius:7px}
table.cmp td.cm{width:12px;border:0;background:none;padding:0}
table.cmp td.hl{border-color:var(--teal);background:var(--tint);color:var(--teal-d)}
table.cmp td.pl{height:auto;border:0;background:none;font:600 11px Jost,sans-serif;color:var(--muted);vertical-align:bottom;line-height:1.1}
table.cmp td.lb{width:auto;border:0;background:none;font:600 14px Jost,sans-serif;color:var(--muted);text-align:right;padding-right:6px}
.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.pbtn button.on{border-color:var(--teal);background:var(--tint)}
.nl{width:100%;max-width:560px;display:block;margin:6px auto}
table.tb{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}
table.tb td,table.tb th{border:1px solid var(--line);padding:7px 10px;text-align:left;background:#fff}
table.tb th{background:var(--tint);color:var(--teal-d)}
.big{font:700 28px Jost,sans-serif;color:var(--teal-d)}
.score{font:700 44px Jost,sans-serif;color:var(--teal-d)}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--teal-d)}
ul{margin:6px 0 6px 22px}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;margin:10px 0;font-weight:700;color:var(--teal-d)}
.chain .v{background:#fff;border:2px solid var(--teal);border-radius:8px;padding:6px 9px;font-size:18px}
.chain .x{font-size:13px;background:var(--tint);border-radius:99px;padding:3px 8px;color:var(--teal-d)}
.dpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.dpick button{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:#fff;font:700 18px Jost,sans-serif;cursor:pointer;color:var(--ink)}
.dpick button.on{border-color:var(--teal);background:var(--tint)}
.eq{text-align:center;font:700 24px Jost,sans-serif;color:var(--teal-d);margin:6px 0;min-height:34px}
.nlw{width:100%;overflow-x:auto}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.am{border-collapse:collapse;margin:8px auto;font-size:18px}.am td,.am th{border:2px solid var(--line);padding:8px 12px;text-align:center;min-width:64px}.am th{background:#E3EAF0;color:var(--main-d)}.am td.hl{background:#EAF3F7;font-weight:700}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:4px 0}
.out2{background:#F3F7FA;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.sv{display:block;margin:8px auto;max-width:100%}

@media(max-width:560px){body{font-size:17px}.cc{width:46px}.cc .dg{font-size:24px;height:42px}.cc .nm{font-size:10px}.cc .vl{font-size:10px}.cm{width:8px;font-size:24px}input.num{width:100%}}
</style>

<body>
<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Measurement Problems</div><a class="back" id="modeLink" href="#">Mom view</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "A rope is 3.5 m long. Ana cuts off 1.2 m. How many meters are left?", "a": "2.3", "show": "2.3", "hint": "Subtract: 3.5 − 1.2.", "why": "3.5 − 1.2 = 2.3 m."}, {"t": "A jug holds 2 liters. Sam pours out 750 ml. How many milliliters are left?", "a": "1250", "show": "1,250", "hint": "Change 2 liters to milliliters first.", "why": "2 l = 2,000 ml, and 2,000 − 750 = 1,250 ml."}, {"t": "One package weighs 1.5 kg and another weighs 2.25 kg. What is the total mass in kg?", "a": "3.75", "show": "3.75", "hint": "Line up the decimal points.", "why": "1.50 + 2.25 = 3.75 kg."}, {"t": "Ruth walked 2 3/4 km in the morning and 1 1/4 km in the afternoon. How many km did she walk in all?", "a": "4", "show": "4", "hint": "Add the wholes and the fractions.", "why": "2 + 1 = 3 and 3/4 + 1/4 = 1, so 4 km."}, {"t": "Three bottles each hold 0.75 liter. How many liters is that in all?", "a": "2.25", "show": "2.25", "hint": "3 groups of 0.75.", "why": "3 × 0.75 = 2.25 l."}, {"t": "A 12 m rope is cut into 8 equal pieces. How many meters is each piece?", "a": "1.5", "show": "1.5", "hint": "12 ÷ 8 = 12/8.", "why": "12 ÷ 8 = 1.5 m."}, {"t": "A track is 0.4 km around. Ben runs 4 laps. How many km does he run?", "a": "1.6", "show": "1.6", "hint": "4 × 0.4.", "why": "4 × 0.4 = 1.6 km."}, {"t": "5 kg of flour is split equally into 4 bags. How many kg are in each bag?", "a": "1.25", "show": "1.25", "hint": "5 ÷ 4.", "why": "5 ÷ 4 = 1.25 kg."}];const SECB=[{"t": "A class starts at 2:15 p.m. and ends at 4:50 p.m. How many minutes is that?", "a": "155", "show": "155", "hint": "2:15 to 4:15 is 2 hours. Then 35 more minutes.", "why": "2 h + 35 min = 120 + 35 = 155 min."}, {"t": "A movie lasts 95 minutes and starts at 3:30 p.m. When does it end?", "o": ["5:25 p.m.", "5:05 p.m.", "4:95 p.m."], "c": 1, "show": "5:05 p.m.", "hint": "95 min = 1 h 35 min.", "why": "3:30 + 1 h = 4:30, and 4:30 + 35 min = 5:05 p.m."}, {"t": "Sam starts reading at 8:40 a.m. and reads for 1 hour 45 minutes. When does he stop?", "o": ["10:25 a.m.", "9:85 a.m.", "10:45 a.m."], "c": 0, "show": "10:25 a.m.", "hint": "Add 1 hour first, then 45 minutes.", "why": "8:40 + 1 h = 9:40, and 9:40 + 45 min = 10:25 a.m."}, {"t": "3 hours 20 minutes = ? minutes", "a": "200", "show": "200", "hint": "3 × 60 = 180.", "why": "180 + 20 = 200 min."}, {"t": "2 1/2 hours = ? minutes", "a": "150", "show": "150", "hint": "1/2 hour = 30 minutes.", "why": "2 × 60 + 30 = 150 min."}, {"t": "45 minutes is what fraction of an hour? (simplest form)", "a": "3/4", "show": "3/4", "hint": "45/60.", "why": "45/60 = 3/4."}, {"t": "A train trip takes 2 hours 50 minutes. How many minutes is the trip in all?", "a": "170", "show": "170", "hint": "2 h = 120 min.", "why": "120 + 50 = 170 min."}, {"t": "A show is 1 3/4 hours long. How many minutes is that?", "a": "105", "show": "105", "hint": "3/4 hour = 45 minutes.", "why": "60 + 45 = 105 min."}, {"t": "Ana practices piano 25 minutes a day for 6 days. How many minutes is that in all?", "a": "150", "show": "150", "hint": "25 × 6.", "why": "25 × 6 = 150 min."}, {"t": "How many seconds are in 3 minutes?", "a": "180", "show": "180", "hint": "1 min = 60 s.", "why": "3 × 60 = 180 s."}];const SECC=[{"t": "A book costs $5.75 and a pen costs $3.40. What is the total cost? (number only)", "a": "9.15", "show": "9.15", "hint": "Line up the decimal points.", "why": "5.75 + 3.40 = 9.15, or $9.15."}, {"t": "Ruth pays with a $20 bill for something that costs $13.65. How much change? (number only)", "a": "6.35", "show": "6.35", "hint": "20.00 − 13.65.", "why": "20.00 − 13.65 = 6.35, or $6.35."}, {"t": "4 pens cost $1.35 each. What is the total cost? (number only)", "a": "5.4", "show": "5.4", "hint": "4 × 1.35.", "why": "4 × 1.35 = 5.40, or $5.40."}, {"t": "Three friends share $18.60 equally. How much does each friend get? (number only)", "a": "6.2", "show": "6.2", "hint": "18.60 ÷ 3.", "why": "18.60 ÷ 3 = 6.20, or $6.20."}, {"t": "How many quarters are in $3.50?", "a": "14", "show": "14", "hint": "1 dollar = 4 quarters.", "why": "$3.50 = 350 cents, and 350 ÷ 25 = 14 quarters."}, {"t": "A ribbon is 3/4 m long. How would you find its length on a number line from 0 to 1?", "o": ["Cut it into 3 equal parts and count 4 parts from 0", "Cut it into 4 equal parts and count 3 parts from 0", "Cut it into 3 equal parts and count 3 parts from 0"], "c": 1, "show": "Cut it into 4 equal parts and count 3 parts from 0", "hint": "3/4 means 3 of 4 equal parts.", "why": "3/4 is found by cutting 0 to 1 into 4 equal parts and counting 3."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function pn(id){const v=parseFloat(($(id).value||'').replace(',','.'));return isNaN(v)?0:v;}
function tapeTool(){
  const tot=pn('tt'),prt=pn('tp'),W=400;const a=Math.max(0,Math.min(tot,prt)),f=tot>0?a/tot:0,r=Math.round((tot-a)*1000)/1000;
  $('tr').innerHTML='<svg viewBox="0 0 '+W+' 70" class="sv" style="max-width:440px"><rect x="10" y="12" width="'+(W-20)+'" height="26" fill="#fff" stroke="#17607A" stroke-width="2"/><rect x="10" y="12" width="'+(f*(W-20))+'" height="26" fill="#8FC4D6" stroke="#17607A" stroke-width="2"/><text x="'+(10+f*(W-20)/2)+'" y="30" text-anchor="middle" font-size="14" fill="#2B3A44">'+a+'</text><text x="'+(10+f*(W-20)+(1-f)*(W-20)/2)+'" y="30" text-anchor="middle" font-size="14" fill="#2B3A44">?</text><text x="'+(W/2)+'" y="62" text-anchor="middle" font-size="14" fill="#2B3A44">whole: '+tot+'</text></svg><div class="out2">Part + part = whole, so the other part is whole − part: '+tot+' − '+a+' = <b>'+r+'</b></div>';
}
function timeTool(){
  const h1=gv('h1',1,12),m1=gv('m1',0,59),h2=gv('h2',1,12),m2=gv('m2',0,59);
  const ap1=$('ap1').value,ap2=$('ap2').value;
  const t=(h,m,ap)=>((h%12)+(ap==='p.m.'?12:0))*60+m;
  let d=t(h2,m2,ap2)-t(h1,m1,ap1);if(d<0)d+=1440;
  $('tmr').innerHTML='<div class="out2">From '+h1+':'+String(m1).padStart(2,'0')+' '+ap1+' to '+h2+':'+String(m2).padStart(2,'0')+' '+ap2+'<br><b>'+Math.floor(d/60)+' h '+d%60+' min</b> ('+d+' minutes)</div>';
}
function rA(){secPage('a','<div class="card"><h1>Measurement problems</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">Measurement word problems use the same four operations. <b>Change to the same unit first</b>, then add, subtract, multiply or divide. A tape diagram helps: draw the whole, mark the part you know, and find the part you do not.</div>'
 +'<h3>Tape diagram</h3><div class="row"><span>whole</span><input class="num" id="tt" value="3.5" oninput="tapeTool()" inputmode="decimal"><span>part</span><input class="num" id="tp" value="1.2" oninput="tapeTool()" inputmode="decimal"></div><div id="tr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Time</h2><div class="rule">For elapsed time, count to the next hour, then the whole hours, then the remaining minutes. Hours to minutes: multiply by 60. A fraction of an hour: 45 minutes is 45/60 = 3/4 of an hour.</div>'
 +'<h3>Elapsed time</h3><div class="row"><input class="num" id="h1" value="2" oninput="timeTool()" inputmode="numeric"><span>:</span><input class="num" id="m1" value="15" oninput="timeTool()" inputmode="numeric"><select id="ap1" onchange="timeTool()" style="font:600 18px Jost,sans-serif;padding:6px"><option>p.m.</option><option>a.m.</option></select></div><div class="row"><input class="num" id="h2" value="4" oninput="timeTool()" inputmode="numeric"><span>:</span><input class="num" id="m2" value="50" oninput="timeTool()" inputmode="numeric"><select id="ap2" onchange="timeTool()" style="font:600 18px Jost,sans-serif;padding:6px"><option>p.m.</option><option>a.m.</option></select></div><div id="tmr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Money</h2><div class="rule">Money is a decimal measure. 4 quarters = $1.00, so $3.50 is 14 quarters. Line up the decimal points, and give answers as a number.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
function INITS(){if($('tt'))tapeTool();if($('h1'))timeTool();}
const ORAL=["A rope is 3.5 m and you cut off 1.2 m. How do you set up and solve it?", "How many minutes from 2:15 p.m. to 4:50 p.m.? Show your counting.", "Why do you change to the same unit before you subtract?"];
const WEEKNO=22;

let SECBASE=0,SECTOTAL=0,ST=0;
const MOM2=MOM;
function momGate(cb){cb();} /* PIN turned off for now */
function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}

function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}
function buildMom(){
  let all='<div class="card" style="border-top-color:#C9972B"><h2>Mom view</h2><p>The whole lesson on one page, with every answer shown. Nothing is scored or saved. Click Student view to give it to Ryder.</p></div>';
  SECFNS.forEach(fn=>{fn();all+=$('stage').innerHTML;});
  all+='<div class="card"><h2>Check him on these, out loud</h2><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="small">If he does these well, tick them on his rung in Math Home. If he is solid, let him test out.</p></div>';
  $('stage').innerHTML=all;$('bar').style.width='100%';INITS();
}
function bar(){$('bar').style.width=Math.round(ST/(SECFNS.length)*100)+'%';}
function nav(last){if(MOM)return '';return '<div class="row" style="margin-top:14px"><button class="btn" id="nextbtn" onclick="nextSec()" disabled>'+(last?'Finish':'Next')+'</button><span class="small" id="cnt"></span></div>';}
function nextSec(){ST++;render();window.scrollTo(0,0);}
function listHTML(sec,arr){let h='';arr.forEach((q,i)=>{h+=qHTML(sec,i,q);});return h;}
function render(){bar();QS={};SECBASE=ANSWERED;if(ST>=SECFNS.length){rDone();return;}SECFNS[ST]();INITS();upd();}
function secPage(id,intro,items,last){SECTOTAL=items.length;$('stage').innerHTML=intro+'<div class="card"><h2>Check it</h2>'+listHTML(id,items)+nav(last)+'</div>';}
function rDone(){
  const pct=Math.round(FIRST/TOTAL*100);
  $('stage').innerHTML='<div class="card"><h1>Done</h1><p>First-try correct: <span class="score">'+FIRST+' of '+TOTAL+'</span></p>'
   +'<p>'+(pct>=85?'That is strong. Tell Mom you may be ready to test out of Week '+WEEKNO+'.':pct>=60?'Good start. Look again at anything you missed, then tell Mom.':'Go back through the rules with Mom before you test out.')+'</p>'
   +'<h3>Now say these to Mom, out loud</h3><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
   +'<div class="row" style="margin-top:14px"><a class="btn" style="text-decoration:none" href="../wade-math-home.html#/kid/ryder">Back to Math Home</a><button class="btn alt" onclick="location.reload()">Do it again</button></div></div>';
}
function gv(id,lo,hi){let v=parseInt(norm($(id).value),10);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v));}
function fmt(n){return Number(n).toLocaleString('en-US');}
begin();
/* Mom view: back goes to Mom's lesson list */
(function(){if(/[?&]mom=1/.test(location.search)){var b=document.querySelector('a.back');if(b){b.href=b.getAttribute('href').replace(/#\/kid\/(\w+)/,'#/mom/ladder/$1');b.textContent='\u2190 Lessons';}}})();
</script>
