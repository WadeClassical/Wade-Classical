<style>
:root{--parch:#C8D0D8;--card:#F6F8FB;--forest:#204B3A;--ink:#1E2A24;--muted:#55604F;--line:#C3CCD7;--teal:#17607A;--teal-d:#0F4A5F;--ok:#2E7D4F;--bad:#A8323A;--tint:#E3F0F4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',system-ui,sans-serif;background:var(--parch);color:var(--ink);font-size:18px;line-height:1.45;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 70px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.back{color:var(--teal);text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--teal);border-radius:10px;padding:6px 12px;background:#fff}
.title{font-weight:700;font-size:20px;color:var(--teal-d);flex:1;text-align:center}
.prog{height:8px;background:#fff;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:30px;line-height:1.15;color:var(--teal-d)}
h2{font-size:23px;line-height:1.2;color:var(--teal-d);margin-bottom:6px}

p{margin:8px 0}
.small{font-size:15px;color:var(--muted)}
.rule{background:var(--tint);border-left:5px solid var(--teal);border-radius:8px;padding:10px 14px;margin:10px 0;font-weight:500}
.btn{font-family:inherit;font-weight:600;font-size:17px;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;color:#fff;background:var(--teal)}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.num{font:600 22px Jost,sans-serif;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:190px;background:#fff;color:var(--ink)}
input.num:focus{outline:none;border-color:var(--teal)}
/* chart */
.chart{display:flex;justify-content:center;gap:0;margin:12px 0 6px;overflow-x:auto;padding-bottom:4px}
.cc{width:68px;flex:none;text-align:center}
.cc .nm{font-size:12px;color:var(--muted);min-height:30px;line-height:1.1;display:flex;align-items:flex-end;justify-content:center;padding:0 2px}
.cc .dg{font:700 34px Jost,sans-serif;background:#fff;border:2px solid var(--teal);border-radius:8px;margin:3px 2px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--teal-d)}
.cc .dg.z{color:#B9C7CC;border-color:#C9D6DA}

.arrows{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--teal-d);margin:6px 8px 0;gap:10px;flex-wrap:wrap}

.q{border-top:1px solid var(--line);padding:12px 0}

.q.good input{border-color:var(--ok);background:#EEF7F1}
.opt{display:block;width:100%;text-align:left;font:500 17px Jost,sans-serif;padding:9px 12px;margin:5px 0;background:#fff;border:2px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink)}

table.cmp{border-collapse:separate;border-spacing:3px;margin:10px auto}
table.cmp td{width:42px;height:46px;text-align:center;font:700 26px Jost,sans-serif;background:#fff;border:2px solid var(--line);border-radius:7px}

.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.pbtn button.on{border-color:var(--teal);background:var(--tint)}
.nl{width:100%;max-width:560px;display:block;margin:6px auto}

.big{font:700 28px Jost,sans-serif;color:var(--teal-d)}

details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--teal-d)}
ul{margin:6px 0 6px 22px}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;margin:10px 0;font-weight:700;color:var(--teal-d)}
.chain .v{background:#fff;border:2px solid var(--teal);border-radius:8px;padding:6px 9px;font-size:18px}
.chain .x{font-size:13px;background:var(--tint);border-radius:99px;padding:3px 8px;color:var(--teal-d)}
.dpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}

.dpick button.on{border-color:var(--teal);background:var(--tint)}
.eq{text-align:center;font:700 24px Jost,sans-serif;color:var(--teal-d);margin:6px 0;min-height:34px}
.nlw{width:100%;overflow-x:auto}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tbtn button{font:600 15px Jost,sans-serif;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.am{border-collapse:collapse;margin:8px auto;font-size:18px}.am td,.am th{border:2px solid var(--line);padding:8px 12px;text-align:center;min-width:64px}.am th{background:#E3EAF0;color:var(--main-d)}.am td.hl{background:#EAF3F7;font-weight:700}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:4px 0}
.out2{background:#F3F7FA;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.sv{display:block;margin:8px auto;max-width:100%}

@media(max-width:560px){body{font-size:17px}.cc{width:46px}.cc .dg{font-size:24px;height:42px}.cc .nm{font-size:10px}.cc .vl{font-size:10px}.cm{width:8px;font-size:24px}input.num{width:100%}}

<div class="wrap">
  <div class="top"><a class="back" href="../wade-math-home.html#/kid/ryder">← Math Home</a><div class="title">Multi-Step Problems</div><a class="back" id="modeLink" href="#">Mom view</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="numeric" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,v===norm(s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "6 + 4 × 5 = ?", "a": "26", "show": "26", "hint": "Do × and ÷ before + and −.", "why": "6 + 4 × 5 = 26."}, {"t": "(6 + 4) × 5 = ?", "a": "50", "show": "50", "hint": "Do the parentheses first, then × and ÷, then + and −.", "why": "(6 + 4) × 5 = 50."}, {"t": "20 − 8 ÷ 2 = ?", "a": "16", "show": "16", "hint": "Do × and ÷ before + and −.", "why": "20 − 8 ÷ 2 = 16."}, {"t": "(20 − 8) ÷ 2 = ?", "a": "6", "show": "6", "hint": "Do the parentheses first, then × and ÷, then + and −.", "why": "(20 − 8) ÷ 2 = 6."}, {"t": "3 × (4 + 5) − 7 = ?", "a": "20", "show": "20", "hint": "Do the parentheses first, then × and ÷, then + and −.", "why": "3 × (4 + 5) − 7 = 20."}, {"t": "48 ÷ 6 + 2 × 9 = ?", "a": "26", "show": "26", "hint": "Do × and ÷ before + and −.", "why": "48 ÷ 6 + 2 × 9 = 26."}, {"t": "5 × 12 − (3 + 9) ÷ 4 = ?", "a": "57", "show": "57", "hint": "Do the parentheses first, then × and ÷, then + and −.", "why": "5 × 12 − (3 + 9) ÷ 4 = 57."}, {"t": "100 − 4 × (10 + 5) = ?", "a": "40", "show": "40", "hint": "Do the parentheses first, then × and ÷, then + and −.", "why": "100 − 4 × (10 + 5) = 40."}];const SECB=[{"t": "n + 17 = 52. What is n?", "a": "35", "show": "35", "hint": "Undo the + 17 by subtracting 17.", "why": "n = 52 − 17 = 35."}, {"t": "n − 24 = 38. What is n?", "a": "62", "show": "62", "hint": "Undo the − 24 by adding 24.", "why": "n = 38 + 24 = 62."}, {"t": "6 × n = 84. What is n?", "a": "14", "show": "14", "hint": "Undo × 6 by dividing by 6.", "why": "n = 84 ÷ 6 = 14."}, {"t": "n ÷ 8 = 9. What is n?", "a": "72", "show": "72", "hint": "Undo ÷ 8 by multiplying by 8.", "why": "n = 9 × 8 = 72."}, {"t": "Sam has 24 stickers. He gives away s stickers and has 9 left. Which equation fits?", "o": ["24 + s = 9", "24 − s = 9", "s − 24 = 9"], "c": 1, "show": "24 − s = 9", "hint": "He starts with 24, gives some away (subtract), and has 9.", "why": "24 − s = 9, so s = 15."}, {"t": "Four friends each pay p dollars. The total is $36. Which equation fits?", "o": ["4 × p = 36", "4 + p = 36", "p ÷ 4 = 36"], "c": 0, "show": "4 × p = 36", "hint": "4 equal payments of p is 4 × p.", "why": "4 × p = 36, so p = 9."}];const SECC=[{"t": "A shop buys 5 packs of 12 pens and gives away 8 pens. How many pens are left?", "a": "52", "show": "52", "hint": "5 × 12 first, then subtract 8.", "why": "5 × 12 − 8 = 60 − 8 = 52."}, {"t": "Mia buys 3 books at $8 each and a pen for $4. She pays with $40. How many dollars change does she get?", "a": "12", "show": "12", "hint": "Find the total cost first, then subtract from 40.", "why": "3 × 8 + 4 = 28. 40 − 28 = 12."}, {"t": "28 students are in a class. 3 are absent. The rest work in groups of 5. How many groups?", "a": "5", "show": "5", "hint": "Subtract the absent students first, then divide.", "why": "28 − 3 = 25. 25 ÷ 5 = 5."}, {"t": "A student says 4 × 198 + 12 = 1,100. Estimate to check. Is it reasonable?", "o": ["Yes. It is close to 1,000", "No. 4 × 200 is about 800, so the answer should be near 800", "You cannot tell"], "c": 1, "show": "No. 4 × 200 is about 800, so the answer should be near 800", "hint": "Round 198 to 200 and multiply by 4.", "why": "The real answer is 804. The estimate shows 1,100 is too big."}, {"t": "\"Twice a number, plus 9, is 41.\" What is the number?", "a": "16", "show": "16", "hint": "2 × n + 9 = 41. Subtract 9, then divide by 2.", "why": "2n + 9 = 41, so 2n = 32 and n = 16."}, {"t": "A shop sells 15 shirts a day for 6 days at $12 each. How many dollars did it take in?", "a": "1080", "show": "1,080", "hint": "15 × 6 shirts, then × 12 dollars.", "why": "15 × 6 = 90 shirts. 90 × 12 = 1,080."}];
/* order of operations stepper: whole numbers, + - × ÷ and parentheses */
function tok(s){s=s.replace(/[*xX]/g,'×').replace(/\//g,'÷').replace(/[-–]/g,'−');const t=[];let i=0;while(i<s.length){const c=s[i];if(c===' '){i++;continue;}if(/[0-9]/.test(c)){let j=i;while(j<s.length&&/[0-9]/.test(s[j]))j++;t.push(Number(s.slice(i,j)));i=j;}else if('+−×÷()'.indexOf(c)>=0){t.push(c);i++;}else return null;}return t;}
function ts(t){return t.map(x=>typeof x==='number'?fmt(x):x).join(' ').replace(/\( /g,'(').replace(/ \)/g,')');}
function stepOnce(t){
  let a=-1,b=-1;
  for(let i=0;i<t.length;i++){if(t[i]==='(')a=i;if(t[i]===')'&&a>=0){b=i;break;}}
  let lo=0,hi=t.length;if(a>=0&&b>a){lo=a+1;hi=b;}
  const seg=t.slice(lo,hi);
  if(a>=0&&seg.length===1)return {t:t.slice(0,a).concat(seg,t.slice(b+1)),note:'Parentheses done'};
  let k=-1;for(let i=0;i<seg.length;i++){if(seg[i]==='×'||seg[i]==='÷'){k=i;break;}}
  let why='Multiply or divide first, left to right';
  if(k<0){for(let i=0;i<seg.length;i++){if(seg[i]==='+'||seg[i]==='−'){k=i;break;}}why='Add or subtract, left to right';}
  if(k<1||k>=seg.length-1||typeof seg[k-1]!=='number'||typeof seg[k+1]!=='number')return null;
  const x=seg[k-1],y=seg[k+1],o=seg[k];let r;
  if(o==='+')r=x+y;else if(o==='−')r=x-y;else if(o==='×')r=x*y;else{if(y===0||x%y!==0)return {err:'This tool only does divisions that come out even.'};r=x/y;}
  const ns=seg.slice(0,k-1).concat([r],seg.slice(k+2));
  return {t:t.slice(0,lo).concat(ns,t.slice(hi)),note:(a>=0?'Inside the parentheses: ':'')+why+': '+fmt(x)+' '+o+' '+fmt(y)+' = '+fmt(r)};
}
function opTool(){
  const t=tok($('oe').value);let h='';
  if(!t||!t.length){$('opr').innerHTML='<p class="small">Type an expression like 6 + 4 × 5 or (6 + 4) × 5. You can use + − × ÷ and ( ).</p>';return;}
  let cur=t,n=0;h+='<li><b>'+ts(cur)+'</b></li>';
  while(cur.length>1&&n++<14){const s=stepOnce(cur);if(!s){h+='<li class="small">I could not finish this one. Check the brackets and signs.</li>';break;}if(s.err){h+='<li class="small">'+s.err+'</li>';break;}cur=s.t;h+='<li><span class="small">'+s.note+'</span><br><b>'+ts(cur)+'</b></li>';}
  $('opr').innerHTML='<ol class="steps">'+h+'</ol>';
}
function unkTool(){
  const f=$('uf').value,a=gv('ua',1,999),b=gv('ub',1,9999);let n,inv,ok=true;
  if(f==='add'){n=b-a;inv=b+' − '+a;}else if(f==='sub'){n=b+a;inv=b+' + '+a;}else if(f==='mul'){n=b/a;inv=b+' ÷ '+a;ok=b%a===0;}else{n=b*a;inv=b+' × '+a;}
  const eq={add:'n + '+a+' = '+b,sub:'n − '+a+' = '+b,mul:a+' × n = '+b,div:'n ÷ '+a+' = '+b}[f];
  $('ur').innerHTML='<div class="out2"><b>'+eq+'</b><br>'+(ok?'Do the opposite operation: n = '+inv+' = <b>'+fmt(n)+'</b>.<br>Check: put '+fmt(n)+' back in. '+eq.replace('n',fmt(n))+' ✓':'That does not come out as a whole number. Try other numbers.')+'</div>';
}
function rA(){secPage('a','<div class="card"><h1>Multi-step problems</h1><p class="small">About 15 minutes. This is practice only. Nothing here is saved or graded.</p><h2 style="margin-top:12px">Order of operations</h2>'
 +'<div class="rule">1. Do what is inside <b>parentheses</b>. 2. Then <b>× and ÷</b>, left to right. 3. Then <b>+ and −</b>, left to right.</div>'
 +'<h3>Try it. Type any expression and watch each step.</h3><div class="row"><input class="num" id="oe" style="width:100%" value="3 × (4 + 5) − 7" oninput="opTool()" autocomplete="off"></div><div id="opr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>A letter for the unknown</h2>'
 +'<div class="rule">Use a letter like n for the number you do not know. To solve, do the opposite operation: undo + with −, undo − with +, undo × with ÷, undo ÷ with ×.</div>'
 +'<h3>Try it. Pick a shape and type the numbers.</h3><div class="row"><select class="num" id="uf" onchange="unkTool()" style="width:auto"><option value="add">n + a = b</option><option value="sub">n − a = b</option><option value="mul">a × n = b</option><option value="div">n ÷ a = b</option></select><span>a</span><input class="num" id="ua" value="17" oninput="unkTool()" inputmode="numeric"><span>b</span><input class="num" id="ub" value="52" oninput="unkTool()" inputmode="numeric"></div><div id="ur"></div></div>',SECB);}

function listHTML(sec,arr){let h='';arr.forEach((q,i)=>{h+=qHTML(sec,i,q);});return h;}

function secPage(id,intro,items,last){SECTOTAL=items.length;$('stage').innerHTML=intro+'<div class="card"><h2>Check it</h2>'+listHTML(id,items)+nav(last)+'</div>';}

}
