<script>
const $=id=>document.getElementById(id);
const PLACES=['Millions','Hundred thousands','Ten thousands','Thousands','Hundreds','Tens','Ones'];
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+$)/g,',');}
function w999(n){let s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>=20){s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}else if(n>0||!s.length)s.push(ONES[n]);return s.join(' ');}
function toWords(n){
  if(n===0)return 'zero';
  if(n===1000000)return 'one million';
  const th=Math.floor(n/1000),r=n%1000;let out=[];
  if(th)out.push(w999(th)+' thousand');
  if(r)out.push(w999(r));
  return out.join(', ');
}
function expanded(n){
  const s=String(n),L=s.length,parts=[];
  for(let i=0;i<L;i++){if(s[i]!=='0')parts.push(fmt(s[i]+'0'.repeat(L-1-i)));}
  return parts.join(' + ');
}
function chartHTML(n){
  const s=String(n).padStart(7,'0');let h='<div class="chart">';
  let lead=true;
  for(let i=0;i<7;i++){
    if(s[i]!=='0')lead=false;
    const show=!lead||i===6;
    const val=s[i]==='0'?'':fmt(s[i]+'0'.repeat(6-i));
    h+='<div class="cc"><div class="nm">'+PLACES[i]+'</div><div class="dg'+(show?'':' z')+'">'+(show?s[i]:'0')+'</div><div class="vl">'+(show?val:'')+'</div></div>';
    if(i===0||i===3)h+='<div class="cm">'+((i===3||n>=1000000)?',':'')+'</div>';
  }
  return h+'</div>';
}
/* ---------- question engine ---------- */
const MOM=/[?&]mom=1/.test(location.search);
let QS={};let TOTAL=0;let FIRST=0;let ANSWERED=0;
function norm(v){return String(v==null?'':v).replace(/[−–]/g,'-').replace(/[,\s$]/g,'');}
function qHTML(sec,i,q){
  if(MOM){
    let h='<div class="q good"><div class="t">'+(i+1)+'. '+q.t+'</div>';
    if(q.o)q.o.forEach((o,j)=>{h+='<div class="opt'+(q.sym?' sym':'')+(j===q.c?' right':'')+'" style="cursor:default">'+o+(j===q.c?' ✓':'')+'</div>';});
    return h+'<div class="res">Answer: '+q.show+(q.why?'. '+q.why:'')+'</div></div>';
  }
  const id=sec+i;QS[id]={q:q,tries:0,done:false};TOTAL++;
  let h='<div class="q" id="q-'+id+'"><div class="t">'+(i+1)+'. '+q.t+'</div>';
  if(q.o){q.o.forEach((o,j)=>{h+='<button class="opt'+(q.sym?' sym':'')+'" onclick="pickQ(\''+id+'\','+j+',this)">'+o+'</button>';});}
  else h+='<div class="row"><input class="num" id="in-'+id+'" inputmode="'+kpFor(q.a)+'" autocomplete="off" placeholder="Your answer" onkeydown="if(event.key===\'Enter\')checkQ(\''+id+'\')"><button class="btn" onclick="checkQ(\''+id+'\')">Check</button></div>';
  return h+'<div class="res" id="res-'+id+'"></div></div>';
}
function finishQ(id,ok){
  const s=QS[id];if(s.done)return;
  s.tries++;
  const el=$('q-'+id),res=$('res-'+id);
  if(ok){
    s.done=true;ANSWERED++;if(s.tries===1)FIRST++;
    el.className='q good';res.textContent='✓ Correct'+(s.q.why?'. '+s.q.why:'');
  }else{
    el.className='q bad';
    if(s.tries>=2){s.done=true;ANSWERED++;res.textContent='The answer is '+s.q.show+'. '+(s.q.why||'')+' Ask Mom if you are not sure why.';
      const i=$('in-'+id);if(i)i.disabled=true;
    }else res.textContent='Not quite. '+(s.q.hint||'Look at the rule above and try again.');
  }
  upd();
}

function parseV(s){
  s=String(s==null?'':s).trim().replace(/[−–]/g,'-').replace(/,/g,'');let m;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/)){const sg=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return {form:'mixed',n:sg*(w*d+n),d:d,fn:n,fd:d};}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){const d=+m[2];if(!d)return null;return {form:'frac',n:+m[1],d:d};}
  if(m=s.match(/^(-?)(\d*)\.(\d+)$/)){const sg=m[1]?-1:1;const fd=Math.pow(10,m[3].length);return {form:'dec',n:sg*(+(m[2]||0)*fd+ +m[3]),d:fd};}
  if(m=s.match(/^(-?\d+)$/))return {form:'int',n:+m[1],d:1};
  if(m=s.match(/^(\d+)\s*[rR]\s*(\d+)$/))return {form:'rem',q:+m[1],r:+m[2]};
  return null;
}
function gcdv(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function eqv(raw,ans){
  const x=parseV(raw),y=parseV(ans);if(!x||!y)return false;
  if(y.form==='rem')return x.form==='rem'&&x.q===y.q&&x.r===y.r;
  if(x.form==='rem')return false;
  if(x.n*y.d!==y.n*x.d)return false;
  if(y.form==='int'||y.form==='dec')return x.form==='int'||x.form==='dec';
  if(y.form==='frac')return x.form==='frac'&&gcdv(x.n,x.d)===1;
  if(y.form==='mixed')return x.form==='mixed'&&x.fn<x.fd&&gcdv(x.fn,x.fd)===1;
  return false;
}
function kpFor(a){a=String(a);return /[\/ ]/.test(a)||/r/i.test(a)?'text':/\./.test(a)?'decimal':'numeric';}
function checkQ(id){
  const s=QS[id];if(s.done)return;
  const v=norm($('in-'+id).value);if(!v)return;
  finishQ(id,eqv($('in-'+id).value,s.q.a));
}
function pickQ(id,j,btn){
  const s=QS[id];if(s.done)return;
  const ok=j===s.q.c;
  btn.className='opt '+(ok?'right':'wrong');
  finishQ(id,ok);
  if(s.done&&!ok){[].slice.call($('q-'+id).querySelectorAll('.opt'))[s.q.c].className='opt right';}
}
function upd(){const b=$('nextbtn');if(b)b.disabled=ANSWERED-SECBASE<SECTOTAL;const c=$('cnt');if(c)c.textContent=ANSWERED-SECBASE+' of '+SECTOTAL+' answered';}

/* ---------- sections ---------- */
const SECA=[{"t": "Write 1/2 as a decimal.", "a": "0.5", "show": "0.5", "hint": "Make the denominator 10 or 100: 1/2 = ?/10.", "why": "1/2 = 50/100 = 0.5."}, {"t": "Write 1/4 as a decimal.", "a": "0.25", "show": "0.25", "hint": "Make the denominator 10 or 100: 1/4 = ?/100.", "why": "1/4 = 25/100 = 0.25."}, {"t": "Write 3/4 as a decimal.", "a": "0.75", "show": "0.75", "hint": "Make the denominator 10 or 100: 3/4 = ?/100.", "why": "3/4 = 75/100 = 0.75."}, {"t": "Write 7/4 as a decimal.", "a": "1.75", "show": "1.75", "hint": "Make the denominator 10 or 100: 7/4 = ?/100.", "why": "7/4 = 175/100 = 1.75."}, {"t": "Write 1/5 as a decimal.", "a": "0.2", "show": "0.2", "hint": "Make the denominator 10 or 100: 1/5 = ?/10.", "why": "1/5 = 20/100 = 0.2."}, {"t": "Write 3/5 as a decimal.", "a": "0.6", "show": "0.6", "hint": "Make the denominator 10 or 100: 3/5 = ?/10.", "why": "3/5 = 60/100 = 0.6."}, {"t": "Write 2/5 as a decimal.", "a": "0.4", "show": "0.4", "hint": "Make the denominator 10 or 100: 2/5 = ?/10.", "why": "2/5 = 40/100 = 0.4."}, {"t": "Write 1/10 as a decimal.", "a": "0.1", "show": "0.1", "hint": "Make the denominator 10 or 100: 1/10 = ?/10.", "why": "1/10 = 10/100 = 0.1."}, {"t": "Write 9/20 as a decimal.", "a": "0.45", "show": "0.45", "hint": "Make the denominator 10 or 100: 9/20 = ?/100.", "why": "9/20 = 45/100 = 0.45."}, {"t": "Write 3/2 as a decimal.", "a": "1.5", "show": "1.5", "hint": "Make the denominator 10 or 100: 3/2 = ?/10.", "why": "3/2 = 150/100 = 1.5."}, {"t": "Write 0.5 as a fraction in simplest form.", "a": "1/2", "show": "1/2", "hint": "0.5 = 50/100. Simplify.", "why": "0.5 = 50/100 = 1/2."}, {"t": "Write 0.25 as a fraction in simplest form.", "a": "1/4", "show": "1/4", "hint": "0.25 = 25/100. Simplify.", "why": "0.25 = 25/100 = 1/4."}, {"t": "Write 0.75 as a fraction in simplest form.", "a": "3/4", "show": "3/4", "hint": "0.75 = 75/100. Simplify.", "why": "0.75 = 75/100 = 3/4."}, {"t": "Write 0.2 as a fraction in simplest form.", "a": "1/5", "show": "1/5", "hint": "0.2 = 20/100. Simplify.", "why": "0.2 = 20/100 = 1/5."}];const SECB=[{"t": "Which symbol goes in the blank?  0.4  ___  0.36", "o": ["<", ">", "="], "c": 1, "show": ">", "hint": "Write both with the same number of decimal places: 0.40 and 0.36.", "why": "0.4 > 0.36."}, {"t": "Which symbol goes in the blank?  0.7  ___  0.70", "o": ["=", "<", ">"], "c": 0, "show": "=", "hint": "Write both with the same number of decimal places: 0.70 and 0.70.", "why": "0.7 = 0.70."}, {"t": "Which symbol goes in the blank?  0.09  ___  0.1", "o": [">", "<", "="], "c": 1, "show": "<", "hint": "Write both with the same number of decimal places: 0.09 and 0.10.", "why": "0.09 < 0.1."}, {"t": "Which symbol goes in the blank?  0.58  ___  0.6", "o": [">", "=", "<"], "c": 2, "show": "<", "hint": "Write both with the same number of decimal places: 0.58 and 0.60.", "why": "0.58 < 0.6."}, {"t": "Which symbol goes in the blank?  1.25  ___  1.3", "o": ["<", ">", "="], "c": 0, "show": "<", "hint": "Write both with the same number of decimal places: 1.25 and 1.30.", "why": "1.25 < 1.3."}, {"t": "Which symbol goes in the blank?  0.45  ___  0.5", "o": ["<", ">", "="], "c": 0, "show": "<", "hint": "Write both with the same number of decimal places: 0.45 and 0.50.", "why": "0.45 < 0.5."}, {"t": "Which number is the greatest?  0.3, 0.29, 0.31", "o": ["0.3", "0.29", "0.31"], "c": 2, "show": "0.31", "hint": "Compare the tenths first, then the hundredths.", "why": "0.31 is the greatest."}, {"t": "Which number is the least?  0.62, 0.6, 0.06", "o": ["0.06", "0.62", "0.6"], "c": 0, "show": "0.06", "hint": "Compare the tenths first, then the hundredths.", "why": "0.06 is the least."}, {"t": "Order from least to greatest:  0.5, 0.45, 0.54", "o": ["0.5, 0.45, 0.54", "0.45, 0.5, 0.54", "0.54, 0.5, 0.45"], "c": 1, "show": "0.45, 0.5, 0.54", "hint": "Write each with 2 decimal places: 0.50, 0.45, 0.54.", "why": "0.45 < 0.50 < 0.54."}, {"t": "Order from greatest to least:  0.7, 0.07, 0.77", "o": ["0.07, 0.7, 0.77", "0.7, 0.77, 0.07", "0.77, 0.7, 0.07"], "c": 2, "show": "0.77, 0.7, 0.07", "hint": "0.7 = 0.70.", "why": "0.77 > 0.70 > 0.07."}];const SECC=[{"t": "Sam says 0.4 < 0.35 because 4 is less than 35. What went wrong?", "o": ["0.4 = 0.40, which is greater than 0.35", "Nothing, he is right", "0.4 and 0.35 are equal"], "c": 0, "show": "0.4 = 0.40, which is greater than 0.35", "hint": "Compare the same place values.", "why": "0.4 = 4 tenths = 40 hundredths, which is more than 35 hundredths."}, {"t": "Which decimal is the same as 1 3/4?", "o": ["1.34", "1.4", "1.75"], "c": 2, "show": "1.75", "hint": "3/4 = 0.75.", "why": "1 3/4 = 1 + 0.75 = 1.75."}, {"t": "Write 5/4 as a decimal.", "a": "1.25", "show": "1.25", "hint": "5/4 = 1 1/4 and 1/4 = 0.25.", "why": "5/4 = 1.25."}, {"t": "A bottle holds 3/4 liter. Write that as a decimal.", "a": "0.75", "show": "0.75", "hint": "3/4 = 75/100.", "why": "3/4 = 0.75 liter."}, {"t": "Which is greater, 3/4 or 0.7?", "o": ["3/4", "0.7", "They are equal"], "c": 0, "show": "3/4", "hint": "3/4 = 0.75.", "why": "3/4 = 0.75 and 0.75 > 0.70."}, {"t": "Which is closest to 1/2?", "o": ["0.51", "0.2", "0.9"], "c": 0, "show": "0.51", "hint": "1/2 = 0.50.", "why": "0.51 is only 0.01 away from 0.5."}];
function gcdf(a,b){return b?gcdf(b,a%b):a;}
function fbar(n,d,col){let h='<div style="display:flex;max-width:420px;border:2px solid #17607A;border-radius:6px;overflow:hidden;margin:3px 0">';for(let i=0;i<d;i++)h+='<div style="flex:1;height:22px;background:'+(i<n?col:'#fff')+';'+(i?'border-left:1px solid #17607A':'')+'"></div>';return h+'</div>';}
function fstr(n,d){const g=gcdf(n,d);n/=g;d/=g;if(d===1)return ''+n;return n+'/'+d;}
function mstr(n,d){const g=gcdf(n,d);n/=g;d/=g;const w=Math.floor(n/d),r=n%d;if(!r)return ''+w;return (w?w+' ':'')+r+'/'+d;}

function f2dTool(){
  const n=gv('fn',0,40),d=gv('fd',1,100);const v=n/d;
  let s=''+(Math.round(v*10000)/10000);
  const tenth=(100%d===0||10%d===0);
  $('fr').innerHTML='<div class="out2"><b>'+n+'/'+d+' ≈ '+s+'</b><br>'+(100%d===0?n+'/'+d+' = '+n*100/d+'/100 = '+(n*100/d/100).toFixed(2)+' (multiply top and bottom by '+100/d+')':'This one does not make a denominator of 100 neatly. Divide: '+n+' ÷ '+d+' = '+s+'…')+'</div>';
}
function cmpTool(){
  const a=parseFloat($('ca').value.replace(',','.')),b=parseFloat($('cb').value.replace(',','.'));
  if(isNaN(a)||isNaN(b)){$('cr').innerHTML='';return;}
  const dp=Math.max((''+$('ca').value).split('.')[1]?.length||0,(''+$('cb').value).split('.')[1]?.length||0,1);
  $('cr').innerHTML='<div class="out2">With the same number of places: '+a.toFixed(dp)+' and '+b.toFixed(dp)+'<br><b>'+a+' '+(a>b?'>':a<b?'<':'=')+' '+b+'</b></div>';
}
function rA(){secPage('a','<div class="card"><h1>Fractions and decimals that match</h1><p class="small">About 15 minutes. Practice only. Nothing here is saved or graded.</p><div class="rule">Know these: <b>1/2 = 0.5</b>, <b>1/4 = 0.25</b>, <b>3/4 = 0.75</b>, <b>1/5 = 0.2</b>, <b>1/10 = 0.1</b>. To change a fraction to a decimal, make the denominator 10 or 100: 3/5 = 6/10 = 0.6. Write simplest-form fractions when a question asks for a fraction.</div>'
 +'<h3>Try it</h3><div class="row"><span class="fin"><input class="num" id="fn" value="3" oninput="f2dTool()" inputmode="numeric"><i></i><input class="num" id="fd" value="4" oninput="f2dTool()" inputmode="numeric"></span></div><div id="fr"></div></div>',SECA);}
function rB(){secPage('b','<div class="card"><h2>Comparing decimals</h2><div class="rule">To compare decimals, line up the decimal points and compare place by place from the left. <b>0.4 = 0.40</b>, so 0.4 is greater than 0.36. A longer decimal is not always bigger.</div>'
 +'<h3>Try it</h3><div class="row"><input class="num" id="ca" value="0.4" oninput="cmpTool()" inputmode="decimal"><span>and</span><input class="num" id="cb" value="0.36" oninput="cmpTool()" inputmode="decimal"></div><div id="cr"></div></div>',SECB);}
function rC(){secPage('c','<div class="card"><h2>Putting it together</h2><div class="rule">Rename fractions as decimals so you can compare them, and use 0.5 as a benchmark.</div></div>',SECC,true);}

const SECFNS=[rA,rB,rC];
function INITS(){if($('fn'))f2dTool();if($('ca'))cmpTool();}
const ORAL=["How do you know 3/4 = 0.75?", "Which is greater, 0.4 or 0.36? Explain without saying \"longer\".", "Put 0.5, 0.45 and 0.54 in order and say how you did it."];
const WEEKNO=19;

let SECBASE=0,SECTOTAL=0,ST=0;
const MOM2=MOM;
function momGate(cb){cb();} /* PIN turned off for now */
function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}

function begin(){
  const ml=$('modeLink');
  if(MOM){ml.textContent='Student view';ml.href=location.pathname;momGate(buildMom);return;}
  ml.href=location.pathname+'?mom=1';ST=0;render();
}
function buildMom(){
  let all='<div class="card" style="border-top-color:#C9972B"><h2>Mom view</h2><p>The whole lesson on one page, with every answer shown. Nothing is scored or saved. Click Student view to give it to Ryder.</p></div>';
  SECFNS.forEach(fn=>{fn();all+=$('stage').innerHTML;});
  all+='<div class="card"><h2>Check him on these, out loud</h2><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="small">If he does these well, tick them on his rung in Math Home. If he is solid, let him test out.</p></div>';
  $('stage').innerHTML=all;$('bar').style.width='100%';INITS();
}
function bar(){$('bar').style.width=Math.round(ST/(SECFNS.length)*100)+'%';}
function nav(last){if(MOM)return '';return '<div class="row" style="margin-top:14px"><button class="btn" id="nextbtn" onclick="nextSec()" disabled>'+(last?'Finish':'Next')+'</button><span class="small" id="cnt"></span></div>';}
function nextSec(){ST++;render();window.scrollTo(0,0);}
function listHTML(sec,arr){let h='';arr.forEach((q,i)=>{h+=qHTML(sec,i,q);});return h;}
function render(){bar();QS={};SECBASE=ANSWERED;if(ST>=SECFNS.length){rDone();return;}SECFNS[ST]();INITS();upd();}
function secPage(id,intro,items,last){SECTOTAL=items.length;$('stage').innerHTML=intro+'<div class="card"><h2>Check it</h2>'+listHTML(id,items)+nav(last)+'</div>';}
function rDone(){
  const pct=Math.round(FIRST/TOTAL*100);
  $('stage').innerHTML='<div class="card"><h1>Done</h1><p>First-try correct: <span class="score">'+FIRST+' of '+TOTAL+'</span></p>'
   +'<p>'+(pct>=85?'That is strong. Tell Mom you may be ready to test out of Week '+WEEKNO+'.':pct>=60?'Good start. Look again at anything you missed, then tell Mom.':'Go back through the rules with Mom before you test out.')+'</p>'
   +'<h3>Now say these to Mom, out loud</h3><ul>'+ORAL.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
   +'<div class="row" style="margin-top:14px"><a class="btn" style="text-decoration:none" href="../wade-math-home.html#/kid/ryder">Back to Math Home</a><button class="btn alt" onclick="location.reload()">Do it again</button></div></div>';
}
function gv(id,lo,hi){let v=parseInt(norm($(id).value),10);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v));}
function fmt(n){return Number(n).toLocaleString('en-US');}
begin();

</script>
